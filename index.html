<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scheme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 1 - Number Systems and Binary Arithmetic</title>
<style>

:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1320; --panel: #161d2f; --panel-2: #1d2640; --text: #e8edf8; --muted: #9aa6c0;
  --border: #2a3550; --accent: #7b93ff; --accent-ink: #0b1020; --good: #34d399; --bad: #f87171;
  --code-bg: #0a0f1c; --track: #26304a; --hint: #f59e0b; --hint-text: #fbbf24;
  --accent-text: #7b93ff;   /* the accent as text / border / focus ring colour (--accent itself is for fills) */
  --practice: #22d3ee; --practice-text: #67e8f9; --practice-ink: #042f3a;   /* aqua: questions solved in a missed-questions drill */
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5fb; --panel: #ffffff; --panel-2: #eef1fa; --text: #192036; --muted: #59647f;
  --border: #d3daea; --accent: #4361ee; --accent-ink: #ffffff; --good: #12a36b; --bad: #dc3d3d;
  --code-bg: #f0f2f8; --track: #dfe4f1; --hint: #f59e0b; --hint-text: #b45309;
  --accent-text: #4361ee;
  --practice: #22d3ee; --practice-text: #0a6580; --practice-ink: #042f3a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); min-height: 100vh;
       font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }
.topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
.brand { font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 140px; }
.topbar-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn.aqua { background: var(--practice); color: var(--practice-ink); border-color: transparent; }   /* "← Go back to quiz results" */
.btn.aqua:hover { filter: brightness(1.08); }
.drill-title { margin: 0 0 14px; font-size: 1.5rem; line-height: 1.25; }
h1 { margin: 0 0 8px; font-size: 1.9rem; line-height: 1.2; }
h2 { margin: 0 0 12px; font-size: 1.2rem; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.card.center { text-align: center; padding: 44px 20px; }
.btn { appearance: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
       padding: 11px 20px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: .88rem; }
.btn.big { padding: 14px 34px; font-size: 1.1rem; margin-top: 22px; }
.notice { display: inline-block; margin-top: 14px; padding: 8px 14px; border-radius: 10px;
          background: var(--panel-2); border: 1px solid var(--border); font-size: .92rem; }

.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: .92rem; }
.tag { padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--panel-2);
       border: 1px solid var(--border); }
.q-num { font-weight: 700; color: var(--text); }
.verdict { margin-left: auto; font-weight: 700; color: var(--text); }
.progress { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.progress-bar { height: 100%; background: var(--accent); transition: width .3s; }

.rich { overflow-wrap: anywhere; }
.rich img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 8px 0; }
.rich pre { background: var(--code-bg); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 10px 0;
            font: .88rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
.rich code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.prompt { font-size: 1.12rem; margin-bottom: 18px; }

.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; cursor: pointer;
          background: var(--panel-2); border: 2px solid var(--border); transition: border-color .15s, background .15s; }
.option:hover { border-color: var(--accent-text); }
.option input { position: absolute; opacity: 0; pointer-events: none; }
.option-letter { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
                 font-weight: 700; font-size: .85rem; background: var(--panel); border: 1px solid var(--border); }
.option.selected { border-color: var(--accent-text); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.option.selected .option-letter { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.option.wrong, .short-input.wrong { border-color: var(--bad); }
.short-input { width: 100%; padding: 13px 14px; font: inherit; border-radius: 12px; color: var(--text);
               background: var(--panel-2); border: 2px solid var(--border); }
.short-input:focus { outline: none; border-color: var(--accent-text); }
.short-input.wrong:focus { border-color: var(--bad); }

.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--bad);
            background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.feedback strong.bad { color: var(--bad); }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.score-line { font-size: 1.15rem; margin: 4px 0 0; }
.subject-bar { margin-bottom: 22px; }
.subject-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-weight: 600; }
.subject-head span:last-child { color: var(--muted); font-weight: 500; font-size: .9rem; }
.track { position: relative; height: 26px; background: var(--track); border-radius: 8px; overflow: hidden; }
.fill { height: 100%; width: var(--w); border-radius: 8px; animation: grow .8s ease-out; }
.fill.pass { background: var(--good); } .fill.fail { background: var(--bad); }
.mark90 { position: absolute; top: 0; bottom: 0; left: 90%; width: 2px; background: var(--text); opacity: .45; }
.pct { font-weight: 700; margin-top: 6px; }
.badge { font-size: 1.6rem; line-height: 1.2; }
@keyframes grow { from { width: 0; } }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.result-item { border-left: 5px solid var(--border); }
.result-item.ok { border-left-color: var(--good); } .result-item.bad { border-left-color: var(--bad); }
.answer-line { margin: 6px 0; }
.answer-line.correct strong { color: var(--good); }
.answer-line.mine strong { color: var(--muted); }
.answer-items { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; }   /* multi-select: one answer per line, no separators */
.answer-items li { padding-left: 10px; border-left: 3px solid var(--border); overflow-wrap: anywhere; }
.answer-line.correct .answer-items li { border-left-color: var(--good); }
.result-item.practice { border-left-color: var(--practice); }
.verdict.practice { color: var(--practice-text); }
.explanation { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--border); }
.explanation ul { margin: 6px 0 0; padding-left: 20px; }
/* Strict Mode toggle + help popover (title screen) */
.strict-row { position: relative; display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.slider { position: relative; flex: none; width: 46px; height: 26px; border-radius: 99px;
          background: var(--track); border: 1px solid var(--border); transition: background .2s; }
.slider::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
                 border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + .slider { background: var(--accent); border-color: transparent; }
.switch input:checked + .slider::after { transform: translateX(20px); background: var(--accent-ink); }
.switch input:focus-visible + .slider { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.help-btn { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1px solid var(--border);
            background: var(--panel-2); color: var(--text); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
.help-btn:hover, .help-btn[aria-expanded="true"] { border-color: var(--accent-text); color: var(--accent-text); }
.help-pop { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); z-index: 5;
            width: min(280px, 86vw); padding: 10px 14px; border-radius: 10px; text-align: left; font-size: .92rem; font-weight: 400;
            background: var(--panel-2); border: 1px solid var(--border); box-shadow: 0 8px 24px #0005; }
/* Question palette (numbered squares) */
.palette-card { padding: 14px 16px; }
.palette-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 10px; }
.palette-head > strong { margin-right: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px;
                       border-radius: 3px; border: 1px solid #c7cde0; background: #ffffff; }
.legend .lg-flag::before { background: #facc15; border-color: #d9ac00; }
.legend .lg-done::before { background: var(--good); border-color: transparent; }
.legend .lg-skip::before { background: var(--bad); border-color: transparent; }
.legend .lg-practice::before { background: var(--practice); border-color: transparent; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px;
           max-height: 176px; overflow-y: auto; padding: 4px 3px; }
.sq { position: relative; height: 38px; padding: 0; border-radius: 8px; border: 1px solid #c7cde0;
      background: #ffffff; color: #141a2c; font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; }
.sq:hover { filter: brightness(.93); }
.sq.flagged { background: #facc15; border-color: #d9ac00; }
.sq.done { background: var(--good); border-color: transparent; color: #04140d; }
.sq.skipped, .sq.wrong { background: var(--bad); border-color: transparent; color: #1a0505; }
.sq.practice { background: var(--practice); border-color: transparent; color: var(--practice-ink); }
.sq.current { outline: 3px solid var(--accent-text); outline-offset: 1px; }
.sq[data-badge]::after { content: attr(data-badge); position: absolute; top: -5px; right: -4px; padding: 2px 3px;
                         font-size: .62rem; line-height: 1; border-radius: 6px;
                         background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.flag-btn.on { background: #facc15; border-color: #d9ac00; color: #1c1500; }

/* Strict-mode feedback, answer highlights, nav row */
.feedback .title { font-weight: 700; }
.feedback.bad .title { color: var(--bad); }
.feedback.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--panel)); }
.feedback.good .title { color: var(--good); }
.feedback p { margin: 8px 0 0; }
.feedback .rich { margin-top: 8px; }
.feedback ul { margin: 6px 0 0; padding-left: 20px; }
.option.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel-2)); }
.option.right::after, .option.wrong::after { margin-left: auto; padding-left: 8px; flex: none; font-weight: 700; }
.option.right::after { content: "✓"; color: var(--good); }
.option.wrong::after { content: "✕"; color: var(--bad); }
.option.locked { cursor: default; }
.option.locked:hover:not(.right):not(.selected) { border-color: var(--border); }
.short-input.right { border-color: var(--good); }
.short-input:disabled { opacity: .85; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; }
.nav .spacer { flex: 1; }
.btn.ghost.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); }
.btn[hidden] { display: none; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5, 8, 16, .65); }
.modal { width: min(440px, 100%); padding: 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 20px 60px #0008; }
.modal h2 { margin: 0 0 8px; }
.modal p { margin: 0; }
.modal .actions { justify-content: flex-end; flex-wrap: wrap; }
/* Wrong-option notes: shown right under the option the player picked, and kept */
.option-item { display: grid; }
.option-note { margin: 6px 0 2px 12px; padding: 9px 12px; border-radius: 10px; border-left: 4px solid var(--bad);
               background: color-mix(in srgb, var(--bad) 10%, var(--panel)); font-size: .94rem; overflow-wrap: anywhere; }
.verdict { display: inline-flex; align-items: center; gap: 8px; }

/* Hints: orange button below the question; each click reveals the next hint */
.hint-area { display: grid; gap: 10px; justify-items: start; margin: 0 0 18px; }
.hint-list { display: grid; gap: 10px; width: 100%; }
.hint-list:empty { display: none; }
.hint-box { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--hint);
            background: color-mix(in srgb, var(--hint) 12%, var(--panel)); }
.hint-label { display: block; margin-bottom: 4px; color: var(--hint-text); }
.hint-btn { appearance: none; border: 0; background: var(--hint); color: #1c1200; padding: 9px 16px; border-radius: 10px;
            font: inherit; font-weight: 700; cursor: pointer; }
.hint-btn:hover { filter: brightness(1.08); }
.hint-btn:focus-visible { outline: 2px solid var(--hint-text); outline-offset: 2px; }

/* Multi-select: a square check box in front of the letter badge ("select all that apply") */
.multi-hint { margin: 0 0 10px; color: var(--muted); font-size: .92rem; }
.option-check { position: relative; width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--muted);
                background: var(--panel); transition: background .15s, border-color .15s; }
.option.selected .option-check { background: var(--accent); border-color: var(--accent-text); }
.option.selected .option-check::after { content: ""; position: absolute; left: 6px; top: 1px; width: 5px; height: 11px;
                                        border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.option.multi.selected .option-letter { background: var(--panel); color: var(--text); border-color: var(--border); }
.option input:focus-visible + .option-letter, .option input:focus-visible + .option-check { outline: 2px solid var(--accent-text); outline-offset: 2px; }

/* Fill in the Table: monospaced, centred cells. A custom colour (--tc, set inline) is blended into the surface colour, so it stays
   readable in every colour scheme and in light and dark mode; the text colour never changes. */
.ft-scroll { max-width: 100%; overflow-x: auto; margin: 2px 0 4px; }
.ft { border-collapse: collapse; max-width: 100%; background: var(--panel); color: var(--text);
      font: 600 .98rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.ft.fixed { table-layout: fixed; }
.ft th, .ft td { position: relative; border: 1px solid var(--border); padding: 8px 12px; text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
.ft th { font-weight: 700; background: color-mix(in srgb, var(--accent) 24%, var(--panel)); }
.ft th.tc { background: color-mix(in srgb, var(--tc) 30%, var(--panel)); }
.ft td.tc { background: color-mix(in srgb, var(--tc) 24%, var(--panel)); }
.ft-input { display: block; width: 100%; min-width: 0; margin: 0 auto; padding: 6px; font: inherit; text-align: center; color: var(--text);
            background: var(--panel-2); border: 2px solid var(--border); border-radius: 8px; }
.ft-input.sized { width: calc(var(--n) * 1ch + 24px); max-width: 100%; }
.ft-input:focus { outline: none; border-color: var(--accent-text); }
.ft-input.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel-2)); }
.ft-input.wrong:focus { border-color: var(--bad); }
.ft-input.right { border-color: var(--good); }
.ft-input:disabled { opacity: .9; }
.ft td.wrong::after, .ft td.right::after { position: absolute; top: 0; right: 3px; font-size: .65rem; line-height: 1.2; font-weight: 700; }
.ft td.wrong::after { content: "✕"; color: var(--bad); }
.ft td.right::after { content: "✓"; color: var(--good); }
/* results + skip feedback: the filled-in table, with the expected answer under every missed cell */
.ft-review { margin: 8px 0 4px; } .ft-review .ft.fixed { table-layout: auto; }   /* the review may grow past an authored width: the wrapper scrolls */
.ft-caption { margin: 0 0 6px; color: var(--muted); font-size: .9rem; }
.ft td.ok { outline: 2px solid var(--good); outline-offset: -2px; }
.ft td.bad { outline: 2px solid var(--bad); outline-offset: -2px; min-width: 5.5rem; padding-left: 6px; padding-right: 6px; }   /* room for "Expected:" in narrow columns */
.ft-got { font-weight: 700; overflow-wrap: anywhere; }
.ft-exp { margin-top: 4px; font-size: .84rem; font-weight: 500; overflow-wrap: anywhere; }
.ft td.ok .ft-mark { color: var(--good); }
.ft td.bad .ft-mark { color: var(--bad); }
@media (max-width: 480px) { .ft { font-size: .9rem; } .ft th, .ft td { padding: 6px 8px; } }

/* Title screen: session settings (Strict Mode, Shuffle, Exam Timer) and the print button */
.settings { display: inline-grid; gap: 14px; margin-top: 22px; text-align: left; justify-items: start; }
.settings .strict-row { margin-top: 0; }
.setting-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-weight: 600; }
.setting-select, .setting-num { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
                                background: var(--panel-2); color: var(--text); font: inherit; font-weight: 500; }
.setting-select:focus, .setting-num:focus { outline: none; border-color: var(--accent-text); }
.setting-num { width: 84px; }
.setting-error { flex-basis: 100%; margin: 0; color: var(--bad); font-size: .88rem; font-weight: 500; }
.title-actions { margin-top: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Exam timer: sticky bar at the top of the player while a timed run is going */
.timer { position: sticky; top: 0; z-index: 30; margin: 0 0 12px; padding: 8px 0 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.timer-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.timer-label { color: var(--muted); font-weight: 600; font-size: .92rem; }
.timer-clock { font: 700 1.35rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.timer-track { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.timer-fill { height: 100%; width: 100%; border-radius: 99px; background: var(--accent); transition: width .25s linear, background .3s; }
.timer.warn .timer-fill { background: var(--hint); } .timer.warn .timer-clock { color: var(--hint-text); }
.timer.danger .timer-fill { background: var(--bad); } .timer.danger .timer-clock { color: var(--bad); }

/* Scratchpad: floating button (bottom left) + collapsible note panel. Above the phone calculator sheet (--calc-h). */
.pad-btn { position: fixed; left: 12px; bottom: calc(12px + var(--calc-h, 0px)); z-index: 42; display: inline-flex; align-items: center; gap: 6px;
           padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
           font: inherit; font-size: .92rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px #0005; }
.pad-btn:hover, .pad-btn.on { border-color: var(--accent-text); }
.pad-btn.on { color: var(--accent-text); }
.pad { position: fixed; left: 12px; bottom: calc(62px + var(--calc-h, 0px)); z-index: 42; display: flex; flex-direction: column; gap: 8px;
       width: min(380px, calc(100vw - 24px)); max-height: max(160px, calc(100vh - 78px - var(--calc-h, 0px))); overflow-y: auto;
       padding: 10px 12px 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); box-shadow: 0 8px 30px #0006; }
.pad-head { display: flex; align-items: center; gap: 8px; }
.pad-title { margin-right: auto; font-weight: 700; }
.pad-area { display: block; width: 100%; height: 190px; min-height: 90px; resize: vertical; padding: 10px 12px; border-radius: 10px;
            border: 2px solid var(--border); background: var(--code-bg); color: var(--text); font: .95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.pad-area:focus { outline: none; border-color: var(--accent-text); }
/* Scratchpad tabs: a tab = [name][rename][close]; the "+" buttons sit outside the scrolling tab list so they are always reachable */
.pad-tabs { display: flex; align-items: center; gap: 6px; }
.pad-tablist { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.pad-add { display: flex; gap: 4px; flex: none; }
.pad-tab { display: inline-flex; align-items: center; flex: none; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); }
.pad-tab.active { border-color: var(--accent-text); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.pad-tab-btn, .pad-tab-ico { appearance: none; border: 0; background: none; color: var(--text); font: inherit; font-size: .85rem; font-weight: 600;
                             cursor: pointer; padding: 5px 8px; border-radius: 8px; }
.pad-tab-btn { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad-tab-ico { padding: 5px 6px; color: var(--muted); }
.pad-tab-ico:hover { color: var(--accent-text); }
.pad-tab-ico.close:hover { color: var(--bad); }
.pad-tab-btn:focus-visible, .pad-tab-ico:focus-visible, .pad-color:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; }
.pad-rename { width: 120px; padding: 5px 8px; border-radius: 8px; border: 2px solid var(--accent-text); background: var(--panel-2); color: var(--text); font: inherit; font-size: .85rem; }
.pad-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pad-tool[aria-pressed="true"] { border-color: var(--accent-text); color: var(--accent-text); }
.pad-colors { display: inline-flex; gap: 6px; padding: 0 2px; }
.pad-color { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--border); background: var(--c); cursor: pointer; }
.pad-color[aria-pressed="true"] { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.pad-size { width: 84px; accent-color: var(--accent); }
.pad-canvas { display: block; width: 100%; aspect-ratio: 8 / 5; border-radius: 10px; border: 2px solid var(--border); background: #fff;
              touch-action: none; cursor: crosshair; }   /* white paper in every theme, so the pen colours always show; touch-action stops the page scrolling while you draw */
@media (min-width: 1100px) { .pad-btn { left: 16px; bottom: 16px; } .pad { left: 16px; bottom: 66px; max-height: calc(100vh - 82px); } }
/* phones: while the panel is open the page gets room beneath it, so everything can be scrolled clear of the panel (--pad-h is set from the panel's height) */
@media (max-width: 1099.98px) { body.pad-open { padding-bottom: calc(var(--pad-h, 0px) + 70px); } }

@media (max-width: 480px) { h1 { font-size: 1.55rem; } .card { padding: 16px; } .actions .btn { flex: 1; } .nav .btn { flex: 1; } .nav .spacer { display: none; } }
