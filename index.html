<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPCS211 Quizzes</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f7fb; --panel:#fff; --text:#141a2a; --muted:#5a667f; --border:#d9dfec; --accent:#3d5afe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1320; --panel:#161d2f; --text:#e8edf8; --muted:#9aa6c0; --border:#2a3550; --accent:#7b93ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.5; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 6px; font-size:1.8rem; }
  .sub { margin:0 0 28px; color:var(--muted); }
  .list { display:grid; gap:14px; }
  a.card { display:block; padding:18px 20px; background:var(--panel); border:1px solid var(--border); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
  .tag { font-size:.8rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .name { font-size:1.2rem; font-weight:600; margin:2px 0; }
  .desc { color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>CPCS211 Quizzes</h1>
  <p class="sub">Choose a quiz to start.</p>
  <div class="list">
    <a class="card" href="cpcs211-chapter-1.html">
      <div class="tag">Chapter 1</div>
      <div class="name">Number Systems and Binary Arithmetic</div>
    </a>
    <a class="card" href="cpcs211-chapter-2-part-1.html">
      <div class="tag">Chapter 2 · Part 1</div>
      <div class="name">Logic Quiz</div>
    </a>
  </div>
</main>
</body>
</html>
