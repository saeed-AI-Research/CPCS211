/** Optional text -> '' when it is null / undefined / "null" / "undefined" / blank, so nothing is shown for it. */
function cleanText(v) {
  if (v == null) return '';
  const s = String(v).trim();
  return /^(null|undefined)$/i.test(s) ? '' : s;
}
/** True when an HTML snippet has something visible (text or an image). Empty/null explanations render nothing. */
function hasRich(html) {
  const s = cleanText(html);
  if (!s) return false;
  const t = document.createElement('template');         // inert: images do not load
  t.innerHTML = s;
  if (t.content.querySelector('img')) return true;
  return cleanText(t.content.textContent) !== '';
}
const richDiv = (cls, html) => { const d = h('div', { class: (cls + ' rich').trim() }); d.innerHTML = html; return d; };
const fmtPct = p => (Math.floor(p * 10 + 1e-9) / 10) + '%';
/** Milliseconds -> "MM:SS" (minutes can pass 99). round: Math.round for a duration, Math.ceil for a countdown. */
const clockText = (ms, round = Math.round) => {
  const s = Math.max(0, round(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
/** Fisher-Yates shuffle; returns a new array and leaves the input alone. */
function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =====================================================================
   2. THEME  (dark by default, toggle for light)
   ===================================================================== */
const Theme = {
  KEY: 'quiz-theme',                                   // light / dark (shared by all quizzes opened from this browser)
  SCHEME_KEY: 'quiz-scheme:' + DATA.name,              // the colour scheme the player picked for THIS quiz (otherwise the author's default)
  init() {
    let t = 'dark';
    try { t = localStorage.getItem(this.KEY) || 'dark'; } catch (e) {}
    this.set(t);
    document.getElementById('theme-toggle').addEventListener('click', () =>
      this.set(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

    const list = Array.isArray(DATA.schemes) && DATA.schemes.length ? DATA.schemes : [{ id: 'blue', label: 'Blue (default)' }];
    const ids = list.map(s => s.id);
    const select = document.getElementById('scheme-select');
    select.replaceChildren(...list.map(s => h('option', { value: s.id }, s.label)));
    let scheme = ids.includes(DATA.scheme) ? DATA.scheme : ids[0];     // the author's default
    try { const saved = localStorage.getItem(this.SCHEME_KEY); if (saved && ids.includes(saved)) scheme = saved; } catch (e) {}
    this.setScheme(scheme);
    select.addEventListener('change', () => {
      this.setScheme(select.value);
      try { localStorage.setItem(this.SCHEME_KEY, select.value); } catch (e) {}
    });
  },
  set(t) {
    document.documentElement.dataset.theme = t;
    document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
    try { localStorage.setItem(this.KEY, t); } catch (e) {}
  },
  setScheme(id) {
    document.documentElement.dataset.scheme = id;
    document.getElementById('scheme-select').value = id;
  },
};

/* =====================================================================
   3. QUESTION TYPES  (the plug-in registry)
   ===================================================================== */
/*  registerPlayerType(id, impl). impl must provide:
      render(q, ctx, initial)   -> widget
            ctx     = { onChange(), onSubmit() }   (call onChange when the answer changes)
            initial = the answer to restore when the player returns to this question
            widget  = { el, getAnswer(), isAnswered(),
                        // optional visual hooks (the engine calls them only if present):
                        showWrong(keys)         // mark EVERY answer in keys as wrong (red) and keep it: the engine re-sends all keys
                                                //   after each wrong check and whenever the question is re-opened
                        markWrong(), clearWrong(), // older single-shot hooks, used only when showWrong is missing
                        markRight(), revealCorrect(), lock(),
                        addNote(answer, text)   // show a wrong-answer note right under that answer, and keep it }
      isCorrect(q, answer)      -> boolean
      describeAnswer(q, answer) -> what the player answered: a string, or an ARRAY of strings (one per line, no separators)
      describeCorrect(q)        -> the correct answer: a string, or an array of strings
      noteFor(q, answer)        -> string: why THIS wrong answer is wrong ('' if none)
      allNotes(q)               -> [{ label, note, answer }]: every wrong-answer explanation
                                   (answer = the value addNote() expects; only needed if the widget has addNote)
    Optional:
      wrongKeys(q, answer)      -> the keys (see showWrong) a wrong check should turn red. Default: [answer].
      noteItems(q, answer)      -> [{ answer, text }]: the inline notes to show after a wrong check. Use it when ONE wrong
                                   answer can earn SEVERAL notes (multi-select). Without it, noteFor() gives a single note.
      shuffleData(q)            -> a NEW q.data with the choices in random order and the answer key remapped. The engine
                                   calls it for "Shuffle Questions & Choices" (true-false deliberately has none).
      reviewNode(q, answer, { skipped }) -> a DOM node that replaces the "Your answer / Correct answer" lines on the results
                                   screen and the "Correct answer" line of the strict-mode skip feedback (answer is null when
                                   skipped). "fill-table" uses it to show the filled-in table.                                */
const PlayerTypes = {};
function registerPlayerType(id, impl) { PlayerTypes[id] = impl; }

const letter = i => String.fromCharCode(65 + i);

function makeChoiceType(canShuffle) {  // used by multiple-choice AND true-false (canShuffle: only multiple-choice reorders its choices)
  const type = {
    render(q, ctx, initial) {
      let selected = null;
      const rows = q.data.options.map((opt, i) => {
        const input = h('input', { type: 'radio', name: 'opt', value: i });
        const row = h('label', { class: 'option' }, input,
          h('span', { class: 'option-letter' }, letter(i)), h('span', {}, opt.text));
        input.addEventListener('change', () => { select(i); ctx.onChange(); });
        return row;
      });
      function select(i) {                             // (red "wrong" marks are NOT cleared here: they stay for the whole question)
        selected = i;
        rows.forEach((r, k) => {
          r.classList.toggle('selected', k === i);
          r.querySelector('input').checked = k === i;
        });
      }
      const items = rows.map(row => h('div', { class: 'option-item' }, row));
      const noteEls = [];
      function addNote(i, text) {                      // why-this-option-is-wrong note, directly under that option
        text = cleanText(text);
        if (!text || noteEls[i] || !items[i]) return;
        noteEls[i] = h('div', { class: 'option-note', role: 'note' }, text);
        items[i].append(noteEls[i]);
      }
      if (typeof initial === 'number') select(initial);
      return {
        el: h('div', { class: 'options' }, items),
        addNote,
        getAnswer: () => selected,
        isAnswered: () => selected !== null,
        showWrong: keys => keys.forEach(k => { if (rows[k]) rows[k].classList.add('wrong'); }),
        markWrong: () => { if (selected !== null) rows[selected].classList.add('wrong'); },
        clearWrong: () => rows.forEach(r => r.classList.remove('wrong')),
        markRight: () => { if (selected !== null) rows[selected].classList.add('right'); },
        revealCorrect: () => rows[q.data.correct].classList.add('right'),
        lock: () => rows.forEach(r => { r.classList.add('locked'); r.querySelector('input').disabled = true; }),
      };
    },
    isCorrect: (q, a) => a === q.data.correct,
    wrongKeys: (q, a) => (typeof a === 'number' ? [a] : []),
    describeAnswer: (q, a) => a === null || a === undefined ? '(no answer)' : letter(a) + '. ' + q.data.options[a].text,
    describeCorrect: q => letter(q.data.correct) + '. ' + q.data.options[q.data.correct].text,
    noteFor: (q, a) => (a !== null && a !== undefined && a !== q.data.correct && cleanText(q.data.options[a].why)) || '',
    allNotes: q => q.data.options
      .map((o, i) => ({ label: letter(i) + '. ' + o.text, note: cleanText(o.why), i, answer: i }))
      .filter(x => x.i !== q.data.correct && x.note),
  };
  if (canShuffle) {
    type.shuffleData = q => {
      const order = shuffled(q.data.options.map((_, i) => i));          // order[newIndex] = oldIndex
      return { ...q.data, options: order.map(i => q.data.options[i]), correct: order.indexOf(q.data.correct) };
    };
  }
  return type;
}
registerPlayerType('multiple-choice', makeChoiceType(true));
registerPlayerType('true-false', makeChoiceType(false));

/*  Multi-select ("select all that apply"). The answer is the sorted list of ticked option indexes; credit is all-or-nothing:
    exactly the correct set must be ticked. Wrong-option `why` notes go under the ticked wrong options (noteItems).        */
registerPlayerType('multi-select', {
  render(q, ctx, initial) {
    const selected = new Set(Array.isArray(initial) ? initial : []);
    const correctSet = new Set(q.data.correct);
    const rows = q.data.options.map((opt, i) => {
      const input = h('input', { type: 'checkbox', value: i });
      const row = h('label', { class: 'option multi' }, input, h('span', { class: 'option-check', 'aria-hidden': 'true' }),
        h('span', { class: 'option-letter' }, letter(i)), h('span', {}, opt.text));
      input.addEventListener('change', () => {
        setOn(i, input.checked);                       // (red "wrong" marks stay: they record options that were checked and were wrong)
        ctx.onChange();
      });
      return row;
    });
    function setOn(i, on) {
      if (on) selected.add(i); else selected.delete(i);
      rows[i].classList.toggle('selected', on);
      rows[i].querySelector('input').checked = on;
    }
    rows.forEach((_, i) => { if (selected.has(i)) setOn(i, true); });
    const items = rows.map(row => h('div', { class: 'option-item' }, row));
    const noteEls = [];
    function addNote(i, text) {                        // why-this-option-is-wrong note, directly under that option (and kept)
      text = cleanText(text);
      if (!text || noteEls[i] || !items[i]) return;
      noteEls[i] = h('div', { class: 'option-note', role: 'note' }, text);
      items[i].append(noteEls[i]);
    }
    return {
      el: h('div', {}, h('p', { class: 'multi-hint' }, 'Select all that apply.'), h('div', { class: 'options' }, items)),
      addNote,
      getAnswer: () => [...selected].sort((a, b) => a - b),
      isAnswered: () => selected.size > 0,
      showWrong: keys => keys.forEach(k => { if (rows[k]) rows[k].classList.add('wrong'); }),
      markWrong: () => selected.forEach(i => { if (!correctSet.has(i)) rows[i].classList.add('wrong'); }),   // only the wrongly ticked ones
      clearWrong: () => rows.forEach(r => r.classList.remove('wrong')),
      markRight: () => selected.forEach(i => rows[i].classList.add('right')),
      revealCorrect: () => correctSet.forEach(i => rows[i].classList.add('right')),
      lock: () => rows.forEach(r => { r.classList.add('locked'); r.querySelector('input').disabled = true; }),
    };
  },
  isCorrect: (q, a) => Array.isArray(a) && a.length === q.data.correct.length && q.data.correct.every(c => a.includes(c)),
  wrongKeys: (q, a) => (Array.isArray(a) ? a : []).filter(i => !q.data.correct.includes(i)),   // only the wrongly ticked options turn red
  describeAnswer: (q, a) => !Array.isArray(a) || !a.length ? '(no answer)'
    : a.map(i => letter(i) + '. ' + q.data.options[i].text),               // one line per option, no separators
  describeCorrect: q => q.data.correct.map(i => letter(i) + '. ' + q.data.options[i].text),
  noteItems: (q, a) => (Array.isArray(a) ? a : [])
    .filter(i => !q.data.correct.includes(i) && cleanText(q.data.options[i].why))
    .map(i => ({ answer: i, text: cleanText(q.data.options[i].why) })),
  noteFor(q, a) { return this.noteItems(q, a).map(x => x.text).join(' '); },
  allNotes: q => q.data.options
    .map((o, i) => ({ label: letter(i) + '. ' + o.text, note: cleanText(o.why), i, answer: i }))
    .filter(x => !q.data.correct.includes(x.i) && x.note),
  shuffleData(q) {
    const order = shuffled(q.data.options.map((_, i) => i));            // order[newIndex] = oldIndex
    return { ...q.data, options: order.map(i => q.data.options[i]),
             correct: q.data.correct.map(c => order.indexOf(c)).sort((a, b) => a - b) };
  },
});

function parseNum(s) {
  const t = String(s).trim().replace(/,/g, '');
  return t === '' || isNaN(Number(t)) ? null : Number(t);
}
/** The Short Answer matching rules, shared with the cells of "Fill in the Table". spec = { answers, caseSensitive, tolerance }.
 *  Text is trimmed and whitespace-collapsed (case-folded unless caseSensitive). numeric: also accept a number that equals an accepted
 *  number (within tolerance), so 5 = 5.0. Short Answer always compares numbers; a table cell does only when its numeric flag is on. */
function shortMatches(spec, answer, numeric) {
  const { answers, caseSensitive, tolerance } = spec;
  const norm = s => { s = String(s).trim().replace(/\s+/g, ' '); return caseSensitive ? s : s.toLowerCase(); };
  const given = norm(answer);
  if (!given) return false;
  const givenNum = numeric ? parseNum(answer) : null;
  return answers.some(exp => {
    if (norm(exp) === given) return true;
    if (!numeric) return false;
    const expNum = parseNum(exp);
    return givenNum !== null && expNum !== null && Math.abs(givenNum - expNum) <= (tolerance || 0) + 1e-12;
  });
}
registerPlayerType('short-answer', {
  render(q, ctx, initial) {
    const input = h('input', { type: 'text', class: 'short-input', placeholder: 'Type your answer…',
      autocomplete: 'off', autocapitalize: 'off' });
    input.spellcheck = false;
    if (initial != null) input.value = initial;
    const wrongTexts = new Set();                      // texts that were checked and were wrong: the box is red while it holds one of them
    const syncWrong = () => input.classList.toggle('wrong', wrongTexts.has(input.value.trim()));
    input.addEventListener('input', () => { syncWrong(); ctx.onChange(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') ctx.onSubmit(); });
    return {
      el: input,
      getAnswer: () => input.value,
      isAnswered: () => input.value.trim() !== '',
      showWrong: keys => { keys.forEach(k => wrongTexts.add(String(k).trim())); syncWrong(); },
      markWrong: () => input.classList.add('wrong'),
      clearWrong: () => input.classList.remove('wrong'),
      markRight: () => input.classList.add('right'),
      lock: () => { input.disabled = true; },
    };
  },
  isCorrect: (q, answer) => shortMatches(q.data, answer, true),
  wrongKeys: (q, a) => [String(a == null ? '' : a).trim()],
  describeAnswer: (q, a) => (a && String(a).trim()) || '(no answer)',
  describeCorrect: q => q.data.answers.join('  or  ') + (q.data.tolerance ? '  (±' + q.data.tolerance + ')' : ''),
  noteFor: () => '',
  allNotes: () => [],
});

/*  Fill in the Table. q.data = { headers, headerColor, width, height, rows: [[cell]] } (see the builder's mountTableEditor);
    a cell is { blank: false, text, color } or { blank: true, answers, caseSensitive, numeric, tolerance, maxLength, size, allowEmpty, color }.
    The answer is the list of what the player typed in each BLANK cell, in reading order (left to right, row by row); the
    "key" of a blank is its position in that list. Credit is all-or-nothing: every blank must match (the same rules as Short
    Answer, see shortMatches; a cell compares numbers by value only when its numeric flag is on). An empty box is wrong, unless the
    cell has allowEmpty: then empty is accepted as well as the listed answers (see ftCellOk); a wrong text is wrong either way.
    Tab order = DOM order = reading order, because the only focusable things inside the table are the blank inputs.
    Strict mode: after a check the cells that hold a wrong (non-empty) text turn red and stay red while they hold that text;
    wrongKeys() returns "<blank index>:<text>" keys, which showWrong() turns back into red cells on every re-render.
    reviewNode(q, answer, { skipped }) draws the filled-in table for the results screen and the skip feedback (the engine uses it
    instead of the "Your answer / Correct answer" lines).                                                                      */
const FT_COLOR = /^#[0-9a-f]{6}$/i;
const ftBlanks = q => {
  const out = [];
  q.data.rows.forEach((row, r) => row.forEach((cell, c) => { if (cell && cell.blank) out.push({ r, c, cell, i: out.length }); }));
  return out;
};
const ftHeader = (q, c) => String(q.data.headers[c] == null ? '' : q.data.headers[c]).trim();
const ftWhere = (q, b) => 'Row ' + (b.r + 1) + ', ' + (ftHeader(q, b.c) || 'column ' + (b.c + 1));
/** Does the text v satisfy this blank? Empty (or missing) is correct only for a cell with allowEmpty; anything else goes through shortMatches. */
const ftCellOk = (cell, v) => {
  const s = v == null ? '' : String(v).trim();
  return s === '' ? cell.allowEmpty === true : shortMatches(cell, s, cell.numeric === true);
};
const ftAccepted = cell => cell.answers.join(' or ') + (cell.allowEmpty ? ' or leave empty' : '');   // "Expected: ..." text
const ftEntered = (a, i) => String(Array.isArray(a) && a[i] != null ? a[i] : '').trim();
/** Custom colour -> class "tc" + --tc (CSS blends it into the surface colour, so it works in light and dark mode). */
function ftTint(el, color) {
  if (typeof color === 'string' && FT_COLOR.test(color)) { el.classList.add('tc'); el.style.setProperty('--tc', color); }
  return el;
}
/** The table element (inside a scroll wrapper) with its authored size, header row and colours. fillCell(td, cell, r, c) fills each body cell. */
function ftTable(q, fillCell) {
  const d = q.data;
  const table = h('table', { class: 'ft' + (d.width ? ' fixed' : '') });
  if (d.width) table.style.width = d.width + 'px';
  if (d.height) table.style.height = d.height + 'px';
  if (d.headers.some(t => String(t == null ? '' : t).trim() !== '')) {
    table.append(h('thead', {}, h('tr', {}, d.headers.map(t => ftTint(h('th', { scope: 'col' }, String(t == null ? '' : t)), d.headerColor)))));
  }
  table.append(h('tbody', {}, d.rows.map((row, r) => h('tr', {}, row.map((cell, c) => {
    const td = ftTint(h('td'), cell.color);
    fillCell(td, cell, r, c);
    return td;
  })))));
  return h('div', { class: 'ft-scroll' }, table);
}

registerPlayerType('fill-table', {
  render(q, ctx, initial) {
    const heads = q.data.headers;
    const init = Array.isArray(initial) ? initial : [];
    const inputs = [], cells = [], wrongTexts = [];     // all three are indexed by blank position
    const table = ftTable(q, (td, cell, r, c) => {
      if (!cell.blank) { td.textContent = cell.text; return; }
      const i = inputs.length;
      const input = h('input', { type: 'text', class: 'ft-input', autocomplete: 'off', autocapitalize: 'off', maxLength: cell.maxLength,
        'aria-label': ftWhere(q, { r, c }) + ': type your answer' });
      input.spellcheck = false;
      const chars = cell.size || (cell.maxLength ? Math.max(cell.maxLength, 2) : 0);   // compact box for short values
      if (chars) { input.classList.add('sized'); input.style.setProperty('--n', chars); }
      if (init[i] != null) input.value = String(init[i]);
      input.addEventListener('input', () => { syncWrong(i); ctx.onChange(); });
      input.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.isComposing) return;
        e.preventDefault();
        if (inputs[i + 1]) inputs[i + 1].focus(); else ctx.onSubmit();   // Enter: next blank; after the last one it checks / moves on
      });
      inputs.push(input); cells.push(td); wrongTexts.push(new Set());
      td.append(input);
    });
    function syncWrong(i) {                            // red while the box holds a text that was checked and was wrong
      const bad = wrongTexts[i].has(inputs[i].value.trim());
      inputs[i].classList.toggle('wrong', bad);
      cells[i].classList.toggle('wrong', bad);
      if (bad) inputs[i].setAttribute('aria-invalid', 'true'); else inputs[i].removeAttribute('aria-invalid');
    }
    return {
      el: table,
      getAnswer: () => inputs.map(x => x.value),
      isAnswered: () => inputs.some(x => x.value.trim() !== ''),
      showWrong: keys => {
        keys.forEach(k => {
          const s = String(k), p = s.indexOf(':'), i = Number(s.slice(0, p));
          if (wrongTexts[i]) wrongTexts[i].add(s.slice(p + 1));
        });
        inputs.forEach((_, i) => syncWrong(i));
      },
      markRight: () => inputs.forEach((x, i) => { x.classList.add('right'); cells[i].classList.add('right'); }),
      lock: () => inputs.forEach(x => { x.disabled = true; }),
    };
  },
  isCorrect: (q, a) => Array.isArray(a) && ftBlanks(q).every(b => ftCellOk(b.cell, a[b.i])),
  wrongKeys: (q, a) => ftBlanks(q).reduce((keys, b) => {
    const v = ftEntered(a, b.i);
    return v && !ftCellOk(b.cell, v) ? keys.concat(b.i + ':' + v) : keys;       // only cells that hold a wrong text; empty cells are not marked
  }, []),
  describeAnswer: (q, a) => (Array.isArray(a) && a.some(x => String(x == null ? '' : x).trim())
    ? ftBlanks(q).map(b => ftWhere(q, b) + ': ' + (ftEntered(a, b.i) || '(empty)')) : '(no answer)'),
  describeCorrect: q => ftBlanks(q).map(b => ftWhere(q, b) + ': ' + ftAccepted(b.cell)),
  noteFor(q, a) {                                      // goes into the strict-mode feedback box after a wrong check
    let wrong = 0, empty = 0;
    ftBlanks(q).forEach(b => { const v = ftEntered(a, b.i); if (!v) { if (!b.cell.allowEmpty) empty++; } else if (!ftCellOk(b.cell, v)) wrong++; });   // an empty box that is allowed is not a problem
    return [wrong ? (wrong === 1 ? '1 cell is incorrect (marked in red).' : wrong + ' cells are incorrect (marked in red).') : '',
            empty ? (empty === 1 ? '1 cell is still empty.' : empty + ' cells are still empty.') : ''].filter(Boolean).join(' ');
  },
  allNotes: () => [],
  reviewNode(q, a, opts) {
    const skipped = !!(opts && opts.skipped);
    let n = 0;
    const table = ftTable(q, (td, cell) => {
      if (!cell.blank) { td.textContent = cell.text; return; }
      const given = skipped ? '' : ftEntered(a, n++);
      const ok = !skipped && ftCellOk(cell, given);
      td.classList.add(ok ? 'ok' : 'bad');
      if (!skipped) {
        td.append(h('div', { class: 'ft-got' }, h('span', { class: 'ft-mark', 'aria-hidden': 'true' }, ok ? '✓ ' : '✕ '),
          h('span', { class: 'sr-only' }, ok ? 'Correct: ' : 'Incorrect: '), given || '(empty)'));
      }
      if (!ok) td.append(h('div', { class: 'ft-exp' }, 'Expected: ' + ftAccepted(cell)));
    });
    return h('div', { class: 'ft-review' },
      h('p', { class: 'ft-caption' }, skipped ? 'Skipped. The expected answers are shown in each blank cell:'
        : 'Your table: ✓ is correct, ✕ shows what you entered and the expected answer.'), table);
  },
});

/* =====================================================================
   4. QUIZ ENGINE  (state + scoring; no DOM in here)
   ===================================================================== */
/*  Per-question state (Quiz.results[i]):
      status   'unanswered' (white) | 'answered' (non-strict, has a selection) |
               'solved' (strict, checked correct) | 'skipped' (strict, given up = incorrect)
      pending  the current selection, restored when you navigate back
      flagged  marked for review (yellow)
      attempts / answer / correct   used for scoring: strict counts the FIRST check;
                                    non-strict counts the final selection (see finalize).
                                    Exception: in a missed-questions drill a question counts once it is SOLVED (any attempt).
      wrongKeys   strict mode: every answer key that was checked and came back wrong (stay red for the whole question)
      finalAnswer strict mode: the answer of the check that solved the question
    Drill bookkeeping (see startDrill / goBackToResults):
      primary         snapshot of the real (non-drill) run, so "Go back to quiz results" can restore it
      practiceSolved  Set of srcIndex values solved in a drill: their results show "Solved in practice!" in aqua   */
const Quiz = {
  all: DATA.questions,          // every question exactly as authored (original order and choice order): never modified
  questions: DATA.questions,    // the questions of the CURRENT RUN: copies of `all` entries (+ srcIndex), maybe shuffled or filtered
  strict: false,                // set from the title-screen toggle for each play session
  shuffle: false,               // title-screen toggle: random question order and choice order for each run
  timerChoice: '0',             // title-screen exam timer: '0' (none), '15', '30', '45', '60' or 'custom'
  timerCustom: '',              // the custom minutes the player typed (text)
  limitMin: 0,                  // time limit of the current run in minutes (0 = untimed); drill runs are untimed
  timedOut: false,              // the run ended because the timer hit 00:00
  usedMs: 0,                    // time spent in the last timed run
  drill: false,                 // true while running only the questions missed in the previous run (always strict, dark-green UI)
  primary: null,                // while a drill runs: snapshot of the run whose results the drill came from
  practiceSolved: new Set(),    // srcIndex values solved in a drill since the last full start/retake
  index: 0,
  results: [],
  /** Starts a run: copies `all` (only = list of source indexes to keep), applies Shuffle, resets all state.
   *  Shuffle reorders the questions and, for types that have shuffleData(), their choices (answer keys are remapped). */
  begin({ only = null, drill = false } = {}) {
    let list = this.all.map((q, i) => ({ ...q, srcIndex: i }));
    if (only) list = list.filter(q => only.includes(q.srcIndex));
    if (this.shuffle) {
      list = shuffled(list).map(q => {
        const type = PlayerTypes[q.type];
        return type && type.shuffleData ? { ...q, data: type.shuffleData(q) } : q;
      });
    }
    this.questions = list;
    this.drill = drill;
    this.reset();
  },
  /** Source indexes (into `all`) of the run's questions that were answered wrong, skipped or left blank. Call after finalize(). */
  missed() {
    return this.results.reduce((acc, r, i) => (r.correct ? acc : acc.concat(this.questions[i].srcIndex)), []);
  },
  reset() {
    this.limitMin = 0; this.timedOut = false; this.usedMs = 0;
    this.index = 0;
    if (!this.drill) { this.primary = null; this.practiceSolved.clear(); }   // a full (re)start forgets all drill progress; drills keep it
    this.results = this.questions.map(() => ({
      status: 'unanswered', pending: null, flagged: false, attempts: 0, answer: null, correct: false, skipped: false,
      wrong: false,   // strict mode: a check came back wrong and the question is not solved yet (palette shows red)
      wrongKeys: [],  // strict mode: answer keys checked wrong so far; they stay red (even after picking something else or leaving)
      finalAnswer: null, // strict mode: the answer that solved the question
      notes: [],      // strict mode: [{ answer, text }] wrong-answer notes already shown under their options (they stay)
      hintsShown: 0,  // how many of the question's hints the player has revealed
    }));
    if (Calc) Calc.reset();                         // new attempt: forget calculator history and variables
  },
  /** Copy of everything the results screen needs, taken when a drill starts. */
  snapshot() {
    return { questions: this.questions, results: this.results, strict: this.strict,
             limitMin: this.limitMin, timedOut: this.timedOut, usedMs: this.usedMs };
  },
  /** Notes which questions of the current drill are solved, so they show "Solved in practice!" later. */
  recordPractice() {
    if (!this.drill) return;
    this.results.forEach((r, i) => { if (r.status === 'solved') this.practiceSolved.add(this.questions[i].srcIndex); });
  },
  /** Leaves a drill and puts the primary run back (its results, its Strict setting, its time). Returns false if there is none. */
  restorePrimary() {
    const p = this.primary;
    if (!this.drill || !p) return false;
    this.recordPractice();                          // credit what was solved before leaving
    Object.assign(this, p, { drill: false, primary: null, index: 0 });
    return true;
  },
  /** Indexes of questions that are still white (neither answered, solved nor skipped). */
  unsolved() {
    return this.results.reduce((acc, r, i) => (r.status === 'unanswered' ? acc.concat(i) : acc), []);
  },
  /** Locks in final answers/scores when the quiz ends. */
  finalize() {
    if (this.strict) {                            // strict results were recorded at each check ...
      if (this.drill) {                           // ... except in a drill, where solving a question (on any try) counts as correct
        this.results.forEach(r => { r.correct = r.status === 'solved'; });
        this.recordPractice();
      }
      return;
    }
    this.questions.forEach((q, i) => {
      const r = this.results[i], type = PlayerTypes[q.type];
      r.answer = r.pending;
      r.correct = r.pending !== null && r.pending !== undefined && !!type && type.isCorrect(q, r.pending);
    });
  },
  /** Weighted % correct per subject (only subjects that have questions). */
  subjectStats() {
    const map = new Map(DATA.subjects.map(s => [s, { subject: s, earned: 0, total: 0, count: 0, right: 0 }]));
    this.questions.forEach((q, i) => {
      if (!map.has(q.subject)) map.set(q.subject, { subject: q.subject, earned: 0, total: 0, count: 0, right: 0 });
      const s = map.get(q.subject);
      s.total += q.weight; s.count++;
      if (this.results[i].correct) { s.earned += q.weight; s.right++; }
    });
    return [...map.values()].filter(s => s.count > 0).map(s => ({ ...s, pct: s.earned * 100 / s.total }));
  },
};

/* =====================================================================
   5. SHARED UI PIECES
   ===================================================================== */
/** Explanation content as DOM nodes. withNotes adds the "why the other options are wrong" list. */
function explanationNodes(q, type, withNotes) {
  const nodes = [];
  if (hasRich(q.explanation)) nodes.push(richDiv('', q.explanation));
  if (withNotes) {
    const notes = type.allNotes(q).map(x => ({ label: x.label, note: cleanText(x.note) })).filter(x => x.note);
    if (notes.length) {
      nodes.push(h('div', {}, h('strong', {}, 'Why the other options are wrong:'),
        h('ul', {}, notes.map(x => h('li', {}, h('strong', {}, x.label), ' — ', x.note)))));
    }
  }
  return nodes;
}

/** A "Your answer:" / "Correct answer:" line. A type may give several items (multi-select): they get one line each, no separators. */
function answerLine(cls, label, value) {
  return h('div', { class: 'answer-line ' + cls }, h('strong', {}, label),
    Array.isArray(value) ? h('ul', { class: 'answer-items' }, value.map(t => h('li', {}, t))) : value);
}

let closeActiveModal = null;
/** Closes the open dialog (if any) WITHOUT running any of its actions. */
function dismissModal() { if (closeActiveModal) closeActiveModal(); }

/** The inline wrong-answer notes for a checked answer: [{ answer, text }]. A type may return several (noteItems); otherwise noteFor gives one. */
function noteItemsFor(type, q, answer) {
  if (typeof type.noteItems === 'function') return type.noteItems(q, answer);
  const text = cleanText(type.noteFor(q, answer));
  return text ? [{ answer, text }] : [];
}

/** Simple accessible dialog. actions[0] is the safe choice (also used for Esc / backdrop click). Only one is open at a time. */
function showModal({ title, message, actions }) {
  dismissModal();
  const prevFocus = document.activeElement;
  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    if (closeActiveModal === close) closeActiveModal = null;
    if (prevFocus && prevFocus.focus) prevFocus.focus();
  }
  function onKey(e) { if (e.key === 'Escape') { close(); actions[0].onClick(); } }
  const buttons = actions.map((a, i) => h('button', { type: 'button', class: 'btn ' + (i === 0 ? 'primary' : 'ghost'),
    onclick: () => { close(); a.onClick(); } }, a.label));
  const overlay = h('div', { class: 'modal-overlay', onclick: e => { if (e.target === overlay) { close(); actions[0].onClick(); } } },
    h('div', { class: 'modal', role: 'alertdialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title', 'aria-describedby': 'modal-msg' },
      h('h2', { id: 'modal-title' }, title),
      h('p', { id: 'modal-msg' }, message),
      h('div', { class: 'actions' }, buttons)));
  document.addEventListener('keydown', onKey);
  document.body.append(overlay);
  closeActiveModal = close;
  buttons[0].focus();
}

/** The numbered grid at the top: jump to any question; colours show each question's state. */
function createPalette() {
  const buttons = Quiz.questions.map((q, i) => h('button', { type: 'button', class: 'sq',
    onclick: () => goTo(i) }, String(i + 1)));
  function update() {
    buttons.forEach((b, i) => {
      const r = Quiz.results[i];
      const skipped = r.status === 'skipped';
      // Strict mode: a wrong check keeps the square red until the question is solved (green) or skipped.
      const wrong = Quiz.strict && r.wrong && r.status === 'unanswered';
      const done = r.status === 'answered' || r.status === 'solved';
      const practice = Quiz.drill && r.status === 'solved';          // missed question solved in the drill: aqua instead of green
      const bad = skipped || wrong;
      b.className = 'sq' + (r.flagged ? ' flagged' : skipped ? ' skipped' : wrong ? ' wrong' : practice ? ' practice' : done ? ' done' : '') + (i === Quiz.index ? ' current' : '');
      if (r.flagged && (done || bad)) b.dataset.badge = bad ? '✕' : '✓'; else delete b.dataset.badge;
      const label = skipped ? 'skipped' : wrong ? 'answered incorrectly' : practice ? 'solved in practice' : r.status === 'solved' ? 'solved' : done ? 'answered' : 'unanswered';
      b.setAttribute('aria-label', 'Question ' + (i + 1) + ', ' + label + (r.flagged ? ', marked for review' : ''));
      if (i === Quiz.index) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
  }
  update();
  return { el: h('div', { class: 'palette' }, buttons), update };
}

/** Orange "Hint" button below the question. Each click reveals the next hint; r.hintsShown remembers progress. */
function buildHints(q, r) {
  const hints = (Array.isArray(q.hints) ? q.hints : []).filter(hasRich);
  if (!hints.length) return null;
  const multi = hints.length > 1;
  const list = h('div', { class: 'hint-list' });
  const btn = h('button', { class: 'hint-btn', type: 'button', onclick: reveal });
  function addBox(k) {
    list.append(h('div', { class: 'hint-box' },
      h('strong', { class: 'hint-label' }, '💡 ' + (multi ? 'Hint ' + (k + 1) + ':' : 'Hint:')),
      richDiv('', hints[k])));
  }
  function syncBtn() {
    btn.hidden = r.hintsShown >= hints.length;
    btn.textContent = '💡 ' + (r.hintsShown === 0 ? 'Hint' : 'Next hint');
  }
  function reveal() {
    if (r.hintsShown >= hints.length) return;
    addBox(r.hintsShown); r.hintsShown++; syncBtn();
  }
  for (let k = 0; k < r.hintsShown && k < hints.length; k++) addBox(k);   // coming back: show what was already revealed
  syncBtn();
  return h('div', { class: 'hint-area' }, list, btn);
}

/** Exam timer: the sticky countdown bar. Deadline based (Date.now), so a throttled background tab cannot make it drift.
 *  start(minutes, onExpire) shows it; stop() hides it and returns the milliseconds that were used. */
const Timer = (function () {
  const box = document.getElementById('timer'), clock = document.getElementById('timer-clock'),
        fill = document.getElementById('timer-fill'), sr = document.getElementById('timer-sr');
  let tick = null, startedAt = 0, endAt = 0, total = 0, onExpire = null, said5 = false, said1 = false;
  function render() {                                   // paints the clock + bar, returns the ms left
    const left = Math.max(0, endAt - Date.now());
    clock.textContent = clockText(left, Math.ceil);
    fill.style.width = (left / total * 100) + '%';
    const danger = left <= 60000;
    box.classList.toggle('danger', danger);
    box.classList.toggle('warn', !danger && left <= Math.min(300000, total * 0.25));
    if (!said5 && total > 300000 && left <= 300000) { said5 = true; sr.textContent = '5 minutes left'; }
    if (!said1 && total > 60000 && left <= 60000) { said1 = true; sr.textContent = '1 minute left'; }
    return left;
  }
  function stop() {
    const used = tick ? Math.min(total, Date.now() - startedAt) : 0;
    if (tick) clearInterval(tick);
    tick = null; onExpire = null;
    box.hidden = true;
    return used;
  }
  function start(minutes, expire) {
    stop();
    total = minutes * 60000; startedAt = Date.now(); endAt = startedAt + total; onExpire = expire;
    said5 = said1 = false; sr.textContent = '';
    box.classList.remove('warn', 'danger');
    box.hidden = false;
    render();
    tick = setInterval(() => {
      if (render() > 0) return;
      const cb = onExpire;
      try { if (cb) cb(); } finally { stop(); }         // cb normally ends the quiz, which already stopped us
    }, 250);
  }
  return { start, stop, get running() { return tick !== null; } };
})();

/** Scratchpad: ONE floating panel for the whole page session, with TABS. A tab is a text tab (notes) or a drawing tab (a canvas with pen,
 *  eraser, undo and clear). It is built the first time a question screen is shown. Nothing is destroyed except by closing or clearing a tab:
 *  the panel and every pane are only ever HIDDEN, so text and drawings survive question navigation, collapsing / re-opening the panel,
 *  finishing, retaking and missed-question drills. It all lives in memory (a page reload empties it).
 *  Drawings are kept as strokes in a fixed 640x400 space and replayed at whatever size the panel has, so they stay sharp when it resizes. */
const Pad = (function () {
  const MAX_TABS = 12, MAX_NAME = 24, VW = 640, VH = 400;
  const COLORS = [['#111827', 'Black'], ['#2563eb', 'Blue'], ['#dc2626', 'Red'], ['#16a34a', 'Green']];
  const tool = { mode: 'pen', color: COLORS[0][0], size: 3 };       // shared by all drawing tabs
  const tabs = [];                                                  // { id, kind: 'text' | 'draw', name, pane, area? | canvas?, strokes?, live?, ready?, ro? }
  const made = { text: 0, draw: 0 };                                // how many of each kind were ever created (for default names)
  let seq = 0, active = null, renaming = null;
  let btn = null, panel = null, tabList = null, addText = null, addDraw = null, toolRow = null, body = null;
  let clearBtn = null, undoBtn = null, penBtn = null, eraserBtn = null, colorBtns = [];
  let open = false, available = false;
  const finePointer = () => typeof matchMedia === 'function' && matchMedia('(pointer: fine)').matches;   // no keyboard pop-up on touch
  const narrow = () => typeof matchMedia === 'function' && matchMedia('(max-width: 1099.98px)').matches;  // the calculator is a bottom sheet here
  const hasContent = t => (t.kind === 'draw' ? t.strokes.length > 0 : t.area.value.trim() !== '');
  const tabEl = t => document.getElementById('pad-tab-' + t.id);

  /* ---------- drawing ---------- */
  /** Paints the stroke from point index `from` to its end (a single point is a dot). The eraser removes ink instead of adding it. */
  function paintStroke(ctx, s, from) {
    const p = s.pts;
    ctx.save();
    ctx.globalCompositeOperation = s.mode === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.mode === 'eraser' ? s.size * 4 : s.size;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(p[from][0], p[from][1]);
    if (p.length - from === 1) ctx.lineTo(p[from][0] + 0.01, p[from][1]);
    else for (let i = from + 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.stroke();
    ctx.restore();
  }
  /** Replays every stroke at the canvas' current on-screen size. A hidden canvas has no size: it is redrawn when it is shown again. */
  function redraw(tab) {
    const c = tab.canvas, w = c.getBoundingClientRect().width;
    if (!w) return;
    const dpr = window.devicePixelRatio || 1, px = Math.round(w * dpr), py = Math.round(w * VH / VW * dpr);
    if (c.width !== px || c.height !== py) { c.width = px; c.height = py; }     // resizing clears the bitmap; the strokes are replayed right below
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.setTransform(px / VW, 0, 0, px / VW, 0, 0);
    tab.strokes.forEach(s => paintStroke(ctx, s, 0));
    tab.ready = true;
  }
  function markCount(tab) { if (tab.canvas) tab.canvas.dataset.strokes = String(tab.strokes.length); }

  /* ---------- panes ---------- */
  function buildTextPane(tab) {
    tab.area = h('textarea', { class: 'pad-area', 'aria-label': 'Scratchpad notes', placeholder: 'Notes, calculations, reminders…' });
    tab.area.spellcheck = false;
    return tab.area;
  }
  function buildDrawPane(tab) {
    const canvas = h('canvas', { class: 'pad-canvas', width: VW, height: VH, role: 'img', 'data-strokes': '0',   // (the player's h() has no "dataset" prop)
      'aria-label': 'Drawing area. Draw with a mouse, a pen or your finger.' });
    tab.canvas = canvas; tab.strokes = []; tab.live = null; tab.ready = false;
    const point = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * VW / r.width, (e.clientY - r.top) * VH / r.height]; };
    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      if (!tab.ready) redraw(tab);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointer: nothing to capture */ }
      const stroke = { mode: tool.mode, color: tool.color, size: tool.size, pts: [point(e)] };
      tab.strokes.push(stroke); tab.live = stroke;
      paintStroke(canvas.getContext('2d'), stroke, 0);
      markCount(tab); syncTools();
    });
    canvas.addEventListener('pointermove', e => {
      const s = tab.live;
      if (!s) return;
      s.pts.push(point(e));
      paintStroke(canvas.getContext('2d'), s, s.pts.length - 2);
    });
    const finish = () => { if (tab.live) { tab.live = null; markCount(tab); syncTools(); } };
    canvas.addEventListener('pointerup', finish);
    canvas.addEventListener('pointercancel', finish);
    canvas.addEventListener('lostpointercapture', finish);
    if (typeof ResizeObserver === 'function') { tab.ro = new ResizeObserver(() => redraw(tab)); tab.ro.observe(canvas); }
    return canvas;
  }

  /* ---------- tabs ---------- */
  function addTab(kind) {
    if (tabs.length >= MAX_TABS) return;
    const n = ++made[kind];
    const tab = { id: ++seq, kind, name: (kind === 'text' ? 'Notes' : 'Sketch') + (n > 1 ? ' ' + n : '') };
    tab.pane = h('div', { class: 'pad-pane', id: 'pad-pane-' + tab.id, role: 'tabpanel', 'aria-labelledby': 'pad-tab-' + tab.id, hidden: true },
      kind === 'text' ? buildTextPane(tab) : buildDrawPane(tab));
    tabs.push(tab); body.append(tab.pane);
    select(tab, true);
  }
  function removeTab(tab) {
    const i = tabs.indexOf(tab);
    if (i < 0 || tabs.length < 2) return;
    if (tab.ro) tab.ro.disconnect();
    tab.pane.remove(); tabs.splice(i, 1);
    if (active === tab) select(tabs[Math.min(i, tabs.length - 1)], true); else renderTabs();
  }
  function closeTab(tab) {
    if (tabs.length < 2) return;
    if (!hasContent(tab)) return removeTab(tab);
    showModal({ title: 'Close "' + tab.name + '"?',
      message: 'Everything ' + (tab.kind === 'draw' ? 'drawn' : 'written') + ' in this tab will be erased.',
      actions: [{ label: 'Keep tab', onClick: () => {} }, { label: 'Close tab', onClick: () => removeTab(tab) }] });
  }
  function clearTab(tab) {
    if (tab.kind === 'draw') { tab.strokes.length = 0; markCount(tab); redraw(tab); syncTools(); }
    else { tab.area.value = ''; if (tab === active && open && finePointer()) tab.area.focus(); }
  }
  function askClear(tab) {
    if (!tab) return;
    if (!hasContent(tab)) return clearTab(tab);
    const draw = tab.kind === 'draw';
    showModal({ title: draw ? 'Clear this drawing?' : 'Clear this tab?',
      message: 'This erases everything you ' + (draw ? 'drew' : 'wrote') + ' in "' + tab.name + '".',
      actions: [{ label: draw ? 'Keep my drawing' : 'Keep my notes', onClick: () => {} },
                { label: draw ? 'Clear drawing' : 'Clear notes', onClick: () => clearTab(tab) }] });
  }
  function select(tab, focusIt) {
    active = tab; renaming = null;
    tabs.forEach(t => {
      t.pane.hidden = t !== tab;
      if (t.area) { if (t === tab) t.area.id = 'pad-area'; else t.area.removeAttribute('id'); }   // #pad-area is always the visible notes box
    });
    toolRow.hidden = tab.kind !== 'draw';
    clearBtn.hidden = tab.kind === 'draw';                          // a drawing tab has its own "Clear drawing" button in the tool row
    addText.disabled = addDraw.disabled = tabs.length >= MAX_TABS;
    renderTabs(); syncTools();
    if (tab.kind === 'draw') redraw(tab);
    if (focusIt && open && available && finePointer()) focusActive();
  }
  function focusActive() {
    if (!active) return;
    const target = active.area || tabEl(active);
    if (target) target.focus({ preventScroll: true });
  }
  function startRename(tab) {
    if (renaming === tab) return;
    renaming = tab; renderTabs();
    const input = tabList.querySelector('.pad-rename');
    if (input) { input.focus(); input.select(); }
  }
  function commitRename(tab, input) {
    if (renaming !== tab) return;
    renaming = null;
    const name = input.value.trim().slice(0, MAX_NAME);
    if (name) tab.name = name;
    renderTabs();
  }
  function renderTabs() {
    tabList.replaceChildren(...tabs.map((tab, i) => {
      const on = tab === active;
      const label = renaming === tab
        ? (() => {
            const input = h('input', { type: 'text', class: 'pad-rename', value: tab.name, maxLength: MAX_NAME, 'aria-label': 'Tab name',
              onkeydown: e => {
                if (e.key === 'Enter') { e.preventDefault(); commitRename(tab, input); const b = tabEl(tab); if (b) b.focus(); }
                else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); renaming = null; renderTabs(); const b = tabEl(tab); if (b) b.focus(); }
              },
              onblur: () => commitRename(tab, input) });
            return input;
          })()
        : h('button', { type: 'button', class: 'pad-tab-btn', role: 'tab', id: 'pad-tab-' + tab.id, 'aria-selected': String(on),
            'aria-controls': 'pad-pane-' + tab.id, tabindex: on ? 0 : -1, title: 'Double-click (or press F2) to rename',
            onclick: () => select(tab, true),
            ondblclick: () => startRename(tab),
            onkeydown: e => {
              const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
              if (to !== undefined) {
                e.preventDefault();
                const next = tabs[(to + tabs.length) % tabs.length];
                select(next, false); const b = tabEl(next); if (b) b.focus();
              } else if (e.key === 'F2') { e.preventDefault(); startRename(tab); }
            } },
            h('span', { 'aria-hidden': 'true' }, tab.kind === 'draw' ? '✏️ ' : '📝 '), h('span', { class: 'pad-tab-name' }, tab.name));
      return h('div', { class: 'pad-tab' + (on ? ' active' : ''), role: 'presentation' }, label,
        on && renaming !== tab ? h('button', { type: 'button', class: 'pad-tab-ico rename', 'aria-label': 'Rename tab ' + tab.name, title: 'Rename tab',
          onclick: () => startRename(tab) }, '✎') : null,
        tabs.length > 1 ? h('button', { type: 'button', class: 'pad-tab-ico close', 'aria-label': 'Close tab ' + tab.name, title: 'Close tab',
          onclick: () => closeTab(tab) }, '×') : null);
    }));
    const cur = tabList.querySelector('.pad-tab.active');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  /* ---------- drawing tools (one shared row, shown on drawing tabs) ---------- */
  function setTool(mode) {
    tool.mode = mode;
    penBtn.setAttribute('aria-pressed', String(mode === 'pen'));
    eraserBtn.setAttribute('aria-pressed', String(mode === 'eraser'));
    colorBtns.forEach(b => b.setAttribute('aria-pressed', String(mode === 'pen' && b.dataset.color === tool.color)));
  }
  function syncTools() {
    if (undoBtn) undoBtn.disabled = !(active && active.kind === 'draw' && active.strokes.length);
  }
  function buildTools() {
    penBtn = h('button', { type: 'button', class: 'btn small ghost pad-tool', id: 'pad-pen', 'aria-pressed': 'true', onclick: () => setTool('pen') }, '✏️ Pen');
    eraserBtn = h('button', { type: 'button', class: 'btn small ghost pad-tool', id: 'pad-eraser', 'aria-pressed': 'false', onclick: () => setTool('eraser') }, '🧽 Eraser');
    colorBtns = COLORS.map(([c, name]) => h('button', { type: 'button', class: 'pad-color', style: '--c:' + c, 'data-color': c,
      'aria-label': name + ' pen', title: name, 'aria-pressed': String(c === tool.color), onclick: () => { tool.color = c; setTool('pen'); } }));
    const size = h('input', { type: 'range', class: 'pad-size', id: 'pad-size', min: 1, max: 12, step: 1, value: tool.size, 'aria-label': 'Pen size',
      oninput: e => { tool.size = Number(e.target.value); } });
    undoBtn = h('button', { type: 'button', class: 'btn small ghost pad-tool', id: 'pad-undo', disabled: true,
      onclick: () => { if (active && active.kind === 'draw' && active.strokes.length) { active.strokes.pop(); markCount(active); redraw(active); syncTools(); } } }, '↶ Undo');
    const clearDraw = h('button', { type: 'button', class: 'btn small ghost pad-tool', id: 'pad-clear-draw', onclick: () => askClear(active) }, 'Clear drawing');
    toolRow = h('div', { class: 'pad-tools', role: 'toolbar', 'aria-label': 'Drawing tools', hidden: true },
      penBtn, eraserBtn, h('span', { class: 'pad-colors' }, colorBtns), size, undoBtn, clearDraw);
  }

  /* ---------- the panel ---------- */
  function build() {
    clearBtn = h('button', { type: 'button', class: 'btn small ghost', id: 'pad-clear', onclick: () => askClear(active) }, 'Clear');
    tabList = h('div', { class: 'pad-tablist', role: 'tablist', 'aria-label': 'Scratchpad tabs' });
    addText = h('button', { type: 'button', class: 'btn small ghost', id: 'pad-add-text', title: 'Add a notes tab', onclick: () => addTab('text') }, '+ Text');
    addDraw = h('button', { type: 'button', class: 'btn small ghost', id: 'pad-add-draw', title: 'Add a drawing tab', onclick: () => addTab('draw') }, '+ Draw');
    buildTools();
    body = h('div', { class: 'pad-body' });
    panel = h('section', { class: 'pad', id: 'pad-panel', role: 'region', 'aria-label': 'Scratchpad', hidden: true,
      onkeydown: e => { if (e.key === 'Escape' && !renaming) { setOpen(false); btn.focus(); } } },
      h('div', { class: 'pad-head' }, h('span', { class: 'pad-title' }, '📝 Scratchpad'), clearBtn,
        h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Collapse scratchpad', onclick: () => setOpen(false) }, '×')),
      h('div', { class: 'pad-tabs' }, tabList, h('div', { class: 'pad-add' }, addText, addDraw)),
      toolRow, body);
    btn = h('button', { type: 'button', class: 'pad-btn', id: 'pad-btn', 'aria-controls': 'pad-panel', 'aria-expanded': 'false',
      onclick: () => setOpen(!open) }, '📝 Scratchpad');
    document.body.append(panel, btn);
    if (typeof ResizeObserver === 'function') new ResizeObserver(() => document.body.style.setProperty('--pad-h', panel.offsetHeight + 'px')).observe(panel);
    addTab('text');                                                 // the first tab: a notes box, like the single box this panel used to have
  }
  function sync() {
    if (available && !btn) build();
    if (!btn) return;
    btn.hidden = !available;
    btn.classList.toggle('on', open);
    btn.setAttribute('aria-expanded', String(open && available));
    panel.hidden = !(open && available);
    document.body.classList.toggle('pad-open', open && available);
    if (open && available && active && active.kind === 'draw') redraw(active);   // a canvas that was hidden has to be painted again
  }
  function setOpen(v) {
    if (v && narrow() && Calc) Calc.close();            // phones: the calculator sheet and the note panel cannot both fit, so one at a time
    open = v; sync();
    if (v && available && finePointer()) focusActive();
  }
  return {
    /** Called on every screen: only question screens have a scratchpad. An open panel stays open from question to question. */
    show(isAvailable) { available = isAvailable; sync(); },
    /** The calculator button calls this first: on narrow screens opening the calculator folds the scratchpad away. */
    yieldToCalculator() { if (open && narrow()) setOpen(false); },
  };
})();


const ExamSheet = (function () {
'use strict';
/*  A clean black-and-white paper version of a quiz.
      ExamSheet.open(quiz)            shows a print-preview view over the page and opens the print dialog
      ExamSheet.register(id, q=>html) draws the answer area for a question type (others get an answer line)
    quiz = { name, questions: [{ type, prompt (rich HTML), weight, data }] }: the builder state or the player's DATA. */
const types = new Map();

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const letter = i => String.fromCharCode(65 + i);
const num = n => String(Math.round(n * 100) / 100);
const BOX = '<span class="ex-box" aria-hidden="true"></span>';
const LINE = '<span class="ex-line"></span>';

const answerLine = () => '<div class="ex-answer"><span>Answer:</span>' + LINE + '</div>';
function choiceList(q, { letters = true, inline = false } = {}) {
  return '<ul class="ex-opts' + (inline ? ' inline' : '') + '">' + q.data.options.map((o, i) =>
    '<li>' + BOX + (letters ? '<span class="ex-letter">' + letter(i) + '.</span>' : '') +
    '<span class="ex-text">' + esc(o.text) + '</span></li>').join('') + '</ul>';
}
types.set('multiple-choice', q => choiceList(q));
types.set('multi-select', q => '<p class="ex-note">Select all that apply.</p>' + choiceList(q));
types.set('true-false', q => choiceList(q, { letters: false, inline: true }));
types.set('short-answer', answerLine);

/*  Fill in the Table: a bordered black-and-white table. Text cells print as text; a blank slot prints as an empty underline, as wide as the
    player's input box would be (compact for single bits / short hex values). Colours are never printed (no background graphics needed). */
const posInt = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.round(n) : 0; };
types.set('fill-table', q => {
  const d = q.data || {};
  const heads = Array.isArray(d.headers) ? d.headers : [];
  const rows = Array.isArray(d.rows) ? d.rows : [];
  const text = v => esc(v == null ? '' : v);
  const w = posInt(d.width), ht = posInt(d.height);
  const style = (w ? 'width:' + w + 'px;' : '') + (ht ? 'height:' + ht + 'px;' : '');
  const head = heads.some(t => String(t == null ? '' : t).trim() !== '')
    ? '<thead><tr>' + heads.map(t => '<th scope="col">' + text(t) + '</th>').join('') + '</tr></thead>' : '';
  const body = rows.map(row => '<tr>' + (Array.isArray(row) ? row : []).map(c => {
    if (c && c.blank) {
      const n = posInt(c.size) || (posInt(c.maxLength) ? Math.max(posInt(c.maxLength), 2) : 0);
      return '<td class="ex-t-blank"><span class="ex-blank' + (n ? '' : ' full') + '"' + (n ? ' style="width:' + (n + 1) + 'ch"' : '') + '></span></td>';
    }
    return '<td>' + text(c && c.text) + '</td>';
  }).join('') + '</tr>').join('');
  return '<table class="ex-table' + (w ? ' fixed' : '') + '"' + (style ? ' style="' + style + '"' : '') + '>' + head + '<tbody>' + body + '</tbody></table>';
});

/** The sheet itself (header + numbered questions) as an HTML string. Never includes answers, notes or explanations. */
function sheetHtml(quiz) {
  const qs = quiz.questions || [];
  const weightOf = q => (Number(q.weight) > 0 ? Number(q.weight) : 1);
  const total = qs.reduce((a, q) => a + weightOf(q), 0);
  const items = qs.map((q, i) => {
    const w = weightOf(q);
    return '<section class="ex-q">' +
      '<div class="ex-num">' + (i + 1) + '.</div>' +
      '<div class="ex-prompt">' + (q.prompt || '') + '</div>' +
      '<div class="ex-pts">' + (w !== 1 ? '(' + num(w) + ' pts)' : '') + '</div>' +
      '<div class="ex-area">' + (types.get(q.type) || answerLine)(q) + '</div></section>';
  }).join('');
  return '<header class="ex-head">' +
    '<h1 class="ex-title">' + esc(quiz.name || 'Quiz') + '</h1>' +
    '<p class="ex-meta">' + qs.length + ' question' + (qs.length === 1 ? '' : 's') + ' &middot; ' + num(total) + ' point' + (total === 1 ? '' : 's') + '</p>' +
    '<div class="ex-fields">' +
      '<div class="ex-field ex-f-name"><span>Student Name:</span>' + LINE + '</div>' +
      '<div class="ex-field ex-f-date"><span>Date:</span>' + LINE + '</div>' +
      '<div class="ex-field ex-f-score"><span>Score:</span>' + LINE + '<span>/ ' + num(total) + '</span></div>' +
    '</div></header>' + items;
}
