let current = null;           // the open preview: { overlay, style, onKey, prevTitle, prevFocus }

function close() {
  if (!current) return;
  const c = current;
  current = null;
  document.removeEventListener('keydown', c.onKey, true);
  c.overlay.remove();
  c.style.remove();
  document.body.classList.remove('exam-printing');
  document.title = c.prevTitle;
  if (c.prevFocus && c.prevFocus.focus) c.prevFocus.focus();
}

/** Shows the preview and (unless opts.print === false) opens the print dialog once images have decoded. */
function open(quiz, opts) {
  close();                                              // never stack two previews
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  const style = el('style');
  style.id = 'exam-style';
  style.textContent = CSS;

  const printBtn = el('button', 'ex-btn primary', '\u{1F5A8} Print / Save as PDF');
  printBtn.type = 'button';
  printBtn.addEventListener('click', () => window.print());
  const closeBtn = el('button', 'ex-btn', '✕ Close');
  closeBtn.type = 'button';
  closeBtn.addEventListener('click', close);
  const bar = el('div', 'ex-toolbar');
  bar.append(printBtn, closeBtn, el('span', 'ex-tip', 'Exam sheet preview. In the print dialog choose “Save as PDF” as the destination to get a PDF.'));

  const sheet = el('article', 'ex-sheet');
  sheet.innerHTML = sheetHtml(quiz);
  const overlay = el('div');
  overlay.id = 'exam-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Printable exam sheet preview');
  overlay.append(bar, sheet);

  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  current = { overlay, style, onKey, prevTitle: document.title, prevFocus: document.activeElement };
  document.addEventListener('keydown', onKey, true);
  document.head.append(style);
  document.body.append(overlay);
  document.body.classList.add('exam-printing');
  document.title = (quiz.name || 'Quiz') + ' - Exam Sheet';     // becomes the default PDF file name
  printBtn.focus({ preventScroll: true });

  if (!opts || opts.print !== false) {
    const decoded = [...sheet.querySelectorAll('img')].map(img => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()));
    Promise.all(decoded).then(() => requestAnimationFrame(() => { if (current && current.overlay === overlay) window.print(); }));
  }
  return overlay;
}

return { open, close, html: sheetHtml, register: (id, fn) => { types.set(id, fn); } };
})();


const Calc = null;

/* =====================================================================
   6. SCREENS
   ===================================================================== */
function goTo(i) {
  Quiz.index = i;
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderTitle() {
  const n = Quiz.all.length;
  applyMode();
  if (Calc) Calc.show(false, null);
  Pad.show(false);
  Timer.stop();

  // Strict Mode: off by default, chosen per play session right here.
  const toggle = h('input', { type: 'checkbox', id: 'strict-toggle', role: 'switch', checked: Quiz.strict,
    onchange: e => { Quiz.strict = e.target.checked; } });
  const pop = h('div', { class: 'help-pop', id: 'strict-help', role: 'tooltip', hidden: true },
    'Forces you to get a question right before moving on.');
  const helpBtn = h('button', { class: 'help-btn', type: 'button', 'aria-label': 'What is Strict Mode?',
    'aria-expanded': 'false', 'aria-controls': 'strict-help',
    onclick: () => { pop.hidden = !pop.hidden; helpBtn.setAttribute('aria-expanded', String(!pop.hidden)); } }, '?');

  // Shuffle + Exam Timer: also chosen per play session; the title screen remembers them while the page stays open.
  const shuffleToggle = h('input', { type: 'checkbox', id: 'shuffle-toggle', role: 'switch', checked: Quiz.shuffle,
    onchange: e => { Quiz.shuffle = e.target.checked; } });
  const timerSel = h('select', { id: 'timer-select', class: 'setting-select', 'aria-label': 'Exam timer', onchange: syncTimerUi },
    [['0', 'None'], ['15', '15 min'], ['30', '30 min'], ['45', '45 min'], ['60', '60 min'], ['custom', 'Custom…']]
      .map(([value, label]) => h('option', { value }, label)));
  timerSel.value = Quiz.timerChoice;
  const customIn = h('input', { type: 'number', id: 'timer-custom', class: 'setting-num', min: 1, max: 600, step: 1,
    value: Quiz.timerCustom, placeholder: 'min', 'aria-label': 'Custom exam length in minutes', oninput: () => { timerErr.hidden = true; } });
  const customUnit = h('span', { class: 'muted' }, 'minutes');
  const timerErr = h('p', { class: 'setting-error', id: 'timer-error', role: 'alert', hidden: true });
  function syncTimerUi() {
    const custom = timerSel.value === 'custom';
    customIn.hidden = !custom; customUnit.hidden = !custom;
    if (!custom) timerErr.hidden = true;
  }
  syncTimerUi();

  /** Minutes for this run (0 = untimed), or null (with a message under the field) when a custom value is not valid. */
  function readTimer() {
    Quiz.timerChoice = timerSel.value;
    if (timerSel.value !== 'custom') return Number(timerSel.value);
    Quiz.timerCustom = customIn.value;
    const minutes = Number(customIn.value);
    if (customIn.value.trim() === '' || !Number.isInteger(minutes) || minutes < 1 || minutes > 600) {
      timerErr.textContent = 'Enter a whole number of minutes from 1 to 600.';
      timerErr.hidden = false;
      customIn.focus();
      return null;
    }
    return minutes;
  }
  function startQuiz() {
    const minutes = readTimer();
    if (minutes === null) return;
    Quiz.strict = toggle.checked; Quiz.shuffle = shuffleToggle.checked;
    Quiz.begin();                                       // fresh run: shuffled if asked, all state reset
    Quiz.limitMin = minutes;
    goTo(0);
    if (minutes > 0) Timer.start(minutes, onTimeUp);    // the clock starts once the first question is on screen
  }

  stage.replaceChildren(h('section', { class: 'card center' },
    h('h1', {}, DATA.name),
    h('p', { class: 'muted' }, n + ' question' + (n === 1 ? '' : 's') + ' · ' + DATA.subjects.length + ' subject' + (DATA.subjects.length === 1 ? '' : 's')),
    h('div', { class: 'settings' },
      h('div', { class: 'strict-row' },
        h('label', { class: 'switch' }, toggle, h('span', { class: 'slider' }), h('span', {}, 'Strict Mode')),
        helpBtn, pop),
      h('div', { class: 'setting-row' },
        h('label', { class: 'switch' }, shuffleToggle, h('span', { class: 'slider' }), h('span', {}, 'Shuffle Questions & Choices'))),
      h('div', { class: 'setting-row' },
        h('label', { for: 'timer-select' }, '⏱ Exam Timer'), timerSel, customIn, customUnit, timerErr)),
    h('div', {}, h('button', { class: 'btn primary big', id: 'start-btn', type: 'button', onclick: startQuiz }, 'Start Quiz')),
    h('div', { class: 'title-actions' }, h('button', { class: 'btn ghost', id: 'print-sheet-btn', type: 'button',
      title: 'A black-and-white paper version of this quiz to print or save as a PDF',
      onclick: () => ExamSheet.open({ name: DATA.name, questions: Quiz.all }) }, '🖨 Export as Printable Exam Sheet'))));
}

/** The exam timer reached 00:00: submit the quiz right away, then tell the player. */
function onTimeUp() {
  dismissModal();                                       // a "finish now?" dialog may be open: close it without running its actions
  Quiz.timedOut = true;
  Quiz.finishQuiz();
  showModal({ title: '⏰ Time\'s up',
    message: 'The exam timer reached 00:00, so your quiz was submitted automatically. Questions you had not solved count as incorrect.',
    actions: [{ label: 'View results', onClick: () => {} }] });
}

/** Closes the Strict Mode help popover on outside click or Escape. */
function closeHelp() {
  const pop = document.querySelector('.help-pop:not([hidden])');
  if (!pop) return;
  pop.hidden = true;
  const btn = document.querySelector('.help-btn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
document.addEventListener('click', e => { if (!e.target.closest('.help-btn, .help-pop')) closeHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });

/** Finish button handler: warns if any question is still white. */
function tryFinish() {
  const open = Quiz.unsolved();
  if (!open.length) { finishQuiz(); return; }
  const list = open.slice(0, 12).map(i => '#' + (i + 1)).join(', ') + (open.length > 12 ? ', …' : '');
  showModal({
    title: '⚠️ Unsolved questions remain',
    message: 'You still have ' + open.length + ' unsolved question' + (open.length === 1 ? '' : 's') + ' (' + list + '). ' +
      'If you finish now, ' + (open.length === 1 ? 'it counts' : 'they count') + ' as incorrect.',
    actions: [
      { label: 'Go back and solve ' + (open.length === 1 ? 'it' : 'them'), onClick: () => goTo(open[0]) },
      { label: 'Finish anyway', onClick: finishQuiz },
    ],
  });
}
function finishQuiz() { Quiz.usedMs = Timer.stop(); Quiz.finalize(); renderResults(); }
Quiz.finishQuiz = finishQuiz;     // what the exam timer calls. It lives here, not in the engine, because finishing shows the results screen.

/** Results screen: runs only the questions missed or skipped in the run that just ended (keeps Strict and Shuffle; no timer). */
function startDrill(only) {
  if (!Quiz.drill) Quiz.primary = Quiz.snapshot();     // from a real run: remember its results (a drill of a drill keeps the original)
  Quiz.strict = true;                                  // a missed-questions assessment is always strict
  Quiz.begin({ only, drill: true });
  goTo(0);
}

/** The "← Go back to quiz results" button in the header: leave the drill (at any moment) and show the primary results again. */
function goBackToResults() {
  dismissModal();
  if (!Quiz.restorePrimary()) return;
  renderResults();
}

/** Page-wide look for the current mode: while a missed-questions drill runs, the UI accent turns dark green and the header gets its back button. */
function applyMode() {
  document.documentElement.toggleAttribute('data-drill', !!Quiz.drill);
  document.getElementById('back-results-btn').hidden = !Quiz.drill;
}

function renderQuestion() {
  const i = Quiz.index, q = Quiz.questions[i], n = Quiz.questions.length;
  const type = PlayerTypes[q.type], r = Quiz.results[i], strict = Quiz.strict;
  applyMode();
  if (!type) {
    stage.replaceChildren(h('section', { class: 'card' }, 'This quiz contains an unsupported question type: ' + q.type));
    return;
  }
  const isLast = i === n - 1;
  const isResolved = () => r.status === 'solved' || r.status === 'skipped';

  const palette = createPalette();
  const progressBar = h('div', { class: 'progress-bar' });
  const feedback = h('div', { class: 'feedback', hidden: true, role: 'status' });

  const flagBtn = h('button', { class: 'btn small ghost flag-btn', type: 'button', onclick: () => {
    r.flagged = !r.flagged; syncFlag(); palette.update(); } });
  const prevBtn = h('button', { class: 'btn ghost', type: 'button', disabled: i === 0, onclick: () => goTo(i - 1) }, '← Previous');
  // Strict mode: Next is never locked. It sits right beside Previous, so the player can move forward and back freely
  // without solving the current question; it turns blue/primary (the call to action) once the question is solved or skipped.
  const nextBtn = h('button', { class: 'btn ' + (strict ? '' : 'primary'), type: 'button', id: 'next-btn', onclick: next }, isLast ? 'Finish' : 'Next →');
  const checkBtn = strict ? h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: check }, 'Check Answer') : null;
  const skipBtn = strict ? h('button', { class: 'btn ghost danger', type: 'button', onclick: skip }, 'Skip This Question') : null;

  const widget = type.render(q, { onChange, onSubmit }, r.pending);
  const call = name => { if (typeof widget[name] === 'function') widget[name](); };
  const hintBlock = buildHints(q, r);
  const calcBtn = (Calc && q.calculator)
    ? h('button', { class: 'btn small ghost calc-btn', type: 'button', 'aria-pressed': 'false', onclick: () => { Pad.yieldToCalculator(); Calc.toggle(); } }, '🧮 Calculator')
    : null;

  /* Wrong-answer notes go under the option they belong to (when the widget supports it) and stay for good. */
  const inlineNotes = typeof widget.addNote === 'function';
  function rememberNote(answer, text) {
    text = cleanText(text);
    if (!text || answer === null || answer === undefined) return;
    if (!r.notes.some(n => n.answer === answer)) r.notes.push({ answer, text });
    widget.addNote(answer, text);
  }

  /* --- small sync helpers --- */
  function syncFlag() {
    flagBtn.classList.toggle('on', r.flagged);
    flagBtn.setAttribute('aria-pressed', String(r.flagged));
    flagBtn.textContent = r.flagged ? '⚑ Marked for review' : '⚐ Mark for review';
  }
  function syncProgress() {
    const done = Quiz.results.filter(x => x.status !== 'unanswered').length;
    progressBar.style.width = (done / n * 100) + '%';
  }
  function syncButtons() {
    if (strict) {
      const done = isResolved();
      checkBtn.hidden = done; skipBtn.hidden = done;
      nextBtn.classList.toggle('primary', done);
      checkBtn.disabled = !widget.isAnswered();
    }
  }
  function setFeedback(kind, ...nodes) {
    feedback.className = 'feedback ' + kind;
    feedback.replaceChildren(...nodes.flat().filter(Boolean));
    feedback.hidden = false;
  }

  /* --- events --- */
  function onChange() {
    r.pending = widget.getAnswer();
    if (strict) {
      if (!isResolved()) { feedback.hidden = true; syncButtons(); }   // answer stays unchecked: question remains white
    } else {
      r.status = widget.isAnswered() ? 'answered' : 'unanswered';
      palette.update(); syncProgress();
    }
  }
  function onSubmit() {
    if (!widget.isAnswered()) return;
    if (strict) check(); else next();
  }
  function next() { if (isLast) tryFinish(); else goTo(i + 1); }

  /* --- strict mode: explicit check / skip --- */
  function showSolved() {
    call('lock'); call('markRight');
    setFeedback('good', h('strong', { class: 'title' }, '✅ Correct!'), explanationNodes(q, type, false));   // only the "why it's right" text
  }
  function showSkipped() {
    call('lock'); call('revealCorrect');
    if (inlineNotes) type.allNotes(q).forEach(x => rememberNote(x.answer, x.note));   // every wrong-option note, each under its option
    const review = typeof type.reviewNode === 'function' ? type.reviewNode(q, null, { skipped: true }) : null;   // e.g. the expected table
    setFeedback('bad',
      h('strong', { class: 'title' }, '⏭ Skipped. Marked incorrect.'),
      review || answerLine('correct', 'Correct answer: ', type.describeCorrect(q)),
      explanationNodes(q, type, !inlineNotes));                    // widgets without inline notes still get the "why the others are wrong" list
  }
  function check() {
    if (isResolved() || !widget.isAnswered()) return;
    const answer = widget.getAnswer();
    const ok = type.isCorrect(q, answer);
    r.attempts++;
    if (r.attempts === 1) { r.answer = answer; r.correct = ok; }       // score = first check
    if (ok) {
      r.status = 'solved'; r.finalAnswer = answer;
      showSolved();
    } else {
      r.wrong = true;                                                   // palette square turns red
      const keys = typeof type.wrongKeys === 'function' ? type.wrongKeys(q, answer) : [answer];
      keys.forEach(k => { if (!r.wrongKeys.includes(k)) r.wrongKeys.push(k); });
      if (typeof widget.showWrong === 'function') widget.showWrong(r.wrongKeys);   // red outlines accumulate and never go away
      else call('markWrong');
      // Notes go under the option(s) that were picked and stay even after a later correct answer (never the correct answer's explanation).
      if (inlineNotes) noteItemsFor(type, q, answer).forEach(x => rememberNote(x.answer, x.text));
      const note = inlineNotes ? '' : cleanText(type.noteFor(q, answer));   // widgets without addNote: the note goes in the feedback box
      setFeedback('bad', h('strong', { class: 'title' }, '❌ Not quite. Try again.'), note ? h('p', {}, note) : null);
    }
    palette.update(); syncProgress(); syncButtons();
  }
  function skip() {
    if (isResolved()) return;
    r.status = 'skipped'; r.skipped = true; r.correct = false;
    if (r.attempts === 0) r.answer = r.pending;
    showSkipped();
    palette.update(); syncProgress(); syncButtons();
  }

  /* --- build the screen --- */
  const legend = h('div', { class: 'legend', 'aria-hidden': 'true' },
    h('span', {}, 'Unsolved'), h('span', { class: 'lg-flag' }, 'Review'),
    h('span', { class: Quiz.drill ? 'lg-practice' : 'lg-done' }, strict ? (Quiz.drill ? 'Solved in practice' : 'Solved') : 'Answered'),
    strict ? h('span', { class: 'lg-skip' }, 'Wrong / skipped') : null);

  stage.replaceChildren(
    ...(Quiz.drill ? [h('h1', { class: 'drill-title', id: 'drill-title' }, DRILL_TITLE)] : []),   // (no null here: replaceChildren would print "null")
    h('section', { class: 'card palette-card' },
      h('div', { class: 'palette-head' }, h('strong', {}, 'Questions'), legend,
        h('button', { class: 'btn small ghost', type: 'button', onclick: tryFinish }, 'Finish Quiz')),
      palette.el),
    h('section', { class: 'card' },
      h('div', { class: 'q-meta' },
        h('span', { class: 'q-num' }, 'Question ' + (i + 1) + ' of ' + n),
        h('span', { class: 'tag' }, q.subject),
        q.weight !== 1 ? h('span', { class: 'tag' }, 'Weight ×' + q.weight) : null,
        strict ? h('span', { class: 'tag' }, '🔒 Strict') : null,
        Quiz.drill ? h('span', { class: 'tag' }, '🎯 Drill') : null,
        h('span', { class: 'verdict' }, calcBtn, flagBtn)),
      h('div', { class: 'progress' }, progressBar),
      richDiv('prompt', q.prompt),
      hintBlock,
      widget.el,
      feedback,
      h('div', { class: 'nav' }, strict
        ? [prevBtn, nextBtn, h('span', { class: 'spacer' }), skipBtn, checkBtn]    // strict: Previous and Next side by side
        : [prevBtn, h('span', { class: 'spacer' }), nextBtn])));

  syncFlag(); syncProgress();
  if (inlineNotes) r.notes.forEach(n => widget.addNote(n.answer, n.text));   // coming back: notes shown earlier are still there
  if (typeof widget.showWrong === 'function' && r.wrongKeys.length) widget.showWrong(r.wrongKeys);   // ... and so are the red marks
  if (Calc) Calc.show(!!q.calculator, calcBtn);
  Pad.show(true);
  if (strict && r.status === 'solved') showSolved();        // coming back to a finished question: show it as it was
  else if (strict && r.status === 'skipped') showSkipped();
  syncButtons();
}

/** Builds the explanation panel for the results screen, or null if there is nothing to show. */
function buildExplanation(q, type, startOpen) {
  const nodes = explanationNodes(q, type, true);
  if (!nodes.length) return null;
  return h('div', { class: 'explanation', hidden: !startOpen }, nodes);
}

function renderResults() {
  const n = Quiz.questions.length;
  applyMode();
  if (Calc) Calc.show(false, null);
  Pad.show(false);
  const missed = Quiz.missed();                         // source indexes of the questions that were wrong, skipped or left blank
  const right = Quiz.results.filter(r => r.correct).length;
  const skipped = Quiz.results.filter(r => r.skipped).length;
  const totalW = Quiz.questions.reduce((a, q) => a + q.weight, 0);
  const earnedW = Quiz.questions.reduce((a, q, i) => a + (Quiz.results[i].correct ? q.weight : 0), 0);
  const overall = earnedW * 100 / totalW;

  /* subject bar graphs */
  const bars = Quiz.subjectStats().map(s => {
    const pass = s.pct + 1e-9 >= PASS_MARK;
    return h('div', { class: 'subject-bar' },
      h('div', { class: 'subject-head' }, h('span', {}, s.subject), h('span', {}, s.right + ' of ' + s.count + ' correct')),
      h('div', { class: 'track' },
        h('div', { class: 'fill ' + (pass ? 'pass' : 'fail'), style: '--w:' + s.pct + '%' }),
        h('div', { class: 'mark90', title: PASS_MARK + '% mark' })),
      h('div', { class: 'pct' }, fmtPct(s.pct)),
      h('div', { class: 'badge', 'aria-label': pass ? 'Passed' : 'Below ' + PASS_MARK + '%' }, pass ? '✅' : '❌'));
  });

  /* per-question review */
  const panels = [];
  const items = Quiz.questions.map((q, i) => {
    const r = Quiz.results[i], type = PlayerTypes[q.type];
    const panel = type ? buildExplanation(q, type, !r.correct) : null;   // wrong => open by default
    let toggle = null;
    if (panel) {
      panels.push(panel);
      toggle = h('button', { class: 'btn small ghost', type: 'button', 'aria-expanded': String(!panel.hidden),
        onclick: () => { panel.hidden = !panel.hidden; toggle.setAttribute('aria-expanded', String(!panel.hidden)); } },
        'Solution Explanation');
    }
    // A question that was missed and then solved in a drill is "Solved in practice!" (aqua) instead of Incorrect.
    // In a drill run every solved question is one; on the primary results it is a missed one that the drill has solved since.
    const practice = Quiz.drill ? r.status === 'solved' : (!r.correct && Quiz.practiceSolved.has(q.srcIndex));
    const shownAnswer = Quiz.drill && r.status === 'solved' ? r.finalAnswer : r.answer;   // a drill shows the answer that solved it
    const yourAnswer = r.skipped ? '(skipped)' : (type ? type.describeAnswer(q, shownAnswer) : '');
    const review = type && typeof type.reviewNode === 'function' ? type.reviewNode(q, shownAnswer, { skipped: r.skipped }) : null;   // e.g. the filled-in table
    return h('article', { class: 'card result-item ' + (practice ? 'practice' : r.correct ? 'ok' : 'bad') },
      h('div', { class: 'q-meta' },
        h('span', { class: 'q-num' }, 'Q' + (i + 1)),
        h('span', { class: 'tag' }, q.subject),
        q.weight !== 1 ? h('span', { class: 'tag' }, 'Weight ×' + q.weight) : null,
        r.flagged ? h('span', { class: 'tag' }, '⚑ Marked for review') : null,
        h('span', { class: 'verdict' + (practice ? ' practice' : '') }, practice ? '🎯 Solved in practice!' : r.correct ? '✅ Correct' : '❌ Incorrect')),
      richDiv('prompt', q.prompt),
      review || [answerLine('mine', 'Your answer: ', yourAnswer), answerLine('correct', 'Correct answer: ', type ? type.describeCorrect(q) : '')],
      Quiz.strict && r.attempts > 1 ? h('p', { class: 'muted' }, 'Attempts needed: ' + r.attempts) : null,
      toggle, panel);
  });

  const toggleAll = h('button', { class: 'btn ghost small', type: 'button', onclick: () => {
    const showAll = panels.some(p => p.hidden);
    panels.forEach(p => { p.hidden = !showAll; });
    toggleAll.textContent = showAll ? 'Hide all explanations' : 'Show all explanations';
  } }, panels.some(p => p.hidden) ? 'Show all explanations' : 'Hide all explanations');

  stage.replaceChildren(
    h('section', { class: 'card' },
      h('h1', { id: 'results-title' }, Quiz.drill ? DRILL_TITLE : 'Results'),
      h('p', { class: 'score-line' }, right + ' of ' + n + (Quiz.drill ? ' solved in practice · ' : ' correct · ') + fmtPct(overall) + ' overall'),
      skipped ? h('p', { class: 'muted' }, skipped + ' skipped (counted as incorrect).') : null,
      Quiz.drill ? h('p', { class: 'muted' }, '🎯 Missed-questions drill: only the questions you missed or skipped last time.') : null,
      Quiz.limitMin ? h('p', { class: 'muted' }, Quiz.timedOut
        ? '⏰ Time ran out (' + Quiz.limitMin + ' min limit): the quiz was submitted automatically.'
        : '⏱ Time used: ' + clockText(Quiz.usedMs) + ' of ' + Quiz.limitMin + ' min.') : null,
      h('p', { class: 'muted' }, Quiz.drill
        ? 'Practice run (always strict): a missed question counts as solved once you get it right, even on a later try.'
        : Quiz.strict
        ? 'Strict mode: scores count your first check; weighted questions count proportionally more.'
        : 'Scores count your final answers; weighted questions count proportionally more.')),
    h('section', { class: 'card' }, h('h2', {}, 'Score by subject'), bars),
    h('div', { class: 'toolbar' },
      panels.length ? toggleAll : null,
      h('button', { class: 'btn ghost small', type: 'button', id: 'retake-btn', onclick: () => {
        Quiz.restorePrimary();                              // leaving a drill: take the real run's Strict choice back for the title screen
        Quiz.questions = Quiz.all; Quiz.drill = false;      // a full retake: back to the title screen with every question
        Quiz.reset(); renderTitle(); window.scrollTo(0, 0); } }, '↻ Retake quiz'),
      missed.length ? h('button', { class: 'btn small', type: 'button', id: 'retake-missed-btn', onclick: () => startDrill(missed) },
        '🎯 Retake Missed Questions (' + missed.length + ')') : null),
    h('h2', {}, 'Question review'),
    ...items);
  window.scrollTo(0, 0);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
document.getElementById('brand').textContent = DATA.name;
document.getElementById('back-results-btn').addEventListener('click', goBackToResults);
Theme.init();
Quiz.reset();
if (!Quiz.questions.length) {
  stage.replaceChildren(h('section', { class: 'card center' }, 'This quiz has no questions yet.'));
} else {
  renderTitle();
}
})();

</script>
</body>
</html>
