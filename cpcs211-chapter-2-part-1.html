<!DOCTYPE html>
<html lang="en" data-theme="light" data-scheme="aqua">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPCS211 Chapter 2 (Part 1)</title>
<style>

/* ===== Shared theme, base UI and schematic-editor styles (builder + player) ===== */
html {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 12px;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  --accent-text: var(--accent);   /* accent used as TEXT colour (darker than the fill colour in light Aqua, for contrast) */
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1218; --surface: #161d27; --surface2: #1c2532; --border: #2a3646;
  --text: #e8eef6; --muted: #9aa8bc; --grid: #2c3849; --gate-stroke: #d6deec; --gate-fill: #19222f;
  --ok: #34d399; --bad: #f87171; --warn: #fbbf24; --shadow: 0 8px 28px rgba(0, 0, 0, .38);
  --w0: #60a5fa; --w1: #f472b6; --w2: #34d399; --w3: #fbbf24; --w4: #a78bfa; --w5: #fb923c; --w6: #22d3ee; --w7: #f87171;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f4f9; --surface: #ffffff; --surface2: #eef2f7; --border: #d3dbe6;
  --text: #16202c; --muted: #576779; --grid: #cdd6e2; --gate-stroke: #243247; --gate-fill: #fbfcfe;
  --ok: #059669; --bad: #dc2626; --warn: #b45309; --shadow: 0 8px 26px rgba(30, 50, 80, .12);
  --w0: #2563eb; --w1: #db2777; --w2: #059669; --w3: #b45309; --w4: #7c3aed; --w5: #ea580c; --w6: #0891b2; --w7: #dc2626;
}
/* accent colour schemes */
html[data-theme="dark"][data-scheme="blue"] { --accent: #5b9bff; --on-accent: #04122b; }
html[data-theme="light"][data-scheme="blue"] { --accent: #2563eb; --on-accent: #ffffff; }
html[data-theme="dark"][data-scheme="orange"] { --accent: #fb923c; --on-accent: #2a1100; }
html[data-theme="light"][data-scheme="orange"] { --accent: #ea580c; --on-accent: #ffffff; }
html[data-theme="dark"][data-scheme="green"] { --accent: #34d399; --on-accent: #04231a; }
html[data-theme="light"][data-scheme="green"] { --accent: #059669; --on-accent: #ffffff; }
html[data-theme="dark"][data-scheme="purple"] { --accent: #a78bfa; --on-accent: #190d3a; }
html[data-theme="light"][data-scheme="purple"] { --accent: #7c3aed; --on-accent: #ffffff; }
html[data-theme="dark"][data-scheme="crimson"] { --accent: #fb4b63; --on-accent: #33000a; }
html[data-theme="light"][data-scheme="crimson"] { --accent: #e0112b; --on-accent: #ffffff; }
html[data-theme="light"][data-scheme="aqua"] {   /* default look: Aqua light */
  --accent: #06b6d4; --on-accent: #00232b; --accent-text: #0e7490;
  --bg: #eaf7f9; --surface: #ffffff; --surface2: #e2f2f5; --border: #b9dce3; --grid: #c1dce3;
  --text: #0c2831; --muted: #46656f; --gate-stroke: #12323d; --gate-fill: #fbfeff;
}
html[data-theme="dark"][data-scheme="aqua"] {
  --accent: #22d3ee; --on-accent: #032029;
  --bg: #08121f; --surface: #0e1f36; --surface2: #132a47; --border: #21405f; --grid: #1e3a5a; --gate-fill: #0d2038; --muted: #8fb0cf;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
a { color: var(--accent-text); }
code, pre { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  padding: .55em 1.05em; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); cursor: pointer; font-weight: 600; line-height: 1.2;
  transition: background .15s, border-color .15s, transform .05s, opacity .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent-line); background: color-mix(in srgb, var(--surface2) 80%, var(--accent) 20%); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .icon-btn:focus-visible, .pill:focus-visible, .ce-g:focus-visible, .ce-t:focus-visible, .ce-box:focus-visible {
  outline: 3px solid var(--accent-line); outline-offset: 2px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface2)); }
.btn.ghost { background: transparent; }
.btn.big { padding: .8em 1.6em; font-size: 1.05rem; border-radius: 12px; }
.btn.sm { padding: .3em .7em; font-size: .85rem; border-radius: 8px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; font-size: 1.1rem;
}
.icon-btn:hover { border-color: var(--accent-line); }

/* inputs */
.input, select.input, textarea.input {
  width: 100%; padding: .55em .75em; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
}
.input:focus { outline: 2px solid var(--accent-line); border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 4.5em; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 1.05em; height: 1.05em; }

/* cards / chips */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); }
.chip {
  display: inline-flex; align-items: center; gap: .35em; padding: .15em .65em; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--text); font-size: .82rem; font-weight: 600; white-space: nowrap;
}
.chip.plain { background: var(--surface2); border-color: var(--border); color: var(--muted); }

/* modal & toast */
.modal-back {
  position: fixed; inset: 0; background: rgba(5, 10, 18, .6); display: flex; align-items: center; justify-content: center;
  padding: 1rem; z-index: 1000; backdrop-filter: blur(3px);
}
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-width: 460px; width: 100%; padding: 1.4rem; }
.modal h3 { margin-top: 0; }
.modal .row { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1.1rem; flex-wrap: wrap; }

/* rich text content (prompts, hints, explanations) */
.rich { overflow-wrap: anywhere; }
.rich img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); display: block; margin: .5em 0; }
.rich pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .7em .9em; overflow-x: auto; white-space: pre-wrap; }
.rich code { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: .05em .35em; font-size: .92em; }
.rich pre code { background: none; border: 0; padding: 0; }
.rich > :first-child { margin-top: 0; }
.rich > :last-child { margin-bottom: 0; }
.rich table { border-collapse: collapse; } .rich td, .rich th { border: 1px solid var(--border); padding: .25em .6em; }
.rich blockquote { margin: .5em 0; padding-left: .9em; border-left: 3px solid var(--accent-line); color: var(--muted); }

/* ===== schematic (static + interactive) ===== */
.cs { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.cs-bg { fill: var(--surface2); }
.gdot { fill: var(--grid); }
.gbody { fill: var(--gate-fill); stroke: var(--gate-stroke); stroke-width: 2; stroke-linejoin: round; }
.gline { fill: none; stroke: var(--gate-stroke); stroke-width: 2; }
.gbub { fill: var(--gate-fill); stroke: var(--gate-stroke); stroke-width: 2; }
.gstub { stroke: var(--gate-stroke); stroke-width: 2; }
.glabel { fill: var(--muted); font: 600 12px var(--font); text-anchor: middle; pointer-events: none; }
.ghit { fill: rgba(127, 127, 127, .001); }
.gate .ghit { cursor: grab; }
.gate.sel .gbody { stroke: var(--accent); stroke-width: 3; }
.gsel { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; }
.gate.ghost { opacity: .6; pointer-events: none; }
.wire { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.wire.sel { stroke-width: 4.6; filter: drop-shadow(0 0 3px var(--accent)); }
.wire-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.wire-prev { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 5; pointer-events: none; }
.jdot { stroke: var(--surface2); stroke-width: 1.5; pointer-events: none; }
.tbox { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.tbox.out { fill: var(--accent-soft); stroke: var(--accent); }
.ttxt { fill: var(--text); font: 700 16px var(--mono); text-anchor: middle; pointer-events: none; }
.tline { stroke: var(--gate-stroke); stroke-width: 2; }
.pdot { fill: var(--surface2); stroke: var(--gate-stroke); stroke-width: 1.8; pointer-events: none; }
.pdot.on { stroke-width: 1.8; }
.phit { fill: transparent; cursor: crosshair; }
.phit:hover { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.phit.hl { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.2; stroke-dasharray: 3 3; }
.cs-int .gate, .cs-int .wire-hit, .cs-int .phit, .cs-int .term, .cs-int .tplus, .cs-int .wp-hit { touch-action: none; }
/* input terminals (draggable, copyable) and wire corner nodes */
.thit { fill: rgba(127, 127, 127, .001); cursor: grab; }
.term.clone .tbox { stroke-dasharray: 4 3; }
.term.sel .tbox { stroke: var(--accent); stroke-width: 3; }
.tplus { cursor: copy; }
.tplus-hit { fill: transparent; }
.tplus-c { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.tplus:hover .tplus-c { filter: brightness(1.15); }
.tplus-p { fill: none; stroke: var(--on-accent); stroke-width: 1.9; stroke-linecap: round; pointer-events: none; }
.wjoint { stroke: var(--surface); stroke-width: 1.5; pointer-events: none; }
.wjoint.sel { stroke: var(--text); }
.wjoint.prev { fill: var(--accent); }
.wp-hit { fill: transparent; cursor: move; }
.cs-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); }
.cs-inner { min-width: 640px; }

.ce { margin: .75rem 0; }
.ce-bar { display: flex; flex-wrap: wrap; gap: .6rem .9rem; align-items: center; justify-content: space-between; padding: .55rem; background: var(--surface2); border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0; }
.ce-gates { display: flex; flex-wrap: wrap; gap: .4rem; }
.ce-g {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: .3rem .5rem .2rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px; cursor: grab; touch-action: none; min-width: 66px; user-select: none; -webkit-user-select: none;
}
.ce-g:hover:not(.locked) { border-color: var(--accent); background: var(--accent-soft); }
.ce-g .ci { width: 52px; height: 28px; pointer-events: none; }
.ce-g .ci .gbody { stroke-width: 3; } .ce-g .ci .gline, .ce-g .ci .gstub, .ce-g .ci .gbub { stroke-width: 3; }
.ce-g span { font: 700 .68rem var(--font); letter-spacing: .03em; color: var(--muted); }
.ce-g.locked { opacity: .42; cursor: not-allowed; filter: grayscale(1); }
.ce-g .lk { position: absolute; top: -6px; right: -4px; font-size: .75rem; font-style: normal; }
.ce-tools { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.ce-t { padding: .35rem .65rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .85rem; }
.ce-t:hover:not(:disabled) { border-color: var(--accent); }
.ce-t:disabled { opacity: .4; cursor: not-allowed; }
.ce-t.danger { color: var(--bad); }
.ce-pins { display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .45rem; border: 1px solid var(--accent-line); border-radius: 8px; background: var(--accent-soft); font-size: .85rem; font-weight: 600; }
.ce-pins button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 700; }
.ce-pins button:disabled { opacity: .4; cursor: not-allowed; }
.ce-wrap { position: relative; overflow-x: auto; border: 1px solid var(--border); border-radius: 0 0 10px 10px; background: var(--surface2); }
.ce-box { min-width: 720px; outline: none; }
.ce-box:focus-visible { outline: 3px solid var(--accent-line); outline-offset: -3px; }
.ce-toast {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%) translateY(-8px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: .45rem .9rem; border-radius: 9px; font-weight: 600; font-size: .88rem;
  max-width: 90%; width: max-content; text-align: center; transition: opacity .18s, transform .18s; z-index: 3;
}
.ce-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ce-status { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .85rem; color: var(--muted); padding: .45rem .2rem 0; }
.ce-status .over { color: var(--bad); font-weight: 700; }
.ce-help { font-size: .8rem; color: var(--muted); padding: .2rem .2rem 0; }
.ce-ro .ce-bar, .ce-ro .ce-help { display: none; }
.ce-ro .ce-wrap { border-radius: 10px; }



/* ===== Generated quiz player ===== */
.pbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .65rem clamp(.8rem, 3vw, 2rem);
  background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.pbrand { display: flex; align-items: center; gap: .65rem; font-weight: 800; min-width: 0; }
.pbrand #pTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 1.05rem; }
.ptools { display: flex; align-items: center; gap: .5rem; flex: none; }
.scheme-sel { width: auto; padding: .4em .6em; }
.pmain { max-width: 1120px; margin: 0 auto; padding: 1.2rem clamp(.8rem, 3vw, 2rem) 4rem; }

/* title screen */
.hero { text-align: center; padding: clamp(1.4rem, 4vw, 2.6rem); margin-top: 1rem; }
.hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: .3em; }
.hero .meta { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; margin: 1rem 0 1.3rem; }
.strict-box { max-width: 560px; margin: 1.2rem auto; text-align: left; border: 1px solid var(--border); border-radius: 12px; padding: .9rem 1.1rem; background: var(--surface2); }
.switch { display: flex; align-items: center; gap: .7rem; font-weight: 700; cursor: pointer; }
.switch input { width: 2.6rem; height: 1.45rem; accent-color: var(--accent); }
.howto { margin-top: 1.2rem; text-align: left; }
.howto ul { margin: .4rem 0 0; padding-left: 1.2rem; } .howto li { margin: .25rem 0; }
kbd { font: 600 .8em var(--mono); padding: .1em .45em; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface2); }

/* question screen */
/* question picker: every question is a box. White = open, yellow = marked for review, green / red = result (strict mode) */
html { --mark-bg: #fde047; --mark-bd: #ca8a04; --mark-ink: #2b2100; }          /* yellow stays yellow in light and dark, like .btn-hint */
.qpick { margin: .2rem 0 1.1rem; }
.pills { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: .2rem .35rem .35rem 0; }
.pill { position: relative; min-width: 46px; height: 46px; padding: 0 .4rem; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: 800 1rem/1 var(--font, inherit); cursor: pointer; touch-action: manipulation; transition: transform .1s, box-shadow .15s; }
.pill:hover { border-color: var(--accent); transform: translateY(-1px); }
.pill.marked { background: var(--mark-bg); border-color: var(--mark-bd); color: var(--mark-ink); }
.pill.ok { background: color-mix(in srgb, var(--ok) 32%, var(--surface)); border-color: var(--ok); color: var(--text); }
.pill.bad { background: color-mix(in srgb, var(--bad) 32%, var(--surface)); border-color: var(--bad); color: var(--text); }
.pill.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--text); }
.pill .pf, .pill .pr { position: absolute; display: grid; place-items: center; line-height: 1; pointer-events: none; }
.pill .pf { top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--mark-bg); border: 1.5px solid var(--mark-bd); color: var(--mark-ink); }
.pill .pr { bottom: 2px; right: 4px; font-size: .68rem; font-weight: 900; }
.pill.ok .pr { color: var(--ok); } .pill.bad .pr { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: .25rem 1.1rem; margin-top: .5rem; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: .4rem; }
.legend i { display: inline-block; width: 15px; height: 15px; border-radius: 4px; border: 2px solid var(--border); background: var(--surface); }
.legend i.m { background: var(--mark-bg); border-color: var(--mark-bd); }
.legend i.ok { background: color-mix(in srgb, var(--ok) 32%, var(--surface)); border-color: var(--ok); }
.legend i.bad { background: color-mix(in srgb, var(--bad) 32%, var(--surface)); border-color: var(--bad); }
.mark-btn { margin-left: auto; display: inline-flex; align-items: center; gap: .4rem; }
.mark-btn[aria-pressed="true"] { background: var(--mark-bg); border-color: var(--mark-bd); color: var(--mark-ink); }
.qcard { padding: clamp(1rem, 2.5vw, 1.6rem); transition: border-color .2s, box-shadow .2s; }
.qcard.bad { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 40%, transparent), var(--shadow); }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .8rem; }
.qnum { font-weight: 800; font-size: 1.05rem; margin-right: .3rem; }
.chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); border-color: var(--bad); color: var(--bad); }
.qprompt { font-size: 1.05rem; }
.qtarget { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; margin: 1rem 0 .6rem; padding: .7rem .9rem; background: var(--surface2); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; }
.qtarget .lbl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.qtarget code { font-size: 1.2rem; font-weight: 700; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 .6rem; }

.btn-hint { background: #f59e0b; border-color: #f59e0b; color: #241500; }
.btn-hint:hover:not(:disabled) { background: #fbbf24; border-color: #fbbf24; }
.hint { margin: .7rem 0 0; padding: .7rem .9rem; border-radius: 10px; background: color-mix(in srgb, #f59e0b 13%, var(--surface)); border: 1px solid color-mix(in srgb, #f59e0b 55%, transparent); }
.hint-h { font-weight: 800; color: #d97706; margin-bottom: .2rem; }
html[data-theme="dark"] .hint-h { color: #fbbf24; }
.qhints { margin: .4rem 0; } .qhints .btn-hint { margin-top: .7rem; }

.qactions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin: .4rem 0 1rem; }
.banner { flex: 1 1 100%; padding: .65rem .9rem; border-radius: 10px; font-weight: 700; border: 1px solid; }
.banner.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); border-color: var(--ok); color: var(--ok); }
.banner.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); color: var(--bad); }
.banner small { display: block; font-weight: 500; color: var(--muted); }

.attempts h3, .solution h3 { margin-top: 1.2rem; }
.attempt { border: 1px solid var(--border); border-left-width: 5px; border-radius: 10px; margin: .7rem 0; background: var(--surface); }
.attempt.bad { border-left-color: var(--bad); } .attempt.ok { border-left-color: var(--ok); }
.attempt summary { cursor: pointer; padding: .6rem .9rem; font-weight: 700; }
.att-badge { margin-right: .4rem; } .attempt.bad .att-badge { color: var(--bad); } .attempt.ok .att-badge { color: var(--ok); }
.att-body { padding: 0 .9rem .9rem; }
.att-head { font-weight: 700; margin: .7rem 0 .3rem; }
.issues { margin: .2rem 0 0; padding-left: 1.2rem; } .issues li { margin: .35rem 0; }
.issues .extra { margin-top: .25rem; padding: .45rem .7rem; border-radius: 8px; background: var(--surface2); border: 1px dashed var(--border); color: var(--muted); font-size: .92rem; }
.solution { margin-top: 1.2rem; padding: 1rem 1.1rem; border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 12px; }
.solution h3 { margin-top: 0; } .solution details { margin-top: .8rem; } .solution summary { cursor: pointer; font-weight: 700; margin-bottom: .5rem; }
.qnav { display: flex; justify-content: space-between; gap: .6rem; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* results */
.res-top { display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; align-items: center; }
.score { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 800; line-height: 1; color: var(--accent-text); }
.bar { position: relative; height: 14px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.ok i { background: var(--ok); } .bar.bad i { background: var(--bad); }
.bar u { position: absolute; top: 0; bottom: 0; left: 90%; width: 2px; background: var(--text); opacity: .55; }
.subj { margin: .9rem 0; } .subj-h { display: flex; justify-content: space-between; gap: .6rem; margin-bottom: .3rem; font-weight: 700; }
.rounds { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
.res-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.1rem; }
.qrow { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin: .6rem 0; overflow: hidden; }
.qrow-h { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: .7rem; padding: .7rem .9rem; }
.qrow-n { font-weight: 800; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 8px; background: var(--surface2); }
.qrow-t { min-width: 0; } .qrow-t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { font-weight: 800; white-space: nowrap; } .st.ok { color: var(--ok); } .st.bad { color: var(--bad); } .st.skip { color: var(--warn); }
.detail { padding: 0 .9rem 1rem; border-top: 1px solid var(--border); }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 1rem; margin-top: .8rem; }
.res-tools { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-top: 1.4rem; flex-wrap: wrap; }

/* practice drill + "Corrected!" labels: a fixed aquatic accent, independent of the chosen colour scheme */
html { --aq: #0891b2; --aq-text: #0e7490; --aq-soft: color-mix(in srgb, #06b6d4 14%, transparent); }
html[data-theme="dark"] { --aq: #22d3ee; --aq-text: #67e8f9; --aq-soft: color-mix(in srgb, #22d3ee 14%, transparent); }
.btn.aqua { background: var(--aq); border-color: var(--aq); color: #ffffff; }
html[data-theme="dark"] .btn.aqua { color: #032029; }
.btn.aqua:hover:not(:disabled) { background: color-mix(in srgb, var(--aq) 86%, #ffffff 14%); border-color: var(--aq); }
.chip.aqua { background: var(--aq-soft); border-color: var(--aq); color: var(--aq-text); font-weight: 700; }
.aq-text { color: var(--aq-text); }
.drillbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .8rem; padding: .6rem .9rem; margin-bottom: .9rem; border: 1px solid var(--aq); border-radius: 12px; background: var(--aq-soft); }
.banner.corr { background: var(--aq-soft); border-color: var(--aq); color: var(--aq-text); margin-bottom: 1rem; }
.qrow.corrected { border-color: var(--aq); background: color-mix(in srgb, var(--aq) 8%, var(--surface)); box-shadow: inset 5px 0 0 var(--aq); }
.stbox { display: flex; flex-direction: column; align-items: flex-end; gap: .2rem; text-align: right; }
.stbox small { font-weight: 700; font-size: .75rem; }
.corr-chip { display: inline-block; padding: .15em .65em; border-radius: 999px; background: var(--aq); color: #ffffff; font-weight: 800; font-size: .82rem; white-space: nowrap; }
html[data-theme="dark"] .corr-chip { color: #032029; }

/* ---- typed-answer and dropdown-step questions ---- */
.answer { margin: 1rem 0 .4rem; padding: .9rem 1rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--surface2); }
.answer.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--surface2)); }
.alabel { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .4rem; }
.exprline { display: flex; align-items: center; gap: .6rem; }
.exlhs { flex: none; font: 800 1.25rem var(--mono); }
.exprin { flex: 1; min-width: 0; font: 600 1.2rem var(--mono); padding: .6em .75em; letter-spacing: .02em; }
.exprin[readonly] { opacity: .85; cursor: default; }
.keys { display: flex; flex-wrap: wrap; gap: .4rem; margin: .7rem 0 .2rem; }
.key { min-width: 2.6rem; height: 2.6rem; padding: 0 .7rem; border-radius: 9px; border: 1px solid var(--border); border-bottom-width: 3px; background: var(--surface); color: var(--text); font: 700 1.05rem var(--mono); cursor: pointer; touch-action: manipulation; }
.key:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.key:active:not(:disabled) { transform: translateY(1px); border-bottom-width: 2px; }
.key:disabled { opacity: .45; cursor: not-allowed; }
.key.op { color: var(--accent-text); }
.key.wide { font: 600 .85rem var(--font, inherit); min-width: 3.4rem; }
.exprprev { margin-top: .6rem; padding: .5rem .75rem; border-radius: 9px; border: 1px dashed var(--border); background: var(--surface); font-size: .95rem; min-height: 2.4rem; overflow-wrap: anywhere; }
.exprprev.ok { border-style: solid; border-color: var(--accent-line); }
.exprprev.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.fx { font-family: var(--mono); font-weight: 700; }
.fx.big { font-size: 1.2rem; }
.exmsg { margin-top: .6rem; padding: .6rem .8rem; border-radius: 9px; border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); font-size: .95rem; }
.exmsg[hidden] { display: none; }
.ans-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; margin: .5rem 0; padding: .55rem .8rem; border-radius: 9px; background: var(--surface2); border: 1px solid var(--border); }
.ans-line .lbl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ans-line code { font-size: 1.1rem; overflow-wrap: anywhere; }
.stepq { margin: 0 0 .9rem; padding: .6rem .75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.stepq.ok { border-color: var(--ok); } .stepq.bad { border-color: var(--bad); }
.steplbl { display: block; font-weight: 600; margin-bottom: .45rem; }
.stepn { display: inline-block; margin-right: .35rem; padding: .05em .55em; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .78rem; font-weight: 800; }
.selrow { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.stepsel { flex: 1 1 280px; min-width: 0; font-size: 1rem; }
.smark { font-weight: 800; white-space: nowrap; } .stepq.ok .smark { color: var(--ok); } .stepq.bad .smark { color: var(--bad); }
.steps-att { margin: .4rem 0; padding-left: 1.5rem; }
.steps-att li { margin: .45rem 0; padding: .25rem .6rem; border-left: 4px solid var(--border); border-radius: 4px; }
.steps-att li.ok { border-left-color: var(--ok); } .steps-att li.bad { border-left-color: var(--bad); } .steps-att li.skip { border-left-color: var(--warn); }
.howto h3 { margin: 1rem 0 .2rem; } .howto h3:first-child { margin-top: 0; }
@media (max-width: 640px) { .exprline { flex-wrap: wrap; } .exprin { flex-basis: 100%; } .key { min-width: 2.4rem; height: 2.6rem; } }

@media (max-width: 640px) {
  .res-top { grid-template-columns: 1fr; }
  .qrow-h { grid-template-columns: auto 1fr; } .qrow-h .stbox, .qrow-h .btn { grid-column: 2; justify-self: start; align-items: flex-start; text-align: left; }
  .pbrand #pTitle { max-width: 38vw; }
}
@media print { .pbar, .qactions, .qnav, .ce-bar { display: none; } }

<body>

<div id="app">
  <header class="pbar">
    <div class="pbrand"><span class="logo" aria-hidden="true">&#8892;</span><span id="pTitle"></span></div>
    <div class="ptools">
      <select id="selScheme" class="input scheme-sel" aria-label="Color scheme" title="Color scheme">
        <option value="aqua">Aqua</option>
        <option value="blue">Blue</option>
        <option value="orange">Orange</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
        <option value="crimson">Crimson Red</option>
      </select>
      <button id="btnTheme" class="icon-btn" type="button" aria-label="Toggle light and dark mode" title="Toggle light / dark mode"></button>
    </div>
  </header>
  <main id="screen" class="pmain"></main>
</div>
<div id="modalRoot"></div>
<noscript><p style="padding:1rem">This quiz needs JavaScript (it runs entirely offline in your browser).</p></noscript>


<script>

/* =====================================================================
   Logic Circuit Engine
   Shared by the Quiz Builder (authoring) and the generated Quiz Player.
   Sections:  1 helpers  2 Boolean expressions  3 circuit model & checking
              4 rich-text sanitizer  5 SVG schematic renderer  6 interactive editor
   ===================================================================== */
var Engine = (function () {
  'use strict';

  var GRID = 20, CANVAS_W = 1000;
  var GATE_TYPES = ['AND', 'OR', 'NAND', 'NOR', 'XOR', 'XNOR', 'NOT'];
  var Q_TYPES = ['circuit', 'expression', 'steps'];          /* question types */
  var OUTER_OPS = ['any', 'or', 'and', 'xor'];               /* expression questions: required top-level operator */
  var FB_KEYS = ['function', 'illegal', 'pins', 'notuse', 'depth', 'gates', 'incomplete',            /* circuit questions */
    'syntax', 'vars', 'literal', 'outer', 'twolevel', 'canonical', 'terms', 'literals', 'dup',         /* expression questions */
    'step'];                                                                                           /* step (dropdown) questions */
  var MAX_WP = 24;          /* routing points per wire */
  var MAX_COPIES = 8;       /* instances of one input terminal (original + copies) */

  /* ------------------------------------------------------------ 1. helpers */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function snap(v) { return Math.round(v / GRID) * GRID; }
  function snapX(v) { return Math.round(v / GRID) * GRID; }                    /* routing points / terminals: x on the 20-grid ... */
  function snapY(v) { return Math.round((v - 10) / GRID) * GRID + 10; }        /* ... y on the 10-offset grid, where every pin and input sits */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function isGateId(s) { return /^g\d+$/.test(String(s)); }
  function termName(id) { return String(id).replace(/#\d+$/, ''); }             /* "A'#7" (a copy of input A') -> "A'" */
  function srcKey(s) { return isGateId(s) ? s : termName(s); }                  /* identity of the SIGNAL a source carries */
  function posInt(v) { v = Math.floor(+v); return v > 0 ? v : null; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  /* ------------------------------------------------- 2. Boolean expressions */
  function ExprError(msg, pos) { var e = new Error(msg); e.pos = pos; return e; }

  function tokenize(src) {
    var toks = [], i = 0;
    while (i < src.length) {
      var c = src.charAt(i);
      if (/\s/.test(c)) { i++; continue; }
      if (/[A-Za-z]/.test(c)) toks.push({ t: 'var', v: c.toUpperCase(), pos: i });
      else if (c === '0' || c === '1') toks.push({ t: 'const', v: +c, pos: i });
      else if ("'\u2019\u2032`".indexOf(c) >= 0) toks.push({ t: 'prime', pos: i });
      else if ('~!\u00AC'.indexOf(c) >= 0) toks.push({ t: 'not', pos: i });
      else if ('+|\u2228'.indexOf(c) >= 0) toks.push({ t: 'or', pos: i });
      else if ('*&.\u00B7\u2022\u2227'.indexOf(c) >= 0) toks.push({ t: 'and', pos: i });
      else if ('^\u2295'.indexOf(c) >= 0) toks.push({ t: 'xor', pos: i });
      else if (c === '(' || c === '[') toks.push({ t: 'lp', pos: i });
      else if (c === ')' || c === ']') toks.push({ t: 'rp', pos: i });
      else throw ExprError('Unexpected character "' + c + '"', i);
      i++;
    }
    return toks;
  }

  function parseTokens(toks) {
    var p = 0;
    function peek() { return toks[p]; }
    function startsUnary(k) { return k.t === 'var' || k.t === 'const' || k.t === 'lp' || k.t === 'not'; }
    function chain(type, sub, op) {
      var args = [sub()];
      while (peek() && peek().t === op) { p++; args.push(sub()); }
      return args.length === 1 ? args[0] : { t: type, args: args };
    }
    function parseOr() { return chain('or', parseXor, 'or'); }
    function parseXor() { return chain('xor', parseAnd, 'xor'); }
    function parseAnd() {
      var args = [parseUnary()];
      for (;;) {
        var k = peek();
        if (!k) break;
        if (k.t === 'and') { p++; args.push(parseUnary()); }
        else if (startsUnary(k)) args.push(parseUnary());
        else break;
      }
      return args.length === 1 ? args[0] : { t: 'and', args: args };
    }
    function parseUnary() {
      var k = peek();
      if (!k) throw ExprError('The expression ends unexpectedly', -1);
      if (k.t === 'not') { p++; return { t: 'not', a: parseUnary() }; }
      var node = parsePrimary();
      while (peek() && peek().t === 'prime') { p++; node = { t: 'not', a: node }; }
      return node;
    }
    function parsePrimary() {
      var k = toks[p++];
      if (!k) throw ExprError('The expression ends unexpectedly', -1);
      if (k.t === 'var') return { t: 'var', n: k.v };
      if (k.t === 'const') return { t: 'const', v: k.v };
      if (k.t === 'lp') {
        var e = parseOr(), r = toks[p++];
        if (!r || r.t !== 'rp') throw ExprError('Missing closing parenthesis', k.pos);
        return e;
      }
      var shown = { rp: ')', prime: "'", or: '+', and: '*', xor: '^' }[k.t] || k.t;
      throw ExprError('Unexpected "' + shown + '" - an operand (variable or parenthesis) was expected', k.pos);
    }
    var ast = parseOr();
    if (p < toks.length) {
      var k = toks[p];
      throw ExprError(k.t === 'rp' ? 'Unmatched closing parenthesis' : 'Unexpected token in expression', k.pos);
    }
    return ast;
  }

  function collectVars(n, set) {
    if (n.t === 'var') set[n.n] = 1;
    else if (n.t === 'not') collectVars(n.a, set);
    else if (n.args) n.args.forEach(function (a) { collectVars(a, set); });
    return set;
  }

  /* parseExpression("F = AB'C + A'BD") -> {ok, ast, vars, out} | {ok:false, error} */
  function parseExpression(src) {
    src = String(src == null ? '' : src);
    var out = 'F', rhs = src, eq = src.indexOf('=');
    if (eq >= 0) {
      var lhs = src.slice(0, eq).trim();
      var m = lhs.match(/^([A-Za-z][A-Za-z0-9_]*)\s*(\([^)]*\))?$/);
      if (!m) return { ok: false, error: 'The left side of "=" should be a function name such as F or F(A,B,C).' };
      out = m[1];
      rhs = src.slice(eq + 1);
      if (rhs.indexOf('=') >= 0) return { ok: false, error: 'Only one "=" sign is allowed.' };
    }
    if (!rhs.trim()) return { ok: false, error: "Enter a Boolean expression, e.g.  F = AB'C + A'BD" };
    try {
      var ast = parseTokens(tokenize(rhs));
      var vars = Object.keys(collectVars(ast, {})).sort();
      if (!vars.length) return { ok: false, error: 'The expression must contain at least one variable.' };
      if (vars.length > 10) return { ok: false, error: 'Too many variables (' + vars.length + '). The maximum is 10.' };
      return { ok: true, ast: ast, vars: vars, out: out, src: src };
    } catch (e) {
      return { ok: false, error: e.message, pos: e.pos };
    }
  }

  function evalAst(n, env) {
    var i, v;
    switch (n.t) {
      case 'var': return env[n.n] ? 1 : 0;
      case 'const': return n.v;
      case 'not': return evalAst(n.a, env) ? 0 : 1;
      case 'and': for (i = 0; i < n.args.length; i++) if (!evalAst(n.args[i], env)) return 0; return 1;
      case 'or': for (i = 0; i < n.args.length; i++) if (evalAst(n.args[i], env)) return 1; return 0;
      case 'xor': v = 0; for (i = 0; i < n.args.length; i++) v ^= evalAst(n.args[i], env); return v;
    }
    return 0;
  }

  /* All 2^N assignments; first variable is the most significant bit. */
  function rowsFor(vars) {
    var n = vars.length, total = 1 << n, rows = [];
    for (var r = 0; r < total; r++) {
      var env = {};
      for (var i = 0; i < n; i++) env[vars[i]] = (r >> (n - 1 - i)) & 1;
      rows.push(env);
    }
    return rows;
  }
  function minterms(parsed) {
    var m = [];
    rowsFor(parsed.vars).forEach(function (env, i) { if (evalAst(parsed.ast, env)) m.push(i); });
    return m;
  }

  /* ------------------------------------------ 3. circuit model & checking */
  /* circuit = { gates:[{id:'g1',type,nIn,x,y,flip}],
                 wires:[{id:'w2',from,to,pts?:[{x,y},..]}],      pts = user routing points (corners), source -> sink order
                 terms?:[{id,x,y},..],                            input-terminal instances (moved and/or copied); absent = default layout
                 seq }
     wire.from : terminal instance id ("A", "A'", or a copy "A#7" / "A'#7") or gate id ("g3")
     wire.to   : "g4.0" (gate 4, pin 0) or "OUT"
     A copy of an input is the same logical variable (termName strips the "#n"). */
  function newCircuit() { return { gates: [], wires: [], seq: 1 }; }
  function pinCount(g) { return g.type === 'NOT' ? 1 : g.nIn; }
  function gateLabel(g) { return g.type + ' #' + g.id.slice(1); }

  function cleanPts(a) {
    var out = [];
    if (Array.isArray(a)) a.slice(0, MAX_WP).forEach(function (p) {
      if (p && isFinite(+p.x) && isFinite(+p.y)) out.push({ x: clamp(Math.round(+p.x), 0, CANVAS_W), y: clamp(Math.round(+p.y), 0, 4000) });
    });
    return out;
  }

  function sanitizeCircuit(c0) {
    var c = { gates: [], wires: [], seq: 1 };
    if (!c0 || typeof c0 !== 'object') return c;
    var ids = {}, gmap = {}, wids = {}, sinks = {}, seq = Math.max(1, c0.seq | 0);
    (c0.gates || []).forEach(function (g) {
      if (!g || !isGateId(g.id) || GATE_TYPES.indexOf(g.type) < 0 || ids[g.id]) return;
      var n = g.type === 'NOT' ? 1 : clamp(g.nIn | 0 || 2, 2, 8);
      var ng = { id: g.id, type: g.type, nIn: n, x: +g.x || 0, y: +g.y || 0, flip: !!g.flip };
      c.gates.push(ng); ids[g.id] = 1; gmap[g.id] = ng;
      seq = Math.max(seq, parseInt(g.id.slice(1), 10) + 1);
    });
    (c0.wires || []).forEach(function (w) {
      if (!w || typeof w.from !== 'string' || typeof w.to !== 'string') return;
      if (isGateId(w.from) && !ids[w.from]) return;
      var ok = w.to === 'OUT', m;
      if (!ok && (m = /^(g\d+)\.(\d+)$/.exec(w.to)) && gmap[m[1]]) ok = (+m[2]) < pinCount(gmap[m[1]]);
      if (!ok || sinks[w.to]) return;
      var wid = (typeof w.id === 'string' && /^w\d+$/.test(w.id) && !wids[w.id]) ? w.id : null;
      if (!wid) wid = 'w' + (seq++);
      wids[wid] = 1; sinks[w.to] = 1;
      seq = Math.max(seq, parseInt(wid.slice(1), 10) + 1);
      var nw = { id: wid, from: w.from, to: w.to }, pts = cleanPts(w.pts);
      if (pts.length) nw.pts = pts;
      c.wires.push(nw);
    });
    var terms = [], tids = {};
    (Array.isArray(c0.terms) ? c0.terms : []).slice(0, 96).forEach(function (t) {
      if (!t || typeof t.id !== 'string') return;
      var m = /^[A-Z]'?(?:#(\d+))?$/.exec(t.id);
      if (!m || tids[t.id] || !isFinite(+t.x) || !isFinite(+t.y)) return;
      tids[t.id] = 1;
      terms.push({ id: t.id, x: clamp(Math.round(+t.x), 0, CANVAS_W), y: clamp(Math.round(+t.y), 0, 4000) });
      if (m[1]) seq = Math.max(seq, +m[1] + 1);
    });
    if (terms.length) c.terms = terms;
    c.seq = seq;
    return c;
  }

  /* The input terminals actually present in circuit c: its own (moved / copied) instances when it has any, plus the default
     instance of every required input that has none, so every input always has at least one instance. */
  function terminalInstances(c, cfg) {
    var L = layout(cfg), names = {}, res = [], seen = {}, have = {};
    terminalNames(cfg).forEach(function (n) { names[n] = 1; });
    ((c && c.terms) || []).forEach(function (t) {
      var nm = termName(t.id);
      if (!names[nm] || seen[t.id]) return;
      seen[t.id] = 1; have[nm] = 1;
      res.push({ id: t.id, name: nm, x: clamp(t.x, 80, L.W - 120), y: clamp(t.y, 24, L.H - 24), clone: t.id !== nm });
    });
    L.terms.forEach(function (d) { if (!have[d.id]) res.push({ id: d.id, name: d.id, x: d.x, y: d.y, clone: false }); });
    return res;
  }

  function gateEval(type, ins) {
    var and = 1, or = 0, par = 0, i;
    for (i = 0; i < ins.length; i++) { if (!ins[i]) and = 0; if (ins[i]) or = 1; par ^= ins[i]; }
    switch (type) {
      case 'AND': return and;
      case 'OR': return or;
      case 'NAND': return 1 - and;
      case 'NOR': return 1 - or;

  /* ------------------------------ 3b. expression answers and step (dropdown) answers */
  /* Canonical AST: nested AND / OR / XOR flattened, double negations removed. Used for structure checks and the exact-form comparison. */

  /* checkExpression(text, question) -> { pass, functional, literalMatch, headline, issues:[{code,text,extra}], terms, literals, rowsTotal, rowsBad, example, expr } */
  function checkExpression(text, q) {

  /* checkSteps(selection, question): selection[i] = index (into steps[i].options) the student chose, or null/undefined */

  /* --------------------------------------------------- 4. rich-text sanitizer */

  /* ------------------------------------------------ 5. SVG schematic renderer */

    XOR: { n: ['XOR', 0, 0], f: null },

        if (bx > 10.5) s += '<line class="gstub" x1="10" y1="' + py + '" x2="' + bx.toFixed(1) + '" y2="' + py + '"/>';
      } else s += '<line class="gstub" x1="0" y1="' + py + '" x2="' + bx.toFixed(1) + '" y2="' + py + '"/>';

  }

  function gateSVG(g, o) {

      (o.interactive && g.id ? ' data-gate="' + g.id + '"' : '') + ' transform="translate(' + g.x + ',' + g.y + ')">';
    s += '<rect class="ghit" x="0" y="-4" width="80" height="' + (h + 8) + '"/>';
    if (o.sel) s += '<rect class="gsel" x="-8" y="-8" width="96" height="' + (h + 32) + '" rx="8"/>';

  function iconSVG(type) {

  function route(a, b, jitter) {

  /* Build the schematic as an SVG string.

        (o.interactive ? '<rect class="thit" x="' + (bx - 3) + '" y="' + (t.y - 17) + '" width="56" height="34" rx="9"/>' : '') +
        '<line class="tline" x1="' + (t.x - 18) + '" y1="' + t.y + '" x2="' + t.x + '" y2="' + t.y + '"/>' +
        '<rect class="tbox" x="' + bx + '" y="' + (t.y - 14) + '" width="50" height="28" rx="7"/>' +
        '<text class="ttxt" x="' + (bx + 25) + '" y="' + (t.y + 5.5) + '">' + esc(t.name) + '</text></g>');

          '<circle class="tplus-hit" cx="' + px + '" cy="' + py + '" r="11"/><circle class="tplus-c" cx="' + px + '" cy="' + py + '" r="7"/>' +
          '<path class="tplus-p" d="M' + (px - 3.5) + ',' + py + ' H' + (px + 3.5) + ' M' + px + ',' + (py - 3.5) + ' V' + (py + 3.5) + '"/></g>');

      '<rect class="tbox out" x="' + (L.out.x + 22) + '" y="' + (L.out.y - 14) + '" width="52" height="28" rx="7"/>' +

  function renderStatic(c, cfg, o) {

  /* ------------------------------------------------- 6. interactive editor */
  function createEditor(host, o) {

    var onChange = o.onChange || function () {};
    var L = layout(cfg);
    var sel = null, wiring = null, ghost = null, drag = null, palette = null, lastTap = null, tdrag = null, wdrag = null;
    var hist = [], hi = -1, rafId = 0, toastTimer = 0, namesSig = terminalNames(cfg).join('|');

    host.classList.add('ce');
    host.innerHTML = '<div class="ce-bar"></div><div class="ce-wrap"><div class="ce-box" tabindex="0" aria-label="Circuit canvas"></div><div class="ce-toast" role="status"></div></div><div class="ce-status"></div><div class="ce-help"></div>';

    }

    /* ---- toolbar ---- */
    function renderBar() {
      var h = '<div class="ce-gates" role="group" aria-label="Gate toolbar">';
      GATE_TYPES.forEach(function (t) {
        var ok = cfg.gates.indexOf(t) >= 0;
        h += '<button type="button" class="ce-g' + (ok ? '' : ' locked') + '" data-type="' + t + '" title="' +
          (ok ? 'Drag a ' + t + ' gate onto the canvas (or click to add it)' : t + ' gates are not allowed in this question') + '">' +
          iconSVG(t) + '<span>' + t + '</span>' + (ok ? '' : '<i class="lk" aria-hidden="true">\uD83D\uDD12</i>') + '</button>';
      });
      h += '</div><div class="ce-tools">' +
        '<button type="button" class="ce-t" data-act="wp" hidden title="Remove the last routing point of the wire you are drawing, or cancel the wire (Esc or right-click)">\u2936 Undo point</button>' +
        '<span class="ce-pins" hidden><span>Inputs</span><button type="button" data-act="pm" aria-label="Fewer inputs">\u2212</button><b>2</b><button type="button" data-act="pp" aria-label="More inputs">+</button></span>' +
        '<button type="button" class="ce-t" data-act="flip" title="Swap between the standard and De Morgan symbol (Space or double-click)">\u21C4 Flip symbol</button>' +
        '<button type="button" class="ce-t" data-act="clonet" title="Add another copy of the selected input terminal (or press its + badge)">\u29C9 Copy input</button>' +
        '<button type="button" class="ce-t" data-act="del" title="Delete the selected gate, wire or extra input copy (Delete)">\uD83D\uDDD1 Delete</button>' +
        '<button type="button" class="ce-t" data-act="undo" title="Undo (Ctrl+Z)">\u21B6</button>' +
        '<button type="button" class="ce-t" data-act="redo" title="Redo (Ctrl+Y)">\u21B7</button>' +
        '<button type="button" class="ce-t danger" data-act="clear" title="Remove every gate and wire, and put the inputs back in their default places">\u27F2 Reset</button></div>';
      bar.innerHTML = h;
      var parts = ['Drag gates from the toolbar onto the grid.',
        'Wire up: click an output (or an input terminal), optionally click empty grid points to add routing corners, then click a gate input pin \u2014 or just drag straight between two ports.',

        'Drag an input box to move it; its + badge adds another copy of that input, so you can place it right next to the gate that needs it.',

    function updateTools() {
      var g = sel && sel.type === 'gate' ? gateById(sel.id) : null;
