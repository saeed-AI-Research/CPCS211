)\u003c/code> (2 terms, 5 literals).\u003c/p>","feedback":{"function":"Your expression does not match the truth table.","illegal":"","pins":"","notuse":"","depth":"","gates":"","incomplete":"","syntax":"","vars":"","literal":"","outer":"Write the answer as a product (AND) of sums.","twolevel":"Every factor must be a plain sum of literals.","canonical":"","terms":"A minimum POS needs only 2 factors.","literals":"A minimum POS needs only 5 literals. Combine adjacent zeros first.","dup":"","step":""},"solution":null},{"id":"q9sgjinu","type":"circuit","subject":"Drawing NAND Circuits","weight":1,"promptHTML":"\u003cp>\u003cb>6a.\u003c/b> Assume all inputs are available both uncomplemented and complemented.\u003c/p>\u003cp>Show an implementation of\u003c/p>\u003cp>\u003ccode>g = wx + wz + w'x' + w'y'z' = (w' + x + z)(w + x' + y')(w + x' + z')\u003c/code>\u003c/p>\u003cp>using \u003cb>NAND gates of any size\u003c/b>.\u003c/p>","target":"g = wx + wz + w'x' + w'y'z'","gates":["NAND"],"pinRule":{"mode":"upto","n":8},"deMorgan":true,"complements":true,"noNotUse":false,"maxDepth":null,"maxGates":null,"evalMode":"truth","outerOp":"any","twoLevel":false,"canonical":false,"noDup":false,"maxTerms":null,"maxLiterals":null,"showTarget":false,"modelAnswer":"","steps":[],"hints":["\u003cp>A NAND-NAND network implements a sum of products: first-level NAND gates make the product terms (complemented) and a final NAND combines them.\u003c/p>","\u003cp>g has four product terms: wx, wz, w'x' and w'y'z'. Use one NAND gate for each (complemented inputs are free) and feed all four into one 4-input NAND gate.\u003c/p>"],"explanationHTML":"\u003cp>Use the SOP form \u003ccode>g = wx + wz + w'x' + w'y'z'\u003c/code>.\u003c/p>\u003cp>Level 1: \u003ccode>NAND(w,x)\u003c/code>, \u003ccode>NAND(w,z)\u003c/code>, \u003ccode>NAND(w',x')\u003c/code> and \u003ccode>NAND(w',y',z')\u003c/code> give the complemented product terms.\u003c/p>\u003cp>Level 2: a 4-input NAND of these four outputs gives \u003ccode>g\u003c/code> by De Morgan's theorem.\u003c/p>\u003cp>That is \u003cb>5 gates in 2 levels\u003c/b>.\u003c/p>","feedback":{"function":"Use the SOP form: one NAND gate per product term, then one NAND gate combining all of them.","illegal":"Only NAND gates are allowed in this question.","pins":"","notuse":"","depth":"","gates":"","incomplete":"","syntax":"","vars":"","literal":"","outer":"","twolevel":"","canonical":"","terms":"","literals":"","dup":"","step":""},"solution":{"gates":[{"id":"g1","type":"NAND","nIn":2,"x":180,"y":60,"flip":false},{"id":"g2","type":"NAND","nIn":2,"x":180,"y":160,"flip":false},{"id":"g3","type":"NAND","nIn":2,"x":180,"y":260,"flip":false},{"id":"g4","type":"NAND","nIn":3,"x":180,"y":340,"flip":false},{"id":"g5","type":"NAND","nIn":4,"x":800,"y":180,"flip":true}],"wires":[{"id":"w6","from":"W","to":"g1.0"},{"id":"w7","from":"X","to":"g1.1"},{"id":"w8","from":"W","to":"g3.0"},{"id":"w9","from":"Z","to":"g3.1"},{"id":"w10","from":"W'","to":"g2.0"},{"id":"w11","from":"X'","to":"g2.1"},{"id":"w12","from":"W'","to":"g4.0"},{"id":"w13","from":"Y'","to":"g4.1"},{"id":"w14","from":"Z'","to":"g4.2"},{"id":"w15","from":"g1","to":"g5.0"},{"id":"w16","from":"g3","to":"g5.1"},{"id":"w17","from":"g2","to":"g5.2"},{"id":"w18","from":"g4","to":"g5.3"},{"id":"w19","from":"g5","to":"OUT"}],"seq":20}},{"id":"q8ltigwx","type":"circuit","subject":"Drawing NAND Circuits","weight":1,"promptHTML":"\u003cp>\u003cb>6c.\u003c/b> Assume all inputs are available both uncomplemented and complemented.\u003c/p>\u003cp>Show an implementation of\u003c/p>\u003cp>\u003ccode>g = wx + wz + w'x' + w'y'z' = (w' + x + z)(w + x' + y')(w + x' + z')\u003c/code>\u003c/p>\u003cp>using \u003cb>two-input NAND gates\u003c/b>, none of which may be used as a NOT gate.\u003c/p>","target":"g = wx + wz + w'x' + w'y'z'","gates":["NAND"],"pinRule":{"mode":"strict","n":2},"deMorgan":true,"complements":true,"noNotUse":true,"maxDepth":null,"maxGates":null,"evalMode":"truth","outerOp":"any","twoLevel":false,"canonical":false,"noDup":false,"maxTerms":null,"maxLiterals":null,"showTarget":false,"modelAnswer":"","steps":[],"hints":["\u003cp>Factor the function so that every gate needs only two inputs: g = w(x + z) + w'(x' + y'z'). Remember NAND(a, b) = a' + b'.\u003c/p>","\u003cp>x + z = NAND(x', z') and y + z = NAND(y', z'). Then x' + y'z' = (x(y + z))' = NAND(x, NAND(y', z')).\u003c/p>"],"explanationHTML":"\u003cp>Factor: \u003ccode>g = w(x + z) + w'(x' + y'z')\u003c/code>.\u003c/p>\u003cp>\u003ccode>x + z = NAND(x', z')\u003c/code>, so \u003ccode>w(x + z)\u003c/code> is the complement of \u003ccode>NAND(NAND(x',z'), w)\u003c/code>.\u003c/p>\u003cp>\u003ccode>y + z = NAND(y', z')\u003c/code> and \u003ccode>x' + y'z' = (x(y + z))' = NAND(x, NAND(y',z'))\u003c/code>, so \u003ccode>w'(x' + y'z')\u003c/code> is the complement of \u003ccode>NAND(NAND(x, NAND(y',z')), w')\u003c/code>.\u003c/p>\u003cp>The final NAND of these two complemented terms gives \u003ccode>g\u003c/code>. That is \u003cb>6 two-input NAND gates\u003c/b>, none used as an inverter.\u003c/p>","feedback":{"function":"","illegal":"Only NAND gates are allowed in this question.","pins":"Every NAND gate must have exactly two inputs. Factor the expression so that no gate needs more.","notuse":"Do not tie the inputs of a NAND together; the complemented inputs are already available.","depth":"","gates":"","incomplete":"","syntax":"","vars":"","literal":"","outer":"","twolevel":"","canonical":"","terms":"","literals":"","dup":"","step":""},"solution":{"gates":[{"id":"g1","type":"NAND","nIn":2,"x":180,"y":100,"flip":true},{"id":"g2","type":"NAND","nIn":2,"x":180,"y":300,"flip":false},{"id":"g3","type":"NAND","nIn":2,"x":380,"y":100,"flip":false},{"id":"g4","type":"NAND","nIn":2,"x":380,"y":300,"flip":true},{"id":"g5","type":"NAND","nIn":2,"x":600,"y":200,"flip":false},{"id":"g6","type":"NAND","nIn":2,"x":800,"y":200,"flip":true}],"wires":[{"id":"w7","from":"Y'","to":"g2.0"},{"id":"w8","from":"Z'","to":"g2.1"},{"id":"w9","from":"g2","to":"g4.0"},{"id":"w10","from":"X","to":"g4.1"},{"id":"w11","from":"g4","to":"g5.0"},{"id":"w12","from":"W'","to":"g5.1"},{"id":"w13","from":"X'","to":"g1.0"},{"id":"w14","from":"Z'","to":"g1.1"},{"id":"w15","from":"g1","to":"g3.0"},{"id":"w16","from":"W","to":"g3.1"},{"id":"w17","from":"g5","to":"g6.0"},{"id":"w18","from":"g3","to":"g6.1"},{"id":"w19","from":"g6","to":"OUT"}],"seq":20}}]};</script>
<script>

/* ===== Quiz player runtime (reads window.QUIZ, uses Engine) ===== */
(function () {
  'use strict';
  var E = Engine, Q = window.QUIZ || { title: 'Quiz', questions: [], subjects: [] }, esc = E.esc;
  Q.questions = (Q.questions || []).map(E.normalizeQuestion);
  var CFG = Q.questions.map(E.questionConfig);
  var root = document.documentElement;
  var screen = document.getElementById('screen');
  var editor = null;
  /* state.qs   = the MAIN run (drives the primary score; never modified by a drill)
     state.dq   = the current practice DRILL run (fresh every time a drill starts)
     state.corrected[qi] = true once a drill solved a question that was missed in the main run
     state.mode = which of the two runs the question screen is showing ('main' | 'drill'); state.order = its question indices */
  /* state.strict is ON by default (the switch on the title screen can turn it off); state.marked[qi] = flagged for review (never affects scoring) */
  var state = { screen: 'title', mode: 'main', strict: true, order: [], idx: 0, qs: {}, dq: {}, corrected: {}, marked: {}, drillNote: null, expand: {} };

  function $(s, r) { return (r || document).querySelector(s); }
  function nl2br(s) { return String(s).replace(/\n/g, '<br>'); }
  function subjectOf(q) { return q.subject || 'General'; }
  function curQ() { return state.order[state.idx]; }
  function S(qi) { return state.mode === 'drill' ? state.dq[qi] : state.qs[qi]; }       /* per-question state of the run on screen */
  function strictOn() { return state.strict && state.mode === 'main'; }                    /* drills are always practice-style */
  function freshQ() { return { status: 'open', attempts: [], hints: 0, wrong: false, showSol: false, circuit: null, draft: '', sel: [] }; }
  function isLowerQ(q) { return E.usesLowerCase(q.target); }
  /* the typed form of an answer, with prime marks typeset as the textbook prime */
  function fx(t) { return esc(String(t).replace(/'/g, '\u2032')); }
  function answerLine(q, cfg, txt) { return /=/.test(txt) ? txt : cfg.outName + ' = ' + txt; }
  /* step dropdowns: options are shown in a fixed shuffled order (seeded by question id + step), results always refer to the author's order */
  function seedOf(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) {
    return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function optionOrder(q, i) {
    var n = q.steps[i].options.length, a = [], r = rng(seedOf(q.id + ':' + i)), k, j, t;
    for (k = 0; k < n; k++) a.push(k);
    for (k = n - 1; k > 0; k--) { j = Math.floor(r() * (k + 1)); t = a[k]; a[k] = a[j]; a[j] = t; }
    if (n > 1 && a.every(function (v, x) { return v === x; })) a.push(a.shift());     /* never show the author's order unchanged */
    return a;
  }
  function destroyEditor() { if (editor) { editor.destroy(); editor = null; } }
  function scrollTop() { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }

  /* ---------------------------------------------------------- theme */
  var SCHEMES = ['aqua', 'blue', 'orange', 'green', 'purple', 'crimson'];
  var PREF = 'logiccircuitquiz:' + (Q.title || 'quiz');
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF) || '{}') || {}; } catch (e) { return {}; } }
  function savePrefs() {
    try { localStorage.setItem(PREF, JSON.stringify({ theme: root.getAttribute('data-theme'), scheme: root.getAttribute('data-scheme') })); } catch (e) { /* ignore */ }
  }
  function syncChrome() {
    $('#selScheme').value = root.getAttribute('data-scheme');
    $('#btnTheme').textContent = root.getAttribute('data-theme') === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
    $('#pTitle').textContent = Q.title || 'Logic Quiz';
    document.title = Q.title || 'Logic Quiz';
  }
  (function initTheme() {
    var p = loadPrefs();
    root.setAttribute('data-theme', p.theme === 'dark' ? 'dark' : 'light');   /* default: light */
    var sc = SCHEMES.indexOf(p.scheme) >= 0 ? p.scheme : (SCHEMES.indexOf(Q.scheme) >= 0 ? Q.scheme : 'aqua');
    root.setAttribute('data-scheme', sc);
    syncChrome();
    $('#btnTheme').addEventListener('click', function () {
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      syncChrome(); savePrefs();
    });
    $('#selScheme').addEventListener('change', function (e) {
      root.setAttribute('data-scheme', e.target.value); syncChrome(); savePrefs();
    });
  })();

  /* ---------------------------------------------------------- modal */
  function confirmModal(title, msg, okText, cancelText) {
    return new Promise(function (resolve) {
      var mr = $('#modalRoot'), prev = document.activeElement;
      mr.innerHTML = '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h3 id="mTitle">' + esc(title) +
        '</h3><p>' + esc(msg) + '</p><div class="row"><button type="button" class="btn" data-m="no">' + esc(cancelText || 'Cancel') +
        '</button><button type="button" class="btn primary" data-m="yes">' + esc(okText || 'OK') + '</button></div></div></div>';
      function close(v) {
        mr.innerHTML = ''; document.removeEventListener('keydown', onKey);
        if (prev && prev.focus) prev.focus();
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') close(false); }
      mr.firstChild.addEventListener('click', function (e) {
        var b = e.target.closest('[data-m]');
        if (b) close(b.getAttribute('data-m') === 'yes'); else if (e.target === mr.firstChild) close(false);
      });
      document.addEventListener('keydown', onKey);
      mr.querySelector('[data-m=no]').focus();
    });
  }

  /* ---------------------------------------------------------- runs (main quiz + practice drill) */
  function allIdx() { return Q.questions.map(function (q, i) { return i; }); }
  function startMain() {
    state.mode = 'main'; state.qs = {}; state.dq = {}; state.corrected = {}; state.marked = {}; state.drillNote = null; state.expand = {};
    state.order = allIdx(); state.idx = 0;
    state.order.forEach(function (i) { state.qs[i] = freshQ(); });
    state.screen = 'question';
    render();
  }
  function missedList() { return allIdx().filter(function (qi) { return !outcome(qi).pass; }); }
  /* A drill replays the questions missed in the main run that have not been corrected yet
     (or all missed ones again once every one of them has been corrected). */
  function drillList() {
    var m = missedList(), rest = m.filter(function (qi) { return !state.corrected[qi]; });
    return rest.length ? rest : m;
  }
  function startDrill() {
    var list = drillList();
    if (!list.length) return;
    state.mode = 'drill'; state.dq = {}; state.drillNote = null; state.order = list; state.idx = 0;
    list.forEach(function (qi) { state.dq[qi] = freshQ(); });
    state.screen = 'question';
    render();
  }
  function backToResults() { state.mode = 'main'; state.order = allIdx(); state.screen = 'results'; render(); }

  function outcome(qi) {
    var st = state.qs[qi];
    if (st.status === 'solved') {
      if (state.strict && st.wrong) return { pass: false, label: 'Solved after a wrong attempt (strict)', icon: '\u2717', cls: 'bad' };
      return { pass: true, label: 'Passed', icon: '\u2713', cls: 'ok' };
    }
    if (st.status === 'skipped') return { pass: false, label: 'Skipped', icon: '\u23ED', cls: 'skip' };
    if (st.status === 'revealed') return { pass: false, label: 'Solution viewed', icon: '\u2717', cls: 'bad' };
    return { pass: false, label: st.attempts.length ? 'Not solved' : 'Not attempted', icon: '\u2717', cls: 'bad' };
  }
  function tally() {
    var totalW = 0, passW = 0, passN = 0, subj = {}, names = [];
    (Q.subjects || []).forEach(function (s) { names.push(s); });
    allIdx().forEach(function (qi) {
      var q = Q.questions[qi], s = subjectOf(q), o = outcome(qi);
      if (!subj[s]) { subj[s] = { name: s, tot: 0, pass: 0, n: 0, np: 0 }; if (names.indexOf(s) < 0) names.push(s); }
      subj[s].tot += q.weight; subj[s].n++; totalW += q.weight;
      if (o.pass) { subj[s].pass += q.weight; subj[s].np++; passW += q.weight; passN++; }
    });
    return { totalW: totalW, passW: passW, passN: passN, pct: totalW ? passW / totalW * 100 : 0, total: Q.questions.length, subj: subj, names: names.filter(function (n) { return subj[n]; }) };
  }

  /* ---------------------------------------------------------- views */
  function render() {
    destroyEditor();
    if (state.screen === 'title') renderTitle();
    else if (state.screen === 'question') renderQuestion();
    else renderResults();
    scrollTop();
  }

  function renderTitle() {
    var n = Q.questions.length, subs = (Q.subjects || []).filter(Boolean), kinds = {};
    Q.questions.forEach(function (q) { kinds[q.type] = true; });
    var what = [];
    if (kinds.circuit) what.push('design logic circuits on a schematic canvas');
    if (kinds.expression) what.push('type Boolean expressions');
    if (kinds.steps) what.push('work through a derivation one dropdown at a time');
    var lead = what.length ? 'In this quiz you ' + what.join(', ').replace(/, ([^,]*)$/, what.length > 1 ? ' and $1' : ', $1') + '. Every answer is checked automatically.' : '';
    var how = '';
    if (n) {
      how += '<h3>Choosing and marking questions</h3><ul>' +
        '<li>Every question is a numbered <b>box</b> above the question. <b>Click any box</b> to jump to that question, in any order; your work on a question is kept while you look at another.</li>' +
        '<li>Boxes start <b>white</b>. <b>Mark for review</b> turns a box <b>yellow</b> (and adds a small flag) so you can find it again; it never changes your score.</li>' +
        '<li>In <b>strict mode</b> a box turns <b>green</b> when its question is correct and <b>red</b> as soon as a wrong answer is checked, or the question is skipped or its solution viewed.</li></ul>';
    }
    if (kinds.circuit) {
      how += '<h3>How the circuit canvas works</h3><ul>' +
        '<li><b>Place</b> gates by dragging them from the toolbar onto the grid (they snap to it), or click a gate button to drop it in.</li>' +
        '<li><b>Wire</b> by clicking an output port (or an input terminal such as <b>A</b>), then a gate input pin — or drag between the two. One signal can feed many pins.</li>' +
        '<li><b>Route</b> a wire around things: after you start it, click empty grid points to add corners. <kbd>Esc</kbd> or right-click removes the last corner (then cancels the wire). Drag a corner to move it; double-click it to remove it.</li>' +
        '<li><b>Move or copy inputs</b>: drag an input box anywhere. The <b>+</b> badge (or <i>Copy input</i>) adds another copy of that input to place right next to the gate that needs it — every copy is the same variable. Right-click or Delete removes a copy.</li>' +
        '<li><b>Flip</b> a selected gate to its De Morgan symbol with <kbd>Space</kbd> or a double-click (when the question allows it). It is the same gate, drawn differently.</li>' +
        '<li><b>Remove</b> a selected gate or wire with <kbd>Delete</kbd> or right-click. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.</li>' +
        '<li>Your circuit is tested against <b>every</b> row of the truth table, so any correct implementation that obeys the rules is accepted.</li></ul>';
    }
    if (kinds.expression) {
      how += '<h3>Typing an expression</h3><ul>' +
        '<li>Write <b>AND</b> by putting letters side by side (<code>AB</code>) or with <code>*</code>, <b>OR</b> with <code>+</code>, and a <b>complement</b> with a prime: <code>A′</code> (type <code>\'</code>) or <code>~A</code>. Brackets work as usual.</li>' +
        '<li>The preview under the box shows how your answer was read, with its number of terms and literals. The symbol buttons insert letters and marks for you.</li>' +
        '<li>An answer that cannot be read (a typo, or a letter the question does not use) is explained on the spot and does <b>not</b> count as an attempt.</li>' +
        '<li>Your expression is compared on <b>every</b> input combination, and the rules listed under the question (such as a sum of products, or a limit on terms or literals) are checked too.</li></ul>';
    }
    if (kinds.steps) {
      how += '<h3>Dropdown steps</h3><ul><li>Pick one option in every dropdown, then press <b>Check answer</b>. You will see which steps are right; fix the others and check again.</li></ul>';
    }
    screen.innerHTML =
      '<section class="card hero"><h1>' + esc(Q.title || 'Logic Quiz') + '</h1>' +
      (lead ? '<p class="muted">' + esc(lead) + '</p>' : '') +
      '<div class="meta"><span class="chip">' + E.plural(n, 'question') + '</span>' +
      subs.map(function (s) { return '<span class="chip plain">' + esc(s) + '</span>'; }).join('') + '</div>' +
      '<div class="strict-box"><label class="switch"><input type="checkbox" id="chkStrict"' + (state.strict ? ' checked' : '') + '> Strict mode <span class="chip plain">default</span></label>' +
      '<p class="muted small" style="margin:.5rem 0 0"><b>On (strict):</b> the first wrong check turns the question red, reveals a <i>Show solution</i> button and counts the question as missed, even if you find the right answer later. Its box in the question list turns red (or green when it is right). Every wrong attempt and its explanation stays on screen for review.<br>' +
      '<b>Off (practice):</b> wrong attempts show feedback and you can retry freely; a question passes once solved.</p></div>' +
      (n ? '<button type="button" class="btn primary big" data-act="start">Start quiz →</button>' : '<p class="muted">This quiz has no questions.</p>') +
      '</section>' + (how ? '<section class="card howto">' + how + '</section>' : '');
  }

  function ruleChips(q, cfg) {
    var c = [];
    if (q.type === 'steps') {
      c.push('<span class="chip">' + E.plural(q.steps.length, 'step') + '</span>');
      c.push('<span class="chip plain">Pick one option per step</span>');
      return c.join('');
    }
    if (q.type === 'expression') {
      var lower = isLowerQ(q), vs = cfg.vars.map(function (v) { return lower ? v.toLowerCase() : v; });
      var op = q.outerOp, unit = op === 'and' ? 'factor' : 'term';
      c.push('<span class="chip">Variables: ' + esc(vs.join(', ')) + '</span>');
      c.push('<span class="chip">' + (q.evalMode === 'literal' ? 'Must match the required form (order does not matter)' : 'Any equivalent expression is accepted') + '</span>');
      if (op === 'or') c.push('<span class="chip">' + (q.twoLevel ? 'Sum of products (SOP)' : 'Top-level OR') + '</span>');
      else if (op === 'and') c.push('<span class="chip">' + (q.twoLevel ? 'Product of sums (POS)' : 'Top-level AND') + '</span>');
      else if (op === 'xor') c.push('<span class="chip">Top-level XOR</span>');
      if (q.canonical) c.push('<span class="chip">Every ' + unit + ' has all ' + vs.length + ' variables</span>');
      if (q.noDup) c.push('<span class="chip">No duplicate ' + unit + 's</span>');
      if (q.maxTerms) c.push('<span class="chip">At most ' + E.plural(q.maxTerms, unit) + '</span>');
      if (q.maxLiterals) c.push('<span class="chip">At most ' + E.plural(q.maxLiterals, 'literal') + '</span>');
      return c.join('');
    }
    c.push('<span class="chip">Gates: ' + esc(q.gates.join(', ') || 'none') + '</span>');
    var r = q.pinRule;
    c.push('<span class="chip">' + (r.mode === 'strict' ? 'Exactly ' + r.n + '-input gates' : 'Up to ' + r.n + ' inputs per gate') + '</span>');
    c.push('<span class="chip">Inputs: ' + esc(E.terminalNames(cfg).join(', ')) + (q.complements ? '' : ' (no complements)') + '</span>');
    if (q.noNotUse) c.push('<span class="chip">No gate used as a NOT</span>');
    if (q.maxDepth) c.push('<span class="chip">Max ' + E.plural(q.maxDepth, 'level') + '</span>');
    if (q.maxGates) c.push('<span class="chip">Max ' + E.plural(q.maxGates, 'gate') + '</span>');
    c.push('<span class="chip plain">' + (q.deMorgan ? 'De Morgan symbols allowed' : 'Standard symbols only') + '</span>');
    return c.join('');
  }

  /* ---- answer areas for the non-circuit question types ---- */
  function exprAnswerHTML(q, cfg, st) {
    var lower = isLowerQ(q), vs = cfg.vars.map(function (v) { return lower ? v.toLowerCase() : v; });
    var ph = vs.length > 2 ? vs[0] + ' + ' + vs[1] + "'" + vs[2] : (vs[0] || 'A') + " + " + (vs[1] || 'B') + "'";
    var keys = vs.map(function (v) { return '<button type="button" class="key" data-key="' + esc(v) + '" aria-label="Insert ' + esc(v) + '">' + esc(v) + '</button>'; }).join('') +
      '<button type="button" class="key op" data-key="\'" aria-label="Insert complement (prime)" title="Complement (prime)">′</button>' +
      '<button type="button" class="key op" data-key="+" aria-label="Insert OR (plus)" title="OR">+</button>' +
      '<button type="button" class="key op" data-key="(" aria-label="Insert opening bracket">(</button>' +
      '<button type="button" class="key op" data-key=")" aria-label="Insert closing bracket">)</button>' +
      '<button type="button" class="key wide" data-key="\\b" aria-label="Delete the character before the cursor" title="Backspace">⌫</button>' +
      '<button type="button" class="key wide" data-key="\\c" aria-label="Clear the answer">Clear</button>';
    return '<div class="answer expr" id="qAnswer"><label class="alabel" for="exprIn">Your answer</label>' +
      '<div class="exprline"><span class="exlhs" aria-hidden="true">' + esc(cfg.outName) + ' =</span>' +
      '<input id="exprIn" class="input exprin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="done" ' +
      'aria-label="Your answer for ' + esc(cfg.outName) + '" aria-describedby="exprPrev" placeholder="' + esc(ph) + '" value="' + esc(st.draft || '') + '"></div>' +
      '<div class="keys" role="group" aria-label="Symbols">' + keys + '</div>' +
      '<div class="exprprev" id="exprPrev" aria-live="polite"></div><div class="exmsg" id="qMsg" role="alert" hidden></div></div>';
  }
  function stepsAnswerHTML(q, st) {
    var h = '<div class="answer stepsq" id="qAnswer">';
    q.steps.forEach(function (stp, i) {
      h += '<div class="stepq" data-step="' + i + '"><label class="steplbl" for="sel' + i + '"><span class="stepn">Step ' + (i + 1) + '</span> ' + esc(stp.label) + '</label>' +
        '<div class="selrow"><select id="sel' + i + '" class="input stepsel" data-step="' + i + '"><option value="">— choose an option —</option>' +
        optionOrder(q, i).map(function (k) { return '<option value="' + k + '"' + (st.sel[i] === k ? ' selected' : '') + '>' + esc(stp.options[k]) + '</option>'; }).join('') +
        '</select><span class="smark" aria-hidden="true"></span></div></div>';
    });
    return h + '<div class="exmsg" id="qMsg" role="alert" hidden></div></div>';
  }
  function flash(msg, kind) {
    var m = $('#qMsg');
    if (!m) return;
    if (!msg) { m.hidden = true; m.innerHTML = ''; return; }
    m.className = 'exmsg ' + (kind || 'bad'); m.hidden = false; m.innerHTML = msg;
  }
  /* live preview under the expression box: how the answer was read, with term / literal counts; never says right or wrong */
  function exprPreview() {
    var qi = curQ(), q = Q.questions[qi], cfg = CFG[qi], st = S(qi), box = $('#exprPrev'), inp = $('#exprIn');
    if (!box || !inp) return;
    var txt = inp.value;
    if (!txt.trim()) { box.className = 'exprprev'; box.innerHTML = '<span class="muted">Preview: your answer appears here as you type.</span>'; return; }
    var p = E.parseExpression(txt);
    if (!p.ok) { box.className = 'exprprev warn'; box.innerHTML = '<b>Cannot be read yet:</b> ' + esc(p.error); return; }
    var lower = isLowerQ(q), unknown = p.vars.filter(function (v) { return cfg.vars.indexOf(v) < 0; });
    var shown = E.formatExpr(p.ast, lower);
    if (unknown.length) {
      box.className = 'exprprev warn';
      box.innerHTML = '<b>Unknown variable' + (unknown.length > 1 ? 's' : '') + ':</b> ' + esc(unknown.map(function (v) { return lower ? v.toLowerCase() : v; }).join(', ')) +
        ' — this question uses ' + esc(cfg.vars.map(function (v) { return lower ? v.toLowerCase() : v; }).join(', ')) + '.';
      return;
    }
    var stt = E.exprStats(p.ast, q), unit = q.outerOp === 'and' ? 'factor' : 'term';
    box.className = 'exprprev ok';
    box.innerHTML = '<span class="muted">Read as</span> <code class="fx">' + esc(cfg.outName) + ' = ' + fx(shown) + '</code> <span class="muted small">· ' + E.plural(stt.terms, unit) + ', ' + E.plural(stt.literals, 'literal') + '</span>';
  }
  function onExprInput() {
    var st = S(curQ()), inp = $('#exprIn');
    if (!inp) return;
    st.draft = inp.value; flash(''); exprPreview();
  }
  function insertKey(k) {
    var inp = $('#exprIn');
    if (!inp || inp.readOnly) return;
    var s0 = inp.selectionStart, e0 = inp.selectionEnd, v = inp.value;
    if (s0 == null) { s0 = e0 = v.length; }
    if (k === '\\c') { inp.value = ''; s0 = e0 = 0; }
    else if (k === '\\b') {
      if (s0 === e0 && s0 > 0) s0--;
      inp.value = v.slice(0, s0) + v.slice(e0); e0 = s0;
    } else { inp.value = v.slice(0, s0) + k + v.slice(e0); s0 = e0 = s0 + k.length; }
    inp.focus();
    try { inp.setSelectionRange(s0, e0); } catch (err) { /* ignore */ }
    onExprInput();
  }
  /* locks / unlocks the answer widgets and shows the per-step marks of the last check */
  function syncAnswer() {
    var qi = curQ(), q = Q.questions[qi], st = S(qi), done = st.status !== 'open', box = $('#qAnswer');
    if (!box) return;
    box.classList.toggle('ok', st.status === 'solved');
    box.classList.toggle('done', done);
    if (q.type === 'expression') {
      var inp = $('#exprIn');
      if (inp) { inp.readOnly = done; inp.setAttribute('aria-readonly', done ? 'true' : 'false'); }
      Array.prototype.forEach.call(box.querySelectorAll('.key'), function (b) { b.disabled = done; });
    } else if (q.type === 'steps') {
      var last = st.attempts.length ? st.attempts[st.attempts.length - 1] : null;
      Array.prototype.forEach.call(box.querySelectorAll('.stepq'), function (row) {
        var i = +row.getAttribute('data-step'), sel = row.querySelector('select'), mk = row.querySelector('.smark');
        sel.disabled = done;
        var r = last && last.result.steps[i], same = r && r.pick === st.sel[i] && st.sel[i] != null;
        row.classList.toggle('ok', !!(same && r.ok));
        row.classList.toggle('bad', !!(same && r.ok === false));
        mk.textContent = same ? (r.ok ? '✓ right' : '✗ not right') : '';
      });
    }
  }

  function renderQuestion() {
    var qi = curQ(), q = Q.questions[qi], cfg = CFG[qi], st = S(qi), drill = state.mode === 'drill', circ = q.type === 'circuit';
    var given = '';
    if (circ) given = '<div class="qtarget"><span class="lbl">Target function</span><code>' + esc(q.target) + '</code></div>';
    else if (q.type === 'expression' && q.showTarget) given = '<div class="qtarget"><span class="lbl">Given</span><code class="fx">' + fx(q.target) + '</code></div>';
    screen.innerHTML =
      (drill ? '<div class="drillbar"><button type="button" class="btn sm" data-act="results">← Go back to quiz results</button>' +
        '<span class="chip aqua">🎯 Practice drill · ' + E.plural(state.order.length, 'question') + '</span>' +
        '<span class="muted small">Strict marking is off here, and your main score will not change.</span></div>' : '') +
      '<div class="qpick"><nav class="pills" id="qPills" aria-label="Choose a question"></nav><div class="legend" id="qLegend"></div></div>' +
      '<article class="card qcard" id="qCard">' +
      '<div class="qhead"><span class="qnum">Question ' + (qi + 1) + (drill ? '' : ' of ' + state.order.length) + '</span>' +
      (drill ? '<span class="chip aqua">🎯 Practice ' + (state.idx + 1) + ' of ' + state.order.length + '</span>' : '') +
      '<span class="chip">' + esc(subjectOf(q)) + '</span>' +
      (q.weight !== 1 ? '<span class="chip plain">weight ×' + q.weight + '</span>' : '') +
      (strictOn() ? '<span class="chip plain">Strict mode</span>' : '') +
      '<span id="qBadge"></span>' +
      '<button type="button" class="btn sm mark-btn" id="qMark" data-act="mark" aria-pressed="false"></button></div>' +
      '<div class="qprompt rich">' + E.sanitizeHTML(q.promptHTML) + '</div>' + given +
      '<div class="chips">' + ruleChips(q, cfg) + '</div>' +
      '<div id="qHints" class="qhints"></div>' +
      (circ ? '<div id="qEditor"></div>' : q.type === 'expression' ? exprAnswerHTML(q, cfg, st) : stepsAnswerHTML(q, st)) +
      '<div id="qActions" class="qactions"></div>' +
      '<div id="qFeedback"></div>' +
      '<div id="qNav" class="qnav"></div>' +
      '</article>';
    if (circ) {
      editor = E.createEditor($('#qEditor'), {
        config: cfg, circuit: st.circuit, readOnly: st.status !== 'open',
        onChange: function (c) { st.circuit = c; }
      });
    } else if (q.type === 'expression') exprPreview();
    refreshDynamic();
  }

  /* Colour of a question box ('' = white). Marked-for-review is a separate flag (yellow) that a result colour overrides.
     Strict mode turns a box red at the first wrong check; practice mode only shows final outcomes (solved / skipped / solution viewed). */
  function pillClass(st) {
    if (st.status === 'solved') return (strictOn() && st.wrong) ? 'bad' : 'ok';
    if (st.status === 'skipped' || st.status === 'revealed') return 'bad';
    return (strictOn() && st.wrong) ? 'bad' : '';
  }
  function flagSVG(filled, px) {
    return '<svg viewBox="0 0 16 16" width="' + px + '" height="' + px + '" aria-hidden="true" focusable="false"><path d="M3.5 14.5V1.8M3.5 2.3h9l-2.2 3.1 2.2 3.1h-9" fill="' + (filled ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function pillsHTML() {
    return state.order.map(function (k, i) {
      var c = pillClass(S(k)), mk = !!state.marked[k], cur = i === state.idx;
      var label = 'Question ' + (k + 1) + (mk ? ', marked for review' : '') + (c === 'ok' ? ', correct' : c === 'bad' ? ', incorrect' : '') + (cur ? ', current question' : '');
      return '<button type="button" class="pill' + (c ? ' ' + c : '') + (mk ? ' marked' : '') + (cur ? ' cur' : '') + '" data-go="' + i + '" title="' + label + '" aria-label="' + label + '"' + (cur ? ' aria-current="true"' : '') + '>' + (k + 1) +
        (mk ? '<span class="pf">' + flagSVG(true, 11) + '</span>' : '') + (c ? '<span class="pr" aria-hidden="true">' + (c === 'ok' ? '✓' : '✗') + '</span>' : '') + '</button>';
    }).join('');
  }
  function legendHTML() {
    var strict = strictOn();
    return '<span><i></i>Not answered</span><span><i class="m"></i>Marked for review</span>' +
      '<span><i class="ok"></i>' + (strict ? 'Correct' : 'Solved') + '</span><span><i class="bad"></i>' + (strict ? 'Wrong, skipped or solution viewed' : 'Skipped or solution viewed') + '</span>';
  }
  function hintsHTML(q, st) {
    if (!q.hints.length) return '';
    var h = '';
    for (var i = 0; i < st.hints; i++) {
      h += '<div class="hint"><div class="hint-h">Hint ' + (i + 1) + ':</div><div class="rich">' + E.sanitizeHTML(q.hints[i]) + '</div></div>';
    }
    if (st.hints < q.hints.length && st.status === 'open') {
      h += '<button type="button" class="btn btn-hint" data-act="hint">\uD83D\uDCA1 ' + (st.hints ? 'Next Hint' : 'Hint') + '</button>';
    }
    return h;
  }
  function actionsHTML(st, q) {
    var h = '';
    if (st.status === 'open') {
      h += '<button type="button" class="btn primary" data-act="check">\u2714 ' + (q.type === 'circuit' ? 'Check circuit' : 'Check answer') + '</button>';
      if (strictOn() && st.wrong) h += '<button type="button" class="btn" data-act="solution">\uD83D\uDC41 Show solution</button>';
      h += '<button type="button" class="btn ghost danger" data-act="skip">Skip question</button>';
    } else if (st.status === 'solved') {
      var missed = strictOn() && st.wrong;
      h += '<div class="banner ok">\u2713 ' + (q.type === 'circuit' ? 'Correct circuit found!' : 'Correct answer!') +
        (missed ? '<small>Strict mode: this question is still counted as missed because of an earlier wrong attempt (shown below).</small>' : '') +
        (state.mode === 'drill' ? '<small>\uD83C\uDFAF Corrected! It will be marked as solved in practice on your results page (your score stays the same).</small>' : '') + '</div>';
    } else {
      h += '<div class="banner bad">' + (st.status === 'skipped' ? 'Question skipped' : 'Solution viewed') + (state.mode === 'drill' ? ' \u2014 not corrected this time.' : ' \u2014 counted as incorrect.') + '</div>';
      if (st.status === 'skipped' && !st.showSol) h += '<button type="button" class="btn" data-act="solution">\uD83D\uDC41 Show solution</button>';
    }
    return h;
  }
  function issuesHTML(r) {
    if (!r.issues.length) return '';
    var h = '<ul class="issues">';
    r.issues.forEach(function (is) {
      h += '<li>' + esc(is.text) + (is.extra ? '<div class="extra">' + nl2br(esc(is.extra)) + '</div>' : '') + '</li>';
    });
    return h + '</ul>';
  }
  function stepsListHTML(q, picks, res) {
    var h = '<ol class="steps-att">';
    q.steps.forEach(function (stp, i) {
      var r = res ? res.steps[i] : null, pick = picks ? picks[i] : null, has = typeof pick === 'number' && stp.options[pick] != null;
      h += '<li class="' + (r ? (r.ok ? 'ok' : (has ? 'bad' : 'skip')) : '') + '"><span class="muted">' + esc(stp.label) + '</span><br>' +
        (has ? '<b>' + (r ? (r.ok ? '✓ ' : '✗ ') : '') + esc(stp.options[pick]) + '</b>' : '<i class="muted">no answer</i>') + '</li>';
    });
    return h + '</ol>';
  }
  function attemptsHTML(qi) {
    var st = S(qi), cfg = CFG[qi], q = Q.questions[qi];
    if (!st.attempts.length) return '';
    var h = '<section class="attempts"><h3>Your attempts</h3>';
    for (var i = st.attempts.length - 1; i >= 0; i--) {
      var a = st.attempts[i], r = a.result, tail, body;
      if (q.type === 'expression') {
        tail = E.plural(r.terms, q.outerOp === 'and' ? 'factor' : 'term') + ', ' + E.plural(r.literals, 'literal');
        body = '<div class="ans-line"><span class="lbl">Your answer</span><code class="fx">' + fx(answerLine(q, cfg, a.answer)) + '</code></div>';
      } else if (q.type === 'steps') {
        tail = r.right + ' of ' + r.total + ' steps right';
        body = stepsListHTML(q, a.answer, r);
      } else {
        tail = E.plural(r.gates, 'gate') + ', ' + E.plural(r.depth, 'level');
        body = E.renderStatic(a.circuit, cfg);
      }
      h += '<details class="attempt ' + (a.pass ? 'ok' : 'bad') + '" open><summary><span class="att-badge">' + (a.pass ? '✓ Correct' : '✗ Not correct') +
        '</span>Attempt ' + a.n + ' <span class="muted small">· ' + esc(tail) + '</span></summary><div class="att-body">' +
        body + '<p class="att-head">' + esc(r.headline) + '</p>' + (q.type === 'steps' ? stepFeedbackHTML(q, r) : issuesHTML(r)) + '</div></details>';
    }
    return h + '</section>';
  }
  /* per-step feedback: only for steps that were answered wrongly (the author's note for the step, if any) */
  function stepFeedbackHTML(q, r) {
    var items = r.steps.map(function (x, i) { return x.ok === false ? '<li>Step ' + (i + 1) + ': ' + esc(q.steps[i].feedback || q.feedback.step || 'That choice is not right.') + '</li>' : (x.ok === null ? '<li>Step ' + (i + 1) + ' has no answer yet.</li>' : ''); }).join('');
    return items ? '<ul class="issues">' + items + '</ul>' : '';
  }
  function modelAnswerText(q) { return q.modelAnswer || (q.evalMode === 'literal' ? q.target : ''); }
  function solutionHTML(qi) {
    var st = S(qi), q = Q.questions[qi], cfg = CFG[qi];
    if (!st.showSol && st.status !== 'solved') return '';
    var h = '<section class="solution"><h3>' + (st.showSol ? 'Solution' : 'Explanation') + '</h3>';
    h += q.explanationHTML ? '<div class="rich">' + E.sanitizeHTML(q.explanationHTML) + '</div>' : '<p class="muted">The author did not add an explanation for this question.</p>';
    if (q.type === 'expression') {
      var ma = modelAnswerText(q);
      if (ma) {
        var line = '<p><code class="fx big">' + fx(answerLine(q, cfg, ma)) + '</code></p>';
        h += st.showSol ? '<h4 style="margin-top:1rem">Model answer</h4>' + line : '<details><summary>Show the author’s model answer</summary>' + line + '</details>';
      } else if (st.showSol) h += '<p class="muted small">No model answer was provided. Any expression equal to <code class="fx">' + fx(q.target) + '</code> that follows the listed rules is accepted.</p>';
    } else if (q.type === 'steps') {
      var list = '<ol class="steps-att">' + q.steps.map(function (stp) { return '<li class="ok"><span class="muted">' + esc(stp.label) + '</span><br><b>✓ ' + esc(stp.options[stp.correct]) + '</b></li>'; }).join('') + '</ol>';
      h += st.showSol ? '<h4 style="margin-top:1rem">Correct choices</h4>' + list : '<details><summary>Show the correct choices</summary>' + list + '</details>';
    } else if (q.solution && q.solution.gates.length) {
      var circ = E.renderStatic(q.solution, cfg);
      h += st.showSol ? '<h4 style="margin-top:1rem">Correct circuit</h4>' + circ
        : '<details><summary>Show the author’s reference circuit</summary>' + circ + '</details>';
    } else if (st.showSol) h += '<p class="muted small">No reference circuit was provided for this question.</p>';
    return h + '</section>';
  }
  function navHTML(st) {
    var last = state.idx === state.order.length - 1, decided = st.status !== 'open';
    return '<button type="button" class="btn" data-act="prev"' + (state.idx === 0 ? ' disabled' : '') + '>\u2190 Previous</button>' +
      (last ? '<button type="button" class="btn primary" data-act="finish">' + (state.mode === 'drill' ? 'Finish drill &amp; see results' : 'Finish &amp; see results') + '</button>'
        : '<button type="button" class="btn' + (decided ? ' primary' : '') + '" data-act="next">Next \u2192</button>');
  }

  function refreshDynamic() {
    var qi = curQ(), q = Q.questions[qi], st = S(qi);
    $('#qPills').innerHTML = pillsHTML();
    $('#qLegend').innerHTML = legendHTML();
    var mk = !!state.marked[qi], mb = $('#qMark');
    mb.setAttribute('aria-pressed', mk ? 'true' : 'false');
    mb.innerHTML = flagSVG(mk, 14) + (mk ? 'Marked for review' : 'Mark for review');
    $('#qHints').innerHTML = hintsHTML(q, st);
    $('#qActions').innerHTML = actionsHTML(st, q);
    $('#qFeedback').innerHTML = attemptsHTML(qi) + solutionHTML(qi);
    $('#qNav').innerHTML = navHTML(st);
    var miss = strictOn() && st.wrong;
    $('#qCard').classList.toggle('bad', miss);
    $('#qBadge').innerHTML = miss ? '<span class="chip bad">\u2717 Marked incorrect</span>' : '';
    syncAnswer();
  }

  /* ---------------------------------------------------------- actions */
  function scrollToFeedback() {
    var fb = $('#qFeedback');
    if (fb && fb.scrollIntoView) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function doCheck() {
    var qi = curQ(), q = Q.questions[qi], st = S(qi), r, att;
    if (st.status !== 'open') return;
    if (q.type === 'expression') {
      var inp = $('#exprIn'), txt = String(inp ? inp.value : st.draft || '').trim();
      if (!txt) { flash('Type your answer in the box first, then press Check answer.'); if (inp) inp.focus(); return; }
      st.draft = txt;
      r = E.checkExpression(txt, q);
      var unreadable = r.issues.filter(function (is) { return is.code === 'syntax' || is.code === 'vars'; });
      if (unreadable.length) {
        /* a typo or an unknown letter is explained on the spot; it is not a wrong answer and does not count as an attempt */
        flash('<b>' + esc(r.headline) + '</b> ' + unreadable.map(function (is) { return esc(is.text) + (is.extra ? ' <i>' + esc(is.extra) + '</i>' : ''); }).join(' ') +
          ' <span class="muted">This did not count as an attempt.</span>');
        if (inp) inp.focus();
        return;
      }
      att = { n: st.attempts.length + 1, pass: r.pass, answer: txt, result: r };
    } else if (q.type === 'steps') {
      if (!q.steps.some(function (x, i) { return typeof st.sel[i] === 'number'; })) { flash('Choose an option in at least one step first, then press Check answer.'); return; }
      r = E.checkSteps(st.sel, q);
      att = { n: st.attempts.length + 1, pass: r.pass, answer: st.sel.slice(0, q.steps.length), result: r };
    } else {
      var circ = editor.getCircuit();
      if (!circ.wires.length) { editor.toast('Build a circuit first — place gates and wire them up, then press Check.'); return; }
      r = E.checkCircuit(circ, q);
      st.circuit = circ;
      att = { n: st.attempts.length + 1, pass: r.pass, circuit: circ, result: r };
    }
    st.attempts.push(att);
    if (r.pass) {
      st.status = 'solved';
      if (editor) editor.setReadOnly(true);
      if (state.mode === 'drill') state.corrected[qi] = true;
    } else if (strictOn()) st.wrong = true;
    flash('');
    refreshDynamic();
    scrollToFeedback();
  }
  function doSkip() {
    var st = S(curQ());
    if (st.status !== 'open') return;
    confirmModal('Are you sure?', state.mode === 'drill' ? 'Skipping leaves this question uncorrected for now. You will then be able to view the solution.' : 'Skipping counts this question as incorrect. You will then be able to view the solution.', 'Yes, skip', 'Keep trying').then(function (ok) {
      if (!ok) return;
      st.status = 'skipped'; if (editor) editor.setReadOnly(true); refreshDynamic();
    });
  }
  function doSolution() {
    var st = S(curQ());
    st.showSol = true;
    if (st.status === 'open') { st.status = 'revealed'; if (st.circuit === null && editor) st.circuit = editor.getCircuit(); if (editor) editor.setReadOnly(true); }
    refreshDynamic();
    scrollToFeedback();
  }
  function go(i) {
    if (i < 0 || i >= state.order.length) return;
    state.idx = i; render();
  }
  function finish() {
    var ids = state.order, drill = state.mode === 'drill';
    var open = ids.filter(function (qi) { return S(qi).status === 'open'; });
    function show() {
      if (drill) state.drillNote = { n: ids.length, k: ids.filter(function (qi) { return S(qi).status === 'solved'; }).length };
      backToResults();
    }
    if (!open.length) { show(); return; }
    confirmModal(drill ? 'Finish the drill?' : 'Finish the quiz?',
      E.plural(open.length, 'question') + ' still unanswered \u2014 ' + (drill ? 'they stay uncorrected for now.' : 'unanswered questions count as incorrect.'),
      'Finish', 'Keep working').then(function (ok) { if (ok) show(); });
  }

  /* ---------------------------------------------------------- results (always the MAIN run) */
  function detailHTML(qi) {
    var q = Q.questions[qi], st = state.qs[qi], cfg = CFG[qi], dr = state.corrected[qi] ? state.dq[qi] : null;
    var last = st.attempts.length ? st.attempts[st.attempts.length - 1] : null;
    var h = '<div class="detail"><div class="pair"><div><h4>' + (q.type === 'circuit' ? 'Your submitted circuit' : 'Your submitted answer') + '</h4>', lastIssues = '';
    if (q.type === 'expression') {
      var typed = last ? last.answer : (st.draft || '');
      h += typed ? '<p><code class="fx big">' + fx(answerLine(q, cfg, typed)) + '</code></p>' : '<p class="muted">No answer was submitted.</p>';
      if (last && last.result.issues.length) lastIssues = last.result.issues.map(function (is) { return '<li>' + esc(is.text) + '</li>'; }).join('');
    } else if (q.type === 'steps') {
      var any = last || q.steps.some(function (x, i) { return typeof st.sel[i] === 'number'; });
      h += any ? stepsListHTML(q, last ? last.answer : st.sel, last ? last.result : null) : '<p class="muted">No answer was submitted.</p>';
    } else {
      var circ = last ? last.circuit : st.circuit;
      h += (circ && (circ.gates.length || circ.wires.length)) ? E.renderStatic(circ, cfg) : '<p class="muted">No circuit was submitted.</p>';
      if (last && last.result.issues.length) lastIssues = last.result.issues.map(function (is) { return '<li>' + esc(is.text) + '</li>'; }).join('');
    }
    if (lastIssues && q.type !== 'steps') h += '<p class="att-head">Last check:</p><ul class="issues">' + lastIssues + '</ul>';
    h += '</div>';
    if (dr) {
      if (q.type === 'expression') h += '<div><h4>🎯 Your corrected answer <span class="muted small">(solved in practice)</span></h4><p><code class="fx big">' + fx(answerLine(q, cfg, dr.draft || (dr.attempts.length ? dr.attempts[dr.attempts.length - 1].answer : ''))) + '</code></p></div>';
      else if (q.type === 'steps') h += '<div><h4>🎯 Your corrected answer <span class="muted small">(solved in practice)</span></h4>' + stepsListHTML(q, dr.attempts[dr.attempts.length - 1].answer, dr.attempts[dr.attempts.length - 1].result) + '</div>';
      else if (dr.circuit) h += '<div><h4>🎯 Your corrected circuit <span class="muted small">(solved in practice)</span></h4>' + E.renderStatic(dr.circuit, cfg) + '</div>';
    }
    if (q.type === 'expression') {
      var ma = modelAnswerText(q);
      h += '<div><h4>Author’s model answer</h4>' + (ma ? '<p><code class="fx big">' + fx(answerLine(q, cfg, ma)) + '</code></p>' :
        '<p class="muted">No model answer was provided. Any expression equal to <code class="fx">' + fx(q.target) + '</code> that follows the listed rules is accepted.</p>') + '</div>';
    } else if (q.type === 'steps') {
      h += '<div><h4>Correct choices</h4><ol class="steps-att">' + q.steps.map(function (stp) { return '<li class="ok"><span class="muted">' + esc(stp.label) + '</span><br><b>✓ ' + esc(stp.options[stp.correct]) + '</b></li>'; }).join('') + '</ol></div>';
    } else {
      h += '<div><h4>Author’s solution</h4>' + ((q.solution && q.solution.gates.length) ? E.renderStatic(q.solution, cfg) : '<p class="muted">No reference circuit was provided.</p>') + '</div>';
    }
    h += '</div><h4 style="margin-top:1rem">Explanation</h4><div class="rich">' +
      (q.explanationHTML ? E.sanitizeHTML(q.explanationHTML) : '<p class="muted">No explanation provided.</p>') + '</div></div>';
    return h;
  }

  function renderResults() {
    var all = allIdx(), t = tally(), missed = missedList(), fixed = missed.filter(function (qi) { return state.corrected[qi]; });
    var h = '';
    if (state.drillNote) {
      h += '<div class="banner corr">🎯 Drill finished — you corrected ' + state.drillNote.k + ' of ' + state.drillNote.n + ' practice ' +
        (state.drillNote.n === 1 ? 'question' : 'questions') + '. Your main score below is unchanged.</div>';
    }
    h += '<section class="card"><h2 style="margin-bottom:.2em">Results</h2>' +
      '<div class="res-top"><div class="score">' + Math.round(t.pct) + '%</div><div>' +
      '<div class="bar ' + (t.pct >= 90 ? 'ok' : 'bad') + '"><i style="width:' + t.pct.toFixed(1) + '%"></i><u title="90% threshold"></u></div>' +
      '<p class="muted" style="margin:.4rem 0 0">' + t.passN + ' of ' + all.length + ' questions passed · weighted score ' + t.passW.toFixed(t.passW % 1 ? 1 : 0) + ' / ' + t.totalW.toFixed(t.totalW % 1 ? 1 : 0) +
      ' · ' + (state.strict ? 'strict mode' : 'practice mode') + '</p></div></div>';
    h += '<div class="res-actions">' +
      '<button type="button" class="btn primary" data-act="retake">↻ Retake Quiz</button>' +
      (missed.length ? '<button type="button" class="btn aqua" data-act="drill" title="Replay only the questions you missed or skipped">🎯 Retake Missed Questions</button>'
        : '<span class="chip">🎉 Nothing missed — great work!</span>') +
      '<button type="button" class="btn ghost" data-act="home">Back to start</button></div>';
    if (missed.length) {
      h += '<p class="muted small" style="margin:.7rem 0 0" id="missedNote">' + E.plural(missed.length, 'question') + ' missed or skipped' +
        (fixed.length ? ' · <b class="aq-text">🎯 ' + fixed.length + ' corrected in practice</b> (your score above does not change)' : '') + '.</p>';
    }
    h += '</section>';

    h += '<section class="card" style="margin-top:1rem"><h3>Performance by subject</h3><p class="muted small" style="margin-top:-.3rem">Weighted by question weight. ✅ = 90% or higher, ❌ = below 90%.</p>';
    t.names.forEach(function (n) {
      var s = t.subj[n], p = s.tot ? s.pass / s.tot * 100 : 0, good = p >= 90;
      h += '<div class="subj"><div class="subj-h"><span>' + esc(n) + ' <span class="muted small">(' + s.np + '/' + s.n + ' passed)</span></span><span>' + Math.round(p) + '% ' + (good ? '✅' : '❌') + '</span></div>' +
        '<div class="bar ' + (good ? 'ok' : 'bad') + '"><i style="width:' + p.toFixed(1) + '%"></i><u></u></div></div>';
    });
    h += '</section><div class="res-tools"><h3 style="margin:0">Question review</h3><button type="button" class="btn sm" data-act="expand">' + (Object.keys(state.expand).length >= all.length ? 'Collapse all' : 'Show all solutions') + '</button></div>';
    all.forEach(function (qi, i) {
      var q = Q.questions[qi], o = outcome(qi), open = !!state.expand[qi], corr = !o.pass && !!state.corrected[qi];
      h += '<div class="qrow' + (corr ? ' corrected' : '') + '" data-q="' + qi + '"><div class="qrow-h"><span class="qrow-n">' + (i + 1) + '</span><div class="qrow-t"><b>' + esc(E.htmlToText(q.promptHTML).slice(0, 110) || q.target) + '</b>' +
        '<span class="chip plain">' + esc(subjectOf(q)) + '</span> <span class="muted small">×' + q.weight + ' · ' + E.plural(state.qs[qi].attempts.length, 'attempt') + '</span></div>' +
        '<span class="stbox"><span class="st ' + o.cls + '">' + o.icon + ' ' + esc(o.label) + '</span>' +
        (corr ? '<span class="corr-chip" title="Solved in practice! Your score is unchanged.">🎯 Corrected!</span><small class="aq-text">Solved in practice!</small>' : '') + '</span>' +
        '<button type="button" class="btn sm" data-toggle="' + qi + '" aria-expanded="' + open + '">' + (open ? 'Hide' : 'View') + ' solution &amp; circuit</button></div>' +
        (open ? detailHTML(qi) : '') + '</div>';
    });
    screen.innerHTML = h;
  }

  /* ---------------------------------------------------------- events */
  screen.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'exprIn') onExprInput();
  });
  screen.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('select[data-step]')) {
      var st = S(curQ()), i = +t.getAttribute('data-step');
      st.sel[i] = t.value === '' ? null : +t.value;
      flash(''); syncAnswer();
    }
  });
  screen.addEventListener('keydown', function (e) {
    if (e.target.id === 'exprIn' && e.key === 'Enter') { e.preventDefault(); doCheck(); }
  });
  screen.addEventListener('click', function (e) {
    var kb = e.target.closest('[data-key]');
    if (kb) { insertKey(kb.getAttribute('data-key')); return; }
    var t = e.target.closest('[data-act],[data-go],[data-toggle]');
    if (!t) return;
    if (t.hasAttribute('data-go')) {
      go(+t.getAttribute('data-go'));
      var cp = $('.pill.cur'); if (cp && cp.focus) { try { cp.focus({ preventScroll: true }); } catch (err) { /* ignore */ } }   /* keep keyboard users on the picker */
      return;
    }
    if (t.hasAttribute('data-toggle')) {
      var qi = +t.getAttribute('data-toggle');
      if (state.expand[qi]) delete state.expand[qi]; else state.expand[qi] = true;
      var y = window.scrollY; renderResults(); window.scrollTo(0, y);
      return;
    }
    switch (t.getAttribute('data-act')) {
      case 'start': var chk = $('#chkStrict'); state.strict = !!(chk && chk.checked); startMain(); break;
      case 'hint': var st = S(curQ()); st.hints++; refreshDynamic(); break;
      case 'mark': var mq = curQ(); if (state.marked[mq]) delete state.marked[mq]; else state.marked[mq] = true; refreshDynamic(); break;
      case 'check': doCheck(); break;
      case 'skip': doSkip(); break;
      case 'solution': doSolution(); break;
      case 'prev': go(state.idx - 1); break;
      case 'next': go(state.idx + 1); break;
      case 'finish': finish(); break;
      case 'results': backToResults(); break;
      case 'expand':
        if (Object.keys(state.expand).length >= Q.questions.length) state.expand = {};
        else allIdx().forEach(function (k) { state.expand[k] = true; });
        renderResults(); break;
      case 'drill': startDrill(); break;
      case 'retake': startMain(); break;
      case 'home': state.mode = 'main'; state.drillNote = null; state.strict = true; state.screen = 'title'; render(); break;   /* the title screen always offers strict mode as the default */
    }
  });

  render();
})();


</script>
</body>
</html>
